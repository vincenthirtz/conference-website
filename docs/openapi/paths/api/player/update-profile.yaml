get:
  tags:
    - public/auth
  summary: Chaine Twitch effective de la joueuse et son origine.
  description: >-
    Valeur que publie la fiche publique `/player/{userId}` — la declaration de la joueuse, sinon celle saisie par sa capitaine sur la fiche de roster — et d'ou elle vient. Sert au formulaire « Mon profil », qui affichait un champ vide quand la valeur publiee venait du roster.
  operationId: getPlayerTwitchSource
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Chaine publiee (ou null) et son origine.
      content:
        application/json:
          schema:
            type: object
            required:
              - twitch
              - twitchOrigin
            properties:
              twitch:
                type:
                  - string
                  - 'null'
                description: Valeur publiee (handle nu, @handle ou URL), null si aucune.
              twitchOrigin:
                type:
                  - string
                  - 'null'
                enum:
                  - self
                  - roster
                  - null
                description: >-
                  `self` = declaree par la joueuse sur son compte ; `roster` = saisie par sa capitaine ou une manager ; null si aucune chaine.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
patch:
  tags:
    - public/auth
  summary: Met a jour le profil de la joueuse (BattleTag, nom, SR, poste, Twitch, avatar).
  operationId: updatePlayerProfile
  security:
    - PlayerBearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: player.update-profile
  responses:
    '200':
      description: >-
        Profil mis a jour. Les champs modifies sont renvoyes en echo. `rosterSynced: false` signale que les metadonnees du compte sont ecrites mais que la propagation vers les fiches de roster (`team_members`) a echoue : renvoyer la meme requete la retente.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            required:
              - success
              - rosterSynced
            properties:
              success:
                type: boolean
              rosterSynced:
                type: boolean
                description: >-
                  false si l'ecriture sur les fiches de roster a echoue (le compte, lui, est a jour).
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
