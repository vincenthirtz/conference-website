get:
  tags:
    - public/auth
  summary: Mes echeances — matchs, scrims et date butoir de roster.
  description: |
    Agenda personnel (lot J2 de docs/PLAN-espace-joueur.md). Porte TOUTES
    les equipes de l'appelante (appartenances + equipes encadrees) :
    volontairement insensible au selecteur d'equipe, un manager qui en
    encadre trois a UN agenda. Inspectable `?as=`.
  operationId: getPlayerAgenda
  security:
    - PlayerBearer: []
  parameters:
    - $ref: '#/components/parameters/SubjectAs'
  responses:
    '200':
      description: Entrees triees par date croissante.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
