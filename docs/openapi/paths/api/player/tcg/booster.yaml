post:
  tags:
    - public/auth
  summary: Acheter un booster TCG avec ses pieces.
  description: |
    La monnaie se GAGNE (victoires), elle ne s'achete pas en argent reel :
    aucun moyen de paiement n'est relie a cet endpoint. Monnaie achetable +
    contenu aleatoire formerait une loot box payante.

    L'achat ne cree qu'un paquet FERME ; le tirage appartient a
    l'ouverture. Depuis le 2026-09-15, l'achat est UNE transaction SQL
    (`tcg_purchase_booster`, migration `tcg_wallet_atomic_balance.sql`) :
    verrou de la ligne de porte-monnaie, solde relu par `SUM(amount)` sur le
    registre, paquet, ecriture `booster_purchase` et cache — tout ou rien.
    L'ancien enchainement en trois requetes laissait un recalcul concurrent
    effacer le debit (3 boosters pour le prix de 2). Un 500 ne laisse donc
    jamais un paquet gratuit ni des pieces prelevees sans paquet.
    Rate-limit 20 / min.
  operationId: buyPlayerTcgBooster
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Booster achete (ferme).
      content:
        application/json:
          schema:
            type: object
            properties:
              packId:
                type: string
                format: uuid
              price:
                type: integer
    '400':
      description: |
        `code: insufficient_funds` — le solde ne couvre pas le prix. La
        reponse rappelle `balance` et `price`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              balance:
                type: integer
              price:
                type: integer
    '401':
      $ref: '#/components/responses/Unauthorized'
    '409':
      description: |
        `code: balance_changed` — verrou du porte-monnaie non obtenu
        (mouvement concurrent). Reessayer est sur.
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
    '503':
      description: |
        `code: purchase_unavailable` — la fonction SQL d'achat n'est pas
        deployee : l'achat est REFUSE plutot que fait sans verrou.
