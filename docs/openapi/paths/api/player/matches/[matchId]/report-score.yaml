post:
  tags:
    - public/auth
  summary: Self-report du score d'un match par un capitaine (pendant web du report bot).
  description: |
    Permet a un CAPITAINE, depuis l'espace capitaine du site, de rapporter
    le score final d'un de ses matchs. Reutilise la logique du handler bot
    `/api/bot/v1/matches/{matchId}/report` : un report par equipe (table
    `match_score_reports`, unique sur `(match_id, team_side)`, upsert
    idempotent).

    Reconciliation :
      - un seul report present  -> `awaiting_opponent` (rien ne change)
      - les deux concordent     -> finalisation via applyMatchScore
                                   (status='finished', propagation bracket,
                                   notifications Discord)
      - les deux divergent      -> `matches.status='disputed'` (+ raison
                                   auto, event bot `match.disputed`, embed
                                   staff pour les matchs de tournoi)

    Droit de rapport : etre `teams.captain_id` de team1 OU team2 du match.
    Re-soumission supportee (idempotent) ; corriger son report pour rejoindre
    celui de l'adversaire ferme une dispute ouverte.

    Gardes d'integrite (2026-09-16) :
      - pas de report avant `scheduled_at`, sauf match `ongoing`
        (`409 MATCH_NOT_STARTED`) ;
      - le couple de scores doit etre un resultat final possible du best-of
        (`best_of`, sinon `match_format`) : en BO impair le vainqueur a
        exactement ceil(N/2) manches et le perdant moins ; en BO pair, N/2+1
        contre au plus N/2-1, ou nul N/2-N/2. Format absent, inconnu ou
        contradictoire : aucune borne (`400 INVALID_SCORE_FOR_FORMAT`) ;
      - deux capitaines qui finalisent au meme instant : une seule
        finalisation, l'autre recoit `200 finalized` (deja applique) ou
        `409 FINALIZATION_IN_PROGRESS` ;
      - quand le staff rouvre le match sans fixer de score (dispute resolue
        en pending/ongoing ou annulee), les reports des deux camps sont
        purges : il faut deux nouveaux reports.
  operationId: reportPlayerMatchScore
  security:
    - PlayerBearer: []
  parameters:
    - name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [team1Score, team2Score]
          properties:
            team1Score:
              type: integer
              minimum: 0
              description: Nombre de maps gagnees par team1 (agregat de serie).
            team2Score:
              type: integer
              minimum: 0
              description: Nombre de maps gagnees par team2 (agregat de serie).
  responses:
    '200':
      description: |
        Report enregistre. Le champ `status` indique l'issue :
        `awaiting_opponent`, `finalized` ou `disputed`.
      content:
        application/json: {}
    '400':
      description: |
        Entree invalide : identifiant, scores non entiers/negatifs, match bye
        ou incomplet, ou `code: INVALID_SCORE_FOR_FORMAT` (couple de scores
        impossible pour le best-of du match).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: |
        `code` : `MATCH_FINALIZED` (match clos, ou clos pendant le report —
        modification reservee au staff), `MATCH_NOT_STARTED` (coup d'envoi pas
        encore passe et match pas `ongoing`), `FINALIZATION_IN_PROGRESS`
        (l'autre capitaine finalise le meme score a l'instant),
        `DISPUTE_UNDER_STAFF_REVIEW` (dispute ouverte par le staff : l'accord
        des capitaines ne la referme pas ; le report est enregistre et seul le
        staff tranche).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      $ref: '#/components/responses/ServerError'
