get:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
  tags:
    - public/teams
  summary: Sante d'equipe — constats derives, ordonnes par gravite.
  description: >-
    Diagnostic de l'equipe de l'appelant : capitanat vacant, roster incomplet,
    BattleTags manquants ou non verifies, comptes Discord non lies, comptes
    jamais utilises, rythme non declare, invisibilite pour les scrims, debriefs
    en retard. AUCUN score agrege et aucun indicateur declaratif — uniquement
    des codes comptes, que l'UI traduit et relie a la surface qui repare.
    Reservee a qui GERE l'equipe (`getManagedTeam`) ; repond 200 avec `teamId:
    null` sinon. Une liste vide est la reponse normale d'une equipe en regle.
  operationId: playerTeamHealth
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Constats de l'equipe geree par l'appelant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamHealth'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '429':
      $ref: '#/components/responses/RateLimited'
