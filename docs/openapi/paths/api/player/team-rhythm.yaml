get:
  tags:
    - public/teams
  summary: Rythme de mon equipe — disponibilite recurrente du roster.
  description: >-
    Grille hebdomadaire agregee de l'equipe de l'appelant : sa propre
    declaration, la heatmap de tous les membres, le noyau (creneaux ou
    l'effectif requis est atteint) et les prochaines occurrences reelles de ce
    noyau. Ouverte a TOUT membre, sans permission de gestion : declarer sa
    disponibilite est un geste de membre. Repond 200 avec `teamId: null` quand
    l'appelant n'a pas d'equipe.
  operationId: playerTeamRhythm
  security:
    - PlayerBearer: []
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
    - in: query
      name: tz
      required: false
      schema:
        type: string
      description: >-
        Fuseau IANA de repli pour le rendu, utilise seulement si l'appelant n'a
        encore rien declare.
  responses:
    '200':
      description: Rythme de l'equipe, exprime dans le fuseau de l'appelant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamRhythm'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '429':
      $ref: '#/components/responses/RateLimited'
put:
  tags:
    - public/teams
  summary: Declarer MES creneaux recurrents dans mon equipe.
  operationId: playerTeamRhythmUpdate
  parameters:
    - $ref: '#/components/parameters/TeamScope'
  security:
    - PlayerBearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - slots
          properties:
            slots:
              type: array
              description: >-
                Cles "<jour ISO 1-7>-<minutes depuis minuit>", granularite
                horaire, dans le fuseau `timezone`. Le tableau vide retire la
                declaration.
              items:
                type: string
            timezone:
              type: string
              description: Fuseau IANA du membre. Defaut Europe/Paris.
  responses:
    '200':
      description: Declaration enregistree.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              slots:
                type: array
                items:
                  type: string
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      description: L'appelant n'appartient a aucune equipe active.
    '429':
      $ref: '#/components/responses/RateLimited'
