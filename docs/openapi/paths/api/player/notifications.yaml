get:
  tags:
    - public/auth
  summary: Liste les notifications du joueur (cloche).
  operationId: getPlayerNotifications
  security:
    - PlayerBearer: []
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - unread
          - read
          - all
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    '200':
      description: Notifications.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
