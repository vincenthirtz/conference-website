get:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
  tags:
    - public/auth
  summary: Prochain match du joueur connecte + token check-in.
  description: |
    Choix du match : d'abord un match pending dont le check-in de l'equipe est
    ouvert et pas encore fait ; sinon le plus tot programme parmi les pending
    dates depuis moins d'une heure et les ongoing quel que soit leur horaire
    (une soiree en retard ne fait pas disparaitre le match en cours).
  operationId: getPlayerNextMatch
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Match + team + checkin status. Tous les champs peuvent etre null si
        le joueur n'a pas d'equipe ou de match a venir.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlayerNextMatch'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '500':
      $ref: '#/components/responses/ServerError'
