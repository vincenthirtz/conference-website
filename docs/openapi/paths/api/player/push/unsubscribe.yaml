delete:
  summary: Supprimer une subscription Web Push du joueur courant.
  description: |
    Supprime uniquement les rows `user_id = current user`. Endpoint inconnu
    ou appartenant à un autre user → `404` (anti-énumération). `withAuthRoute`.
  operationId: playerPushUnsubscribe
  tags:
    - public
  security:
    - PlayerBearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - endpoint
          properties:
            endpoint:
              type: string
              format: uri
              maxLength: 2048
  responses:
    '204':
      description: Subscription supprimée.
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/ServerError'
