get:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
  tags:
    - public/auth
  summary: Liste les conversations du joueur (messagerie player ↔ player/staff).
  operationId: listPlayerConversations
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Conversations.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
post:
  tags:
    - public/auth
  summary: Cree une nouvelle conversation / envoie un message.
  operationId: createPlayerMessage
  parameters:
    - $ref: '#/components/parameters/TeamScope'
  security:
    - PlayerBearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - recipientId
            - body
          properties:
            recipientId:
              type: string
              format: uuid
            body:
              type: string
              maxLength: 5000
            subject:
              type: string
  responses:
    '201':
      description: Message envoye.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
