get:
  summary: Search users by email, display name, Discord ID.
  operationId: adminSearchUsers
  tags:
    - admin/users
  security:
    - StaffSession: []
  x-zod-query: admin.users/search.query
  responses:
    '200':
      description: Results.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
