get:
  summary: List users with admin metadata (search & paginate).
  operationId: adminManageUsersList
  tags:
    - admin/users
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: search
      description: Free-text match on email, display_name, role, or team battle_tag.
      schema:
        type: string
    - in: query
      name: role
      description: Exact role filter (case-insensitive) on user_metadata.role.
      schema:
        type: string
    - in: query
      name: limit
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 200
    - in: query
      name: offset
      schema:
        type: integer
        default: 0
        minimum: 0
  responses:
    '200':
      description: Users.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
patch:
  summary: Update a user (role, display_name, etc.).
  operationId: adminManageUsersPatch
  tags:
    - admin/users
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Delete (or ban) a user.
  operationId: adminManageUsersDelete
  tags:
    - admin/users
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: userId
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
