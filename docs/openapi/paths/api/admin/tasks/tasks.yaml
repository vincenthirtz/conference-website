post:
  tags:
    - admin/tasks
  summary: Cree une carte (createTaskCore). Emet task.created + task.board_changed.
  operationId: adminCreateTask
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.tasks.tasks.create
  responses:
    '201':
      description: Carte creee.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
