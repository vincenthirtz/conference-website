patch:
  tags:
    - admin/tasks
  summary: Edite un item de checklist (label, isDone, position).
  operationId: adminUpdateTaskChecklistItem
  x-zod-query: admin.tasks/checklist/[id].query
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.tasks.checklist.update
  responses:
    '200':
      description: Item mis a jour.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
delete:
  tags:
    - admin/tasks
  summary: Supprime un item de checklist.
  operationId: adminDeleteTaskChecklistItem
  x-zod-query: admin.tasks/checklist/[id].query
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    '200':
      description: Item supprime.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
