patch:
  tags:
    - admin/tasks
  summary: Edite un item de checklist (label, isDone, position).
  operationId: adminUpdateTaskChecklistItem
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            label: {type: string, minLength: 1, maxLength: 500}
            isDone: {type: boolean}
            position: {type: integer, minimum: 0}
  responses:
    '200':
      description: Item mis a jour.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
delete:
  tags:
    - admin/tasks
  summary: Supprime un item de checklist.
  operationId: adminDeleteTaskChecklistItem
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    '200':
      description: Item supprime.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
