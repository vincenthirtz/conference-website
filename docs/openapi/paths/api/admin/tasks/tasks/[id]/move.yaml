patch:
  tags:
    - admin/tasks
  summary: Deplace une carte (moveTaskCore). Emet task.moved + task.board_changed.
    Idempotent.
  operationId: adminMoveTask
  x-zod-query: admin.tasks/tasks/[id].query
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.tasks.tasks.move
  responses:
    '200':
      description: Carte deplacee.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
