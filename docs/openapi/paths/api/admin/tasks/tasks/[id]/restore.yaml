patch:
  tags:
    - admin/tasks
  summary: Restaure une carte de la corbeille (restoreTaskCore). Loggue
    task_restore. Emet task.board_changed.
  operationId: adminRestoreTask
  description: |
    Repositionne une carte soft-deleted comme active : `deleted_at = NULL`
    + `position = max(position dans sa colonne)+1`. 404 `task_not_found` si
    la carte n'existe pas, 409 `not_deleted` si elle est deja active, 409
    `column_gone` si la colonne d'origine a disparu. Pas d'event bot.
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    '200':
      description: '`{ task: NormalizedTask }`.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
