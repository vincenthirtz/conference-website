get:
  tags:
    - admin/tasks
  summary: Detail d'une carte.
  operationId: adminGetTask
  x-zod-query: admin.tasks/tasks/[id].query
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    '200':
      description: Carte.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  tags:
    - admin/tasks
  summary: Edite une carte (title, description, priority, dueDate, labels). Emet
    task.board_changed.
  operationId: adminUpdateTask
  x-zod-query: admin.tasks/tasks/[id].query
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.tasks.tasks.update
  responses:
    '200':
      description: Carte mise a jour.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
delete:
  tags:
    - admin/tasks
  summary: Soft-delete d'une carte (deleted_at = now()). Emet task.board_changed.
  operationId: adminDeleteTask
  x-zod-query: admin.tasks/tasks/[id].query
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    '200':
      description: Carte supprimee.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
