get:
  tags:
    - admin/tasks
  summary: Corbeille — cartes soft-deleted du tenant (deleted_at IS NOT NULL).
  operationId: adminListDeletedTasks
  description: |
    Cartes supprimees (`deleted_at IS NOT NULL`) du tenant, filtrees par
    `boardId` si fourni, triees `deleted_at` DESC, plafonnees (defaut 100).
    Montre TOUT, y compris les cartes dont le board est archive. La
    restauration se fait via `PATCH /api/admin/tasks/tasks/{id}/restore`.
  security:
    - StaffSession: []
  parameters:
    - name: boardId
      in: query
      required: false
      schema: {type: string, format: uuid}
    - name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500}
  responses:
    '200':
      description: '`{ tasks: [{ id, title, boardId, boardName, columnId, columnName,
        priority, dueDate, deletedAt }] }`.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
