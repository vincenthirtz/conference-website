post:
  tags:
    - admin/tasks
  summary: Cree une colonne dans un board (position = max+1). Emet task.board_changed.
  operationId: adminCreateTaskColumn
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.tasks.columns.create
  responses:
    '201':
      description: Colonne creee.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
