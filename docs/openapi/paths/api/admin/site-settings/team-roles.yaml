get:
  summary: Read team role labels (captain, member, etc.).
  operationId: adminGetSiteSettingsTeamRoles
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Team roles.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
put:
  summary: Replace team role labels.
  operationId: adminPutSiteSettingsTeamRoles
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Saved.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
