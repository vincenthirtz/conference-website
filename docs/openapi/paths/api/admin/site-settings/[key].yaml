parameters:
  - in: path
    name: key
    required: true
    schema:
      type: string
get:
  summary: Read a single site setting by key.
  operationId: adminGetSiteSetting
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Value.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  summary: Patch a site setting.
  operationId: adminPatchSiteSetting
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Delete a site setting key.
  operationId: adminDeleteSiteSetting
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
