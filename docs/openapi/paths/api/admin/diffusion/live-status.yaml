get:
  tags:
    - admin/broadcast
  summary: Un run est-il en direct ? (point rouge de la barre Diffusion)
  description: |
    Tout le staff (rôle caster et plus), espace du staff. Une ligne lue :
    le run `live` le plus récent. `live: false` et `runName: null` sinon.
  operationId: adminDiffusionLiveStatus
  security:
    - StaffSession: []
  responses:
    '200':
      description: '`{ live: boolean, runName: string | null }`.'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
