get:
  tags:
    - admin
  summary: Etat Discord de chaque equipe (stocke + vu par le bot).
  description: >-
    Remplace le cron `team-channel-reconcile`, supprime. Renvoie pour chaque
    equipe ce que le SITE a enregistre (`teams.discord_*`) ET ce que le BOT a vu
    la derniere fois (`team_discord_channels`). Les deux, parce qu'ils divergent
    : un id stocke peut pointer sur un salon supprime, et c'est le cas qui
    interesse le plus. `live` vaut null quand l'etat n'a jamais ete rafraichi.
  operationId: adminGetDiscordTeamChannels
  security:
    - StaffSession: []
  responses:
    '200':
      description: Une entree par equipe du tenant.
      content:
        application/json:
          schema:
            type: object
            required:
              - teams
            properties:
              teams:
                type: array
                items:
                  type: object
                  properties:
                    teamId:
                      type: string
                      format: uuid
                    name:
                      type: [string, 'null']
                    slug:
                      type: [string, 'null']
                    isActive:
                      type: boolean
                    stored:
                      type: object
                      description: Ce que le site a enregistre.
                    live:
                      type: [object, 'null']
                      description: Ce que le bot a vu, avec sa date de capture.
                    roster:
                      type: array
                      description: >-
                        Le roster du site en regard de l'acces Discord.
                        `hasAccess` vaut null tant qu'aucune photo n'existe (on
                        ne devine pas), et `discordUserId` null signale une
                        personne hors de portee du bot faute de compte lie.
                      items:
                        type: object
                        properties:
                          userId:
                            type: [string, 'null']
                          label:
                            type: [string, 'null']
                          role:
                            type: [string, 'null']
                          discordUserId:
                            type: [string, 'null']
                          isCaptain:
                            type: boolean
                          hasAccess:
                            type: [boolean, 'null']
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "429":
      $ref: "#/components/responses/RateLimited"
post:
  tags:
    - admin
  summary: Demande une action Discord sur les salons d'une equipe.
  description: >-
    Un geste nomme par appel — `refresh`, `provision`, `repair`,
    `delete-channel`, `grant-access`, `revoke-access`, `grant-role`,
    `revoke-role`. Pas de « reconcilie » : c'est le mot qui laisse la machine
    decider, et qui a coute des salons.

    Le site n'a pas le token Discord : l'action part en evenement vers le bot
    (push HMAC, outbox en repli) qui execute puis repose une photo. Reponse 202
    : `delivered` dit si le bot a pris l'evenement tout de suite ou s'il attend
    en file. Chaque action est journalisee dans `staff_logs`.
  operationId: adminActOnDiscordTeamChannels
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - action
          properties:
            action:
              type: string
              enum:
                - refresh
                - provision
                - repair
                - delete-channel
                - delete-role
                - grant-access
                - revoke-access
                - grant-role
                - revoke-role
            teamId:
              type: string
              format: uuid
              description: Requis sauf pour `refresh`, qui accepte tout le tenant.
            channel:
              type: string
              enum: [text, voice]
            discordUserId:
              type: string
  responses:
    '202':
      description: Action transmise au bot.
      content:
        application/json:
          schema:
            type: object
            properties:
              accepted:
                type: boolean
              delivered:
                type: boolean
              action:
                type: string
    '400':
      description: Action inconnue ou parametres invalides.
    '404':
      description: Equipe introuvable dans ce tenant.
