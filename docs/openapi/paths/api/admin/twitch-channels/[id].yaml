parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Twitch channel detail.
  operationId: adminGetTwitchChannel
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Channel.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  summary: Update a Twitch channel.
  operationId: adminUpdateTwitchChannel
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Remove a Twitch channel.
  operationId: adminDeleteTwitchChannel
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '204':
      description: Removed.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
