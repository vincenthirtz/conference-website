get:
  summary: List Twitch channels tracked by the tenant.
  operationId: adminListTwitchChannels
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Channels.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Register a Twitch channel.
  operationId: adminCreateTwitchChannel
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
