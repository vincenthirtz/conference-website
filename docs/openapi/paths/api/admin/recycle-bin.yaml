get:
  summary: List soft-deleted entities (stages, teams, matches, etc.).
  description: >-
    Requires `admin` role. Global sources (`partner`, `adherent`, `staff`) are
    reserved to pole-admins and global owners (403 `PLATFORM_SCOPE`).
  operationId: adminListRecycleBin
  x-zod-query: admin.recycle-bin.query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: type
      schema:
        type: string
        enum:
          - stage
          - team
          - match
          - partner
          - cast_member
          - adherent
          - staff
          - scrim
          - scrim_planning
          - task
          - news
  responses:
    '200':
      description: Recycle bin entries.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - total
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/RecycleBinEntry'
              total:
                type: integer
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
patch:
  summary: Restore a soft-deleted entity.
  description: >-
    Requires `admin` role. Global sources (`partner`, `adherent`, `staff`) are
    reserved to pole-admins and global owners (403 `PLATFORM_SCOPE`).
  operationId: adminRestoreFromRecycleBin
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.recycle-bin.update
          type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - stage
                - team
                - match
                - partner
                - cast_member
                - adherent
                - staff
                - scrim
                - scrim_planning
                - task
                - news
            id:
              type: string
              format: uuid
  responses:
    '200':
      description: Restored.
      content:
        application/json:
          schema:
            type: object
            properties:
              restored:
                type: boolean
              type:
                type: string
              id:
                type: string
                format: uuid
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Permanently delete an item from the recycle bin.
  description: >-
    Requires `owner` role (second factor when enforced). Only purgeable types
    (`scrim_planning`, `task`, `news`, `partner`, `adherent`) — others
    answer 409 `NOT_PURGEABLE` (tournament history, staff audit trail). Global
    sources (`partner`, `adherent`) are reserved to pole-admins and global
    owners (403 `PLATFORM_SCOPE`). An adherent with membership payments is
    anonymized instead of deleted (`mode: anonymized`). The item must be in
    the recycle bin (404 `NOT_IN_RECYCLE_BIN`). Items left in the bin for 90
    days are purged automatically by `/api/cron/recycle-bin-purge`.
  operationId: adminPurgeFromRecycleBin
  x-zod-query: admin.recycle-bin.delete.query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: id
      required: true
      schema:
        type: string
        format: uuid
    - in: query
      name: type
      required: true
      schema:
        type: string
        enum:
          - scrim_planning
          - task
          - news
          - partner
          - adherent
  responses:
    '200':
      description: Purged.
      content:
        application/json:
          schema:
            type: object
            properties:
              purged:
                type: boolean
              type:
                type: string
              id:
                type: string
                format: uuid
              mode:
                type: string
                enum:
                  - deleted
                  - anonymized
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
