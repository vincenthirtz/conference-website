get:
  summary: List scrim planning sessions (shared availability grids).
  operationId: adminListScrimPlannings
  x-zod-query: admin.scrim-plannings.query
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  responses:
    '200':
      description: Plannings.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Open a scrim planning session between two teams.
  operationId: adminCreateScrimPlanning
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.scrim-plannings.create
  responses:
    '201':
      description: Planning created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
