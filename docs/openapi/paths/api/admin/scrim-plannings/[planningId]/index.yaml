parameters:
  - name: planningId
    in: path
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Get a planning with all availabilities and the overlap heatmap.
  operationId: adminGetScrimPlanning
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  responses:
    '200':
      description: Planning detail.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  summary: Update a scrim planning (title, game, status, grid config).
  operationId: adminUpdateScrimPlanning
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
put:
  summary: Alias of PATCH — update a scrim planning.
  operationId: adminUpdateScrimPlanningPut
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
delete:
  summary: Soft-delete a scrim planning.
  operationId: adminDeleteScrimPlanning
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  responses:
    '200':
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
