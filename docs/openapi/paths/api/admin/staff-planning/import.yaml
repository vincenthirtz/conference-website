post:
  summary: Import the shared staff availability spreadsheet.
  description: >
    Importe le tableur « Calendrier disponibilite » (export CSV), deja lu cote
    navigateur (`utils/staffPlanningCsv`) : un creneau par personne et par
    jour. Rapproche le fichier de l'import precedent des mois `months` : les
    creneaux disparus du fichier sont retires, les nouveaux ajoutes, ceux qui
    restent gardent leur role et leur note. Les creneaux saisis a la main
    restent (un doublon de l'un d'eux est ignore). Chaque entree doit tomber
    dans l'un des mois. Reserve a `manage_staff`.
  operationId: adminImportStaffPlanning
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.staff-planning/import.body
          type: object
          required:
            - months
            - entries
          properties:
            months:
              type: array
              items:
                type: string
            entries:
              type: array
              items:
                type: object
                required: [person, date, start, end]
                properties:
                  person:
                    type: string
                  date:
                    type: string
                    format: date
                  start:
                    type: string
                  end:
                    type: string
  responses:
    '200':
      description: Import applique.
      content:
        application/json:
          schema:
            type: object
            properties:
              inserted:
                type: integer
              kept:
                type: integer
              removed:
                type: integer
              skipped:
                type: integer
              months:
                type: array
                items:
                  type: string
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
