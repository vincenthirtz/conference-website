get:
  summary: Telecharge un document du Drive, a travers le site.
  description: >
    Auth : `read_documents`. Repond un FLUX binaire, d'ou une route separee de
    `/api/admin/documents` — les melanger obligerait le handler a changer de
    nature selon un parametre.


    POURQUOI servir le contenu, alors que la v1 s'y refusait : quelqu'un qui a
    le droit sur le site mais n'est pas dans la liste de partage Google se
    prenait un refus en cliquant « Ouvrir dans Drive ». Le site disait oui,
    Google non.


    Ce que ca deplace : `read_documents` devient la seule chose entre un PV d'AG
    et Internet. D'ou le meme confinement que la liste et la corbeille (dossier
    dans l'arborescence, fichier enfant de ce dossier), un jeton Google en
    LECTURE SEULE, et une journalisation nominative
    (`download_association_document`).


    Les formats natifs Google (Docs, Slides, Sheets, Drawings) n'ont pas de
    contenu binaire : ils sont EXPORTES (PDF, XLSX, PNG) et le nom de fichier
    prend l'extension d'arrivee.
  operationId: adminDownloadAssociationDocument
  tags:
    - admin/association
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: fileId
      required: true
      schema:
        type: string
    - in: query
      name: folderId
      schema:
        type: string
      description: Dossier affiche. Verifie comme descendant de la racine.
  responses:
    '200':
      description: Le fichier, en piece jointe.
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '400':
      description: fileId manquant, fichier hors du dossier, ou export refuse.
    '409':
      description: Drive non configure.
    '429':
      $ref: '#/components/responses/RateLimited'
    '502':
      description: Le Drive n'a pas repondu.
