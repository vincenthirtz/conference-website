get:
  summary: Read staff push prefs.
  operationId: adminGetNotificationPrefs
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Prefs.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
put:
  summary: Update staff push prefs.
  operationId: adminPutNotificationPrefs
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
