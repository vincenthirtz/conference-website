get:
  summary: List open match disputes across the tenant.
  operationId: adminListDisputes
  tags:
    - admin/matches
  security:
    - StaffSession: []
  responses:
    '200':
      description: Open disputes.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
