get:
  summary: List scrims for the active tenant.
  operationId: adminListScrims
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  responses:
    '200':
      description: Scrims.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create a scrim.
  operationId: adminCreateScrim
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Scrim'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
