get:
  summary: List scrims for the active tenant.
  operationId: adminListScrims
  x-zod-query: admin.scrims.query
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  responses:
    '200':
      description: Scrims.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create a scrim.
  operationId: adminCreateScrim
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.scrims.create
  responses:
    '201':
      description: Created.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
