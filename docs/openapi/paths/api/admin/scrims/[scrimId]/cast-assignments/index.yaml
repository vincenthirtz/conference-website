parameters:
  - $ref: '#/components/parameters/ScrimId'
get:
  summary: List cast assignments for a scrim.
  operationId: adminListScrimCastAssignments
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  responses:
    '200':
      description: Assignments.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Assign a caster to a scrim.
  operationId: adminCreateScrimCastAssignment
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Assignment created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CastAssignment'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
