parameters:
  - $ref: '#/components/parameters/ScrimId'
get:
  summary: List cast assignments for a scrim.
  operationId: adminListScrimCastAssignments
  x-zod-query: admin.scrims/[scrimId].query
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  responses:
    '200':
      description: Assignments.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Assign a caster to a scrim.
  operationId: adminCreateScrimCastAssignment
  x-zod-query: admin.scrims/[scrimId].query
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.scrims/[scrimId]/cast-assignments.create
  responses:
    '201':
      description: Assignment created.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
