parameters:
  - $ref: '#/components/parameters/ScrimId'
get:
  summary: Scrim detail.
  operationId: adminGetScrim
  x-zod-query: admin.scrims/[scrimId].query
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  responses:
    '200':
      description: Scrim.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  summary: Patch scrim fields.
  operationId: adminPatchScrim
  x-zod-query: admin.scrims/[scrimId].query
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.scrims/[scrimId].update
  responses:
    '200':
      description: Updated.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
put:
  summary: Replace scrim fields (full update).
  operationId: adminPutScrim
  x-zod-query: admin.scrims/[scrimId].query
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.scrims/[scrimId].update
  responses:
    '200':
      description: Updated.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Soft-delete a scrim.
  operationId: adminDeleteScrim
  x-zod-query: admin.scrims/[scrimId].query
  tags:
    - admin/scrims
  security:
    - StaffSession: []
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
