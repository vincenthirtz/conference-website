parameters:
  - in: path
    name: campaignId
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Preview the rendered campaign payload.
  operationId: adminPreviewBroadcastCampaign
  tags:
    - admin/broadcast
  security:
    - StaffSession: []
  responses:
    '200':
      description: Preview.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
