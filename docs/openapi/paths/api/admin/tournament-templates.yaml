get:
  summary: List tournament templates.
  operationId: adminListTournamentTemplates
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '200':
      description: Templates.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create a tournament template.
  operationId: adminCreateTournamentTemplate
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Delete a tournament template (by ID in body or query).
  operationId: adminDeleteTournamentTemplate
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: id
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
