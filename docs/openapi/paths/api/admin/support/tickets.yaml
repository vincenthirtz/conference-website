get:
  summary: List support tickets.
  operationId: adminListSupportTickets
  x-zod-query: admin.support/tickets.query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Tickets.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
