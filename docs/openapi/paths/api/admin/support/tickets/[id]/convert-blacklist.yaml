parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Convert a support ticket into a player or entity blacklist entry
    (kind-discriminated body).
  operationId: adminConvertSupportTicketBlacklist
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Blacklist entry created and linked to the ticket.
      content:
        application/json:
          schema:
            type: object
            properties:
              kind:
                type: string
                enum: [player, entity]
              entry:
                type: object
                additionalProperties: true
              ticket_id:
                type: string
                format: uuid
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
