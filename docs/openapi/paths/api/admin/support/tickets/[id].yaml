parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Support ticket detail.
  operationId: adminGetSupportTicket
  x-zod-query: admin.support/tickets/[id].query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Ticket.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  summary: Update a support ticket (status, assignment, reply).
  operationId: adminPatchSupportTicket
  x-zod-query: admin.support/tickets/[id].query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.support/tickets/[id].update
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Delete a support ticket.
  operationId: adminDeleteSupportTicket
  x-zod-query: admin.support/tickets/[id].query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
