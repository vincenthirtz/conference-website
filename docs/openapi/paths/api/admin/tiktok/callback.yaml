get:
  summary: Retour du consentement TikTok — persiste le compte connecte.
  operationId: adminTiktokCallback
  tags:
    - admin/communications
  description: |
    URL a declarer TELLE QUELLE dans les reglages de l'app TikTok. Echange
    le code contre un couple de jetons (acces 24 h, rafraichissement 365 j),
    lit le nom du compte, et ecrit `social_accounts` avec les DEUX jetons
    CHIFFRES (AES-256-GCM).

    Repond toujours par une REDIRECTION vers
    `/admin/communications?tab=social`, avec le resultat en query
    (`tiktok=connected|cancelled|error`) : on arrive ici depuis un
    navigateur, pas depuis un fetch.
  security:
    - StaffSession: []
  parameters:
    - name: code
      in: query
      schema:
        type: string
    - name: state
      in: query
      schema:
        type: string
      description: State signe emis par /api/admin/tiktok/authorize.
    - name: error
      in: query
      schema:
        type: string
      description: Renseigne par TikTok si l'utilisateur refuse.
  responses:
    '302':
      description: Redirection vers le panneau, resultat en query.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
