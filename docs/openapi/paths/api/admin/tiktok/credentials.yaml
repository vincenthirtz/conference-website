get:
  summary: Etat de la mise en service TikTok (jamais les valeurs).
  operationId: adminTiktokCredentialsGet
  tags:
    - admin/communications
  security:
    - StaffSession: []
  responses:
    '200':
      description: |
        `{ clientKeySet, clientSecretSet, encryptionReady, connected,
        handle, redirectUri }`. `redirectUri` est l'URI a recopier au
        caractere pres dans l'app TikTok.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
put:
  summary: Pose la client key et le client secret TikTok (chiffres).
  operationId: adminTiktokCredentialsPut
  tags:
    - admin/communications
  description: |
    Les DEUX ensemble, toujours : une paire depareillee n'a pour symptome
    qu'un `invalid_client` au bout du parcours OAuth, qui ne dit pas lequel
    des deux est en cause. Chiffres cote serveur (SECRETS_ENC_KEY ne vit
    qu'en production) et jamais relus ensuite.
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - clientKey
            - clientSecret
          properties:
            clientKey:
              type: string
            clientSecret:
              type: string
  responses:
    '200':
      description: '`{ ok, clientKeySet, clientSecretSet }`.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Client key ou secret vide, ou contenant un espace.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '503':
      description: SECRETS_ENC_KEY absente — impossible de chiffrer.
