get:
  summary: Search matches by team name, tournament or match text fields.
  operationId: adminSearchMatches
  x-zod-query: admin.matches/search.query
  tags:
    - admin/matches
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: q
      description: >-
        Texte (2 caracteres utiles minimum) cherche dans les noms d'equipes,
        le nom / slug du tournoi, round_name, notes et lobby_code. En dessous,
        pas de filtre texte.
      schema:
        type: string
    - in: query
      name: upcoming
      description: >-
        Defaut vrai : matchs a venir ou non planifies. `0` pour l'historique.
      schema:
        type: string
    - in: query
      name: limit
      description: 1 a 50 (defaut 20).
      schema:
        type: string
  responses:
    '200':
      description: Search results.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
