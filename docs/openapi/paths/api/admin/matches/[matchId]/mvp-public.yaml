parameters:
  - $ref: '#/components/parameters/MatchId'
get:
  summary: Etat du scrutin MVP du public (viewers Twitch + supporters Discord).
  description: >-
    Rend le scrutin, les candidates et les DECOMPTES par plateforme. Jamais les
    `voter_key` : savoir pour qui une personne a vote n'est l'affaire de
    personne, staff compris.
  operationId: adminGetMatchPublicMvp
  tags:
    - admin/matches
  security:
    - StaffSession: []
  responses:
    '200':
      description: Etat du scrutin public.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
post:
  summary: Ouvrir, alimenter ou clore le scrutin MVP du public.
  description: >-
    Trois actions. `open` ouvre une fenetre COURTE (defaut 10 min) sur un match
    termine et fige les candidates. `vote` encaisse un LOT de voix relayees par
    le cockpit regie, qui lit le chat Twitch — une voix pour un numero
    inexistant est comptee comme refusee sans faire echouer le lot. `close`
    depouille en ADDITIONNANT les deux plateformes, contrairement au vote des
    equipes ou elles s'arbitrent.
  operationId: adminPostMatchPublicMvp
  tags:
    - admin/matches
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [open]
                windowMinutes:
                  description: Fenetre de vote, 1 a 360 minutes. Defaut 10.
                  type: integer
                  minimum: 1
                  maximum: 360
            - type: object
              required: [action, source, votes]
              properties:
                action:
                  type: string
                  enum: [vote]
                source:
                  description: >-
                    `twitch` = viewers du chat, `discord` = supporters du
                    serveur. Les deux comptent ensemble au depouillement.
                  type: string
                  enum: [twitch, discord]
                votes:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [voterKey, memberId]
                    properties:
                      voterKey:
                        description: >-
                          Identifiant de plateforme (login Twitch minuscule, ou
                          identifiant Discord). Jamais un compte du site.
                        type: string
                      memberId:
                        type: string
                        format: uuid
            - type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [close]
  responses:
    '200':
      description: Scrutin ouvert, voix encaissees, ou resultat du depouillement.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: Match non termine, ou non joue (forfait, bye).
    '429':
      $ref: '#/components/responses/RateLimited'
