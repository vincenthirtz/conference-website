parameters:
  - $ref: '#/components/parameters/MatchId'
get:
  summary: Read veto state for a match.
  operationId: adminGetMatchVeto
  x-zod-query: admin.matches/[matchId]/sub.query
  tags:
    - admin/matches
  security:
    - StaffSession: []
  responses:
    '200':
      description: Veto state.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Apply a veto action (ban/pick) or reset.
  operationId: adminPostMatchVeto
  x-zod-query: admin.matches/[matchId]/sub.query
  tags:
    - admin/matches
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.matches/[matchId]/veto.create
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated veto state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VetoState'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
patch:
  summary: Update veto state (admin override).
  operationId: adminPatchMatchVeto
  x-zod-query: admin.matches/[matchId]/sub.query
  tags:
    - admin/matches
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.matches/[matchId]/veto.update
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated veto state.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Reset the veto for a match.
  operationId: adminDeleteMatchVeto
  x-zod-query: admin.matches/[matchId]/sub.query
  tags:
    - admin/matches
  security:
    - StaffSession: []
  responses:
    '204':
      description: Reset.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
