parameters:
  - $ref: '#/components/parameters/MatchId'
get:
  summary: List cast assignments on a match.
  operationId: adminListMatchCastAssignments
  tags:
    - admin/matches
  security:
    - StaffSession: []
  responses:
    '200':
      description: Assignments.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Assign a caster/observer/director to a match.
  operationId: adminCreateMatchCastAssignment
  tags:
    - admin/matches
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Assignment created.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
