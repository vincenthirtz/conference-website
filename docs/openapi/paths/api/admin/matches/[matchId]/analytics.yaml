parameters:
  - $ref: '#/components/parameters/MatchId'
get:
  summary: Analytics for a single match (games, vetos, timing).
  description: Requires `manager` role.
  operationId: adminGetMatchAnalytics
  tags:
    - admin/matches
  security:
    - StaffSession: []
  responses:
    '200':
      description: Match analytics.
      content:
        application/json:
          schema:
            type: object
            required:
              - analytics
            properties:
              analytics:
                type: object
                additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
