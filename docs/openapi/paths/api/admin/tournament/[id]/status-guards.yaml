parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Compute status guards (preconditions to transition states).
  operationId: adminGetTournamentStatusGuards
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '200':
      description: Guards.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
