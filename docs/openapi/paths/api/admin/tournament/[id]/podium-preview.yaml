parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Preview the podium before calling `/finalize`.
  operationId: adminPodiumPreview
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '200':
      description: Preview.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
