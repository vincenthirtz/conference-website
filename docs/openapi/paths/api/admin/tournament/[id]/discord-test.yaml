parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Send a test Discord notification for this tournament.
  operationId: adminTournamentDiscordTest
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Sent.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
