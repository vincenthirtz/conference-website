parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
  - $ref: '#/components/parameters/TeamId'
get:
  summary: Team enrollment detail in a tournament.
  operationId: adminGetTournamentTeam
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '200':
      description: Enrollment.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
patch:
  summary: Patch a team enrollment (seed, group, status).
  operationId: adminPatchTournamentTeam
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Unenroll a team from a tournament.
  operationId: adminUnenrollTournamentTeam
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '204':
      description: Unenrolled.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
