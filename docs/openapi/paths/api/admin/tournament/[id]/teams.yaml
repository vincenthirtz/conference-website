parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: List teams enrolled in a tournament.
  operationId: adminListTournamentTeams
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '200':
      description: Teams.
      content:
        application/json:
          schema:
            type: object
            properties:
              teams:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Enroll teams in a tournament.
  operationId: adminEnrollTournamentTeams
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Enrolled.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
