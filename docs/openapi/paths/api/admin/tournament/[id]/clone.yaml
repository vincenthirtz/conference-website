parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Clone a tournament (stages + matches scaffolding, no scores).
  operationId: adminCloneTournament
  x-zod-query: admin.tournament/[id]/checkin.query
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          x-zod: admin.tournament/[id]/clone.body
  responses:
    '201':
      description: Cloned.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
