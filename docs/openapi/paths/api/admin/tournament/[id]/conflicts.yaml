parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: List scheduling / roster conflicts for a tournament.
  operationId: adminGetTournamentConflicts
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '200':
      description: Conflicts.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
