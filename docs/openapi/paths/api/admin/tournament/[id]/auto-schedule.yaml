parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Auto-schedule matches across stages using available slots.
  description: >
    Respecte desormais les CONTRAINTES DE DISPONIBILITE des equipes
    (`team_availability_constraints`) : le scheduler savait quand une equipe est
    LIBRE, jamais quand elle a le DROIT de jouer, et produisait donc un planning
    que le diagnostic refusait aussitot. `ignoreTeamConstraints: true` retablit
    l'ancien comportement, pour comparer.


    `dryRun: true` calcule le planning et le renvoie SANS RIEN ECRIRE, avec
    `constraintCount` et les conflits eventuels — une simulation doit pouvoir
    montrer les conflits, c'est sa raison d'etre. Le defaut reste l'ecriture,
    pour ne pas casser les appels existants.
  operationId: adminAutoScheduleTournament
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Scheduled.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
