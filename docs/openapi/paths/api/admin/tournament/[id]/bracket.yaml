parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Generate the elimination bracket for a tournament.
  operationId: adminGenerateTournamentBracket
  x-zod-query: admin.tournament/[id]/stats.query
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          x-zod: admin.tournament/[id]/bracket.body
  responses:
    '200':
      description: Bracket.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
