parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Read Discord webhooks bound to this tournament.
  operationId: adminGetTournamentDiscordWebhooks
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '200':
      description: Webhooks.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
put:
  summary: Replace Discord webhooks for this tournament.
  operationId: adminPutTournamentDiscordWebhooks
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Saved.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Clear Discord webhooks for this tournament.
  operationId: adminDeleteTournamentDiscordWebhooks
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '204':
      description: Cleared.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
