parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Apply a template to a tournament (creates stages/matches scaffolding).
  operationId: adminApplyTournamentTemplate
  x-zod-query: admin.tournament/[id]/checkin.query
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.tournament/[id]/apply-template.body
  responses:
    '200':
      description: Applied.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
