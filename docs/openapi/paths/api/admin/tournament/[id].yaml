parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Tournament detail (admin view).
  operationId: adminGetTournament
  x-zod-query: admin.tournament/[id].query
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '200':
      description: Tournament.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  summary: Patch tournament fields.
  operationId: adminPatchTournament
  x-zod-query: admin.tournament/[id].query
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.tournament/[id].update
  responses:
    '200':
      description: Updated.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
put:
  summary: Replace tournament fields (full update).
  operationId: adminPutTournament
  x-zod-query: admin.tournament/[id].query
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.tournament/[id].update
  responses:
    '200':
      description: Updated.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
