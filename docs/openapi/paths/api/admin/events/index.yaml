get:
  summary: List event_runs for the active tenant.
  description: Requires `manager` role.
  operationId: adminListEventRuns
  tags:
    - admin/events
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: status
      schema:
        type: string
        enum:
          - draft
          - live
          - done
    - in: query
      name: limit
      schema:
        type: integer
        default: 50
        maximum: 200
    - in: query
      name: offset
      schema:
        type: integer
        default: 0
  responses:
    '200':
      description: Paginated event_runs.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - total
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/EventRun'
              total:
                type: integer
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create an event_run (draft).
  description: Requires `manager` role.
  operationId: adminCreateEventRun
  tags:
    - admin/events
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - scheduled_at
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            slug:
              type: string
              maxLength: 200
            description:
              type: [string, 'null']
              maxLength: 2000
            scheduled_at:
              type: string
              format: date-time
  responses:
    '201':
      description: Event run created (draft).
      content:
        application/json: {}
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      $ref: '#/components/responses/Conflict'
