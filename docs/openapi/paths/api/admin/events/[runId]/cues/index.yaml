parameters:
  - $ref: '#/components/parameters/RunId'
get:
  summary: List cues for an event run.
  operationId: adminListEventCues
  tags:
    - admin/events
  security:
    - StaffSession: []
  responses:
    '200':
      description: Cues.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Emit a manual cue (caster cockpit).
  operationId: adminCreateEventCue
  tags:
    - admin/events
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Cue emitted.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
