parameters:
  - $ref: '#/components/parameters/RunId'
post:
  summary: Reorder waves in bulk.
  description: |
    Requires `manager` role. `order` must list every wave of the run
    (no missing, no extra), with unique ids and unique ords.
  operationId: adminReorderEventWaves
  tags:
    - admin/events
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - order
          properties:
            order:
              type: array
              items:
                type: object
                required:
                  - id
                  - ord
                properties:
                  id:
                    type: string
                    format: uuid
                  ord:
                    type: integer
                    minimum: 0
  responses:
    '200':
      description: Reordered.
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - waves
            properties:
              success:
                type: boolean
              waves:
                type: array
                items:
                  $ref: '#/components/schemas/EventWave'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
