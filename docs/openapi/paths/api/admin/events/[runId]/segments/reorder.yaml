parameters:
  - $ref: '#/components/parameters/RunId'
post:
  summary: Reorder segments in bulk.
  description: Requires `manager` role.
  operationId: adminReorderEventSegments
  tags:
    - admin/events
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - order
          properties:
            order:
              type: array
              items:
                type: object
                required:
                  - id
                  - ord
                properties:
                  id:
                    type: string
                    format: uuid
                  ord:
                    type: integer
                    minimum: 0
  responses:
    '200':
      description: Reordered.
      content:
        application/json: {}
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
