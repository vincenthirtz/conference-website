parameters:
  - $ref: '#/components/parameters/RunId'
post:
  summary: Reorder segments in bulk.
  description: Requires `manager` role.
  operationId: adminReorderEventSegments
  tags:
    - admin/events
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - orderedIds
          x-zod: admin.events/[runId]/segments/reorder.body
          properties:
            orderedIds:
              type: array
              minItems: 1
              maxItems: 200
              description: TOUS les segments du run, une fois chacun, dans le nouvel ordre
                (ord = index).
              items:
                type: string
                format: uuid
  responses:
    '200':
      description: Reordered.
      content:
        application/json: {}
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
  x-zod-query: admin.events/[runId].query
