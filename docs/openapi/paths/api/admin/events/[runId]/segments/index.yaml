parameters:
  - $ref: '#/components/parameters/RunId'
post:
  summary: Append a segment to an event run.
  description: |
    Requires `manager` role. If `ord` is omitted the API picks MAX(ord)+1.
    `type='match'` requires `match_id`.
  operationId: adminCreateEventSegment
  tags:
    - admin/events
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CreateEventSegmentInput'
  responses:
    '201':
      description: Segment created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventSegment'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
