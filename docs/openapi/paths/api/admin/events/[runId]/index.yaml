parameters:
  - $ref: '#/components/parameters/RunId'
get:
  summary: Event run detail (with segments).
  operationId: adminGetEventRun
  tags:
    - admin/events
  security:
    - StaffSession: []
  responses:
    '200':
      description: Event run + segments.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  summary: Patch event run metadata.
  operationId: adminPatchEventRun
  tags:
    - admin/events
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
put:
  summary: Replace event run metadata.
  operationId: adminReplaceEventRun
  tags:
    - admin/events
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Replaced.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Delete an event run (only if draft).
  operationId: adminDeleteEventRun
  tags:
    - admin/events
  security:
    - StaffSession: []
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      $ref: '#/components/responses/Conflict'
