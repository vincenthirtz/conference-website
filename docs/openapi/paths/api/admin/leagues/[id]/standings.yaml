parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Standings + tournois liés d'une league (admin, visible même en draft/privé).
  operationId: adminGetLeagueStandings
  tags:
    - admin/leagues
  security:
    - StaffSession: []
  responses:
    '200':
      description: Standings de la league.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LeagueStandingsResponse'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
