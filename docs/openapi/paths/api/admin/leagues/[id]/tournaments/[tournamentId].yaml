parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
  - in: path
    name: tournamentId
    required: true
    schema:
      type: string
      format: uuid
delete:
  summary: Délie un tournoi d'une league.
  operationId: adminUnlinkLeagueTournament
  tags:
    - admin/leagues
  security:
    - StaffSession: []
  responses:
    '204':
      description: Lien supprimé.
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
