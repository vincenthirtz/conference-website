parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Recalcule les standings d'une league depuis les final_rankings liés.
  operationId: adminRecomputeLeagueStandings
  tags:
    - admin/leagues
  security:
    - StaffSession: []
  responses:
    '200':
      description: Standings recalculés.
      content:
        application/json:
          schema:
            type: object
            required:
              - standings_count
            properties:
              standings_count:
                type: integer
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
