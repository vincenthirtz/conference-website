get:
  summary: Team-level statistics across the tenant.
  operationId: adminStatsTeams
  x-zod-query: admin.stats/teams.query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Team stats.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
