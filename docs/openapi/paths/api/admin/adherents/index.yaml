get:
  summary: Liste paginée des adhérents, avec les compteurs du bandeau.
  description: >
    Contrat de liste admin (recherche `q` sur nom, prénom, email et n°
    d'adhérent ; tri sur une liste fermée de colonnes ; `page`/`pageSize`).
    Réponse `{ items, total, stats }`. Permission `manage_communications`,
    rôle global (donnée d'association).
  operationId: adminListAdherents
  tags:
    - admin/misc
  security:
    - StaffSession: []
  x-zod-query: admin.adherents.query
  responses:
    '200':
      description: List of adherents.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Crée un adhérent à la main (hors synchro HelloAsso).
  description: >
    Email unique (insensible à la casse) : un doublon répond 400 avec
    `fields.email`.
  operationId: adminCreateAdherent
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.adherents.create
  responses:
    '201':
      description: Adherent created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
