get:
  summary: List adherents (active memberships).
  description: Requires `admin` role.
  operationId: adminListAdherents
  tags:
    - admin/misc
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: q
      schema:
        type: string
      description: Free-text search
    - in: query
      name: status
      schema:
        type: string
    - in: query
      name: limit
      schema:
        type: integer
        default: 50
    - in: query
      name: offset
      schema:
        type: integer
        default: 0
  responses:
    '200':
      description: List of adherents.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create an adherent manually.
  description: Requires `admin` role.
  operationId: adminCreateAdherent
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Adherent created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
