parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Adherent detail.
  description: Requires `admin` role.
  operationId: adminGetAdherent
  x-zod-query: admin.adherents/[id].query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Adherent record.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  summary: Update adherent fields.
  description: Requires `admin` role.
  operationId: adminUpdateAdherent
  x-zod-query: admin.adherents/[id].query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.adherents/[id].update
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Soft-delete adherent.
  description: Requires `admin` role.
  operationId: adminDeleteAdherent
  x-zod-query: admin.adherents/[id].query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
