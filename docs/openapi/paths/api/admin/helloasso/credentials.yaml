get:
  tags:
    - admin/communications
  summary: Compte HelloAsso d'encaissement de l'espace.
  description: |
    Dit si l'espace a relie son propre compte HelloAsso, sur quelle
    organisation, et rend l'URL de notification a coller dans son back-office
    (jeton DERIVE par espace, jamais stocke). La cle secrete n'est jamais relue.
    L'espace historique encaisse sur le compte de l'association
    (`usesPlatformAccount: true`) et n'a rien a relier.
  operationId: adminGetHelloAssoCredentials
  security:
    - StaffSession: []
  responses:
    '200':
      description: Etat de l'encaissement.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/RateLimited'
put:
  tags:
    - admin/communications
  summary: Relier le compte HelloAsso de l'espace.
  description: |
    Verifie les identifiants aupres de HelloAsso (jeton OAuth PUIS acces a
    l'organisation) avant de les chiffrer : une cle fausse ne se manifesterait
    qu'au premier paiement, devant une contributrice. Journalise.
  operationId: adminPutHelloAssoCredentials
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [clientId, clientSecret, organizationSlug]
          properties:
            clientId:
              type: string
            clientSecret:
              type: string
            organizationSlug:
              type: string
              description: Fin de l'adresse helloasso.com/associations/<slug>.
  responses:
    '200':
      description: Compte relie.
    '400':
      description: '`code: PLATFORM_ACCOUNT`, identifiants refuses (`BAD_CREDENTIALS`) ou organisation inaccessible (`BAD_ORG`).'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/RateLimited'
    '503':
      description: SECRETS_ENC_KEY absente.
delete:
  tags:
    - admin/communications
  summary: Delier le compte HelloAsso de l'espace.
  description: |
    Les cagnottes de l'espace cessent d'encaisser : la route de paiement rend
    `409 HELLOASSO_NOT_CONNECTED` et la page publique masque le bouton.
  operationId: adminDeleteHelloAssoCredentials
  security:
    - StaffSession: []
  responses:
    '200':
      description: Compte delie.
    '400':
      description: '`code: PLATFORM_ACCOUNT`.'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/RateLimited'
