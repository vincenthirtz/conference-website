post:
  summary: Force a HelloAsso sync (returns pending diff before applying).
  operationId: adminTriggerHelloAssoSync
  x-zod-query: admin.helloasso/sync.query
  tags:
    - admin/misc
  security:
    - StaffSession: []
  responses:
    '200':
      description: Diff and sync result.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
