get:
  summary: Retour du consentement Instagram — persiste le compte connecte.
  operationId: adminInstagramCallback
  tags:
    - admin/communications
  description: |
    URL a declarer TELLE QUELLE dans les reglages de l'app Meta. Echange le
    code contre un jeton longue duree (~60 j), lit l'identite du compte, et
    ecrit `social_accounts` avec le jeton CHIFFRE (AES-256-GCM).

    Repond toujours par une REDIRECTION vers
    `/admin/communications?tab=social`, avec le resultat en query
    (`instagram=connected|cancelled|error`) : on arrive ici depuis un
    navigateur, pas depuis un fetch.
  security:
    - StaffSession: []
  parameters:
    - name: code
      in: query
      schema:
        type: string
    - name: state
      in: query
      schema:
        type: string
      description: State signe emis par /api/admin/instagram/authorize.
    - name: error
      in: query
      schema:
        type: string
      description: Renseigne par Meta si l'utilisateur refuse.
  responses:
    '302':
      description: Redirection vers le panneau, resultat en query.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
