parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Mark a tenant request as expired.
  operationId: adminExpireTenantRequest
  x-zod-query: admin.tenants/[id].query
  tags:
    - admin/tenants
  security:
    - StaffSession: []
  responses:
    '200':
      description: Expired.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
