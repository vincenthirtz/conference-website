parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Reject a tenant request.
  operationId: adminRejectTenantRequest
  x-zod-query: admin.tenants/[id].query
  tags:
    - admin/tenants
  security:
    - StaffSession: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          x-zod: admin.tenant-requests/[id]/reject.body
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Rejected.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
