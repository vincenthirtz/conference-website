parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
patch:
  summary: Update a blacklist entry (reason / notes / active toggle).
  operationId: adminUpdateBlacklist
  x-zod-query: admin.moderation/blacklist/[id].query
  tags:
    - admin/content
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.moderation/blacklist/[id].update
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
delete:
  summary: Delete a blacklist entry.
  operationId: adminDeleteBlacklist
  x-zod-query: admin.moderation/blacklist/[id].query
  tags:
    - admin/content
  security:
    - StaffSession: []
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
