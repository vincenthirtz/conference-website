get:
  summary: List blacklist detection alerts for the current tenant (cursor paginated).
  operationId: adminListBlacklistAlerts
  tags:
    - admin/content
  security:
    - StaffSession: []
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: before
      in: query
      description: ISO timestamp cursor (descending on created_at).
      schema:
        type: string
        format: date-time
    - name: strength
      in: query
      schema:
        type: string
        enum: [strong, soft]
    - name: source
      in: query
      schema:
        type: string
        enum: [bot_scan, bot_member_add, registration]
    - name: discordUserId
      in: query
      schema:
        type: string
  responses:
    '200':
      description: Blacklist alerts page.
      content:
        application/json:
          schema:
            type: object
            properties:
              alerts:
                type: array
                items:
                  type: object
                  additionalProperties: true
              nextCursor:
                type: [string, 'null']
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
  x-zod-query: admin.moderation/blacklist/alerts.query
