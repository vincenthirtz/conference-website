parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
patch:
  summary: Update an entity blacklist entry (name / entity_type / reason / notes /
    active toggle).
  operationId: adminUpdateEntityBlacklist
  tags:
    - admin/content
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
delete:
  summary: Delete an entity blacklist entry.
  operationId: adminDeleteEntityBlacklist
  tags:
    - admin/content
  security:
    - StaffSession: []
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
