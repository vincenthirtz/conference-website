get:
  summary: List entity blacklist entries (teams/orgs) for the current tenant.
  operationId: adminListEntityBlacklist
  tags:
    - admin/content
  security:
    - StaffSession: []
  parameters:
    - name: search
      in: query
      schema:
        type: string
    - name: active
      in: query
      schema:
        type: string
        enum: ['true', 'false']
    - name: entity_type
      in: query
      schema:
        type: string
        enum: [team, org]
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    '200':
      description: Entity blacklist entries.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create an entity blacklist entry (entity_type + name required).
  operationId: adminCreateEntityBlacklist
  tags:
    - admin/content
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
