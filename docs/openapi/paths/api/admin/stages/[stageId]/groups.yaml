parameters:
  - $ref: '#/components/parameters/StageId'
get:
  summary: List groups in a stage.
  operationId: adminListStageGroups
  x-zod-query: admin.stages/[stageId].query
  tags:
    - admin/stages
  security:
    - StaffSession: []
  responses:
    '200':
      description: Groups.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create a group in a stage.
  operationId: adminCreateStageGroup
  x-zod-query: admin.stages/[stageId].query
  tags:
    - admin/stages
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.stages/[stageId]/groups.body
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
put:
  summary: Replace groups in a stage (bulk).
  operationId: adminReplaceStageGroups
  x-zod-query: admin.stages/[stageId].query
  tags:
    - admin/stages
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.stages/[stageId]/groups.body
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Replaced.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
