parameters:
  - $ref: '#/components/parameters/StageId'
post:
  summary: Apply many match scores at once.
  operationId: adminStageBatchScores
  x-zod-query: admin.stages/[stageId].query
  tags:
    - admin/stages
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.stages/[stageId]/batch-scores.body
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Applied.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
