parameters:
  - $ref: '#/components/parameters/StageId'
get:
  summary: Preview proposed seeding without applying it.
  operationId: adminGetStageSeedingPreview
  tags:
    - admin/stages
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: sourceStageId
      schema:
        type: string
        format: uuid
    - in: query
      name: seedingPattern
      schema:
        type: string
        enum:
          - standard
          - sequential
  responses:
    '200':
      description: Preview.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
