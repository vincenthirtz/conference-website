parameters:
  - $ref: '#/components/parameters/StageId'
post:
  summary: Generate the next Swiss round pairings.
  operationId: adminGenerateSwissRound
  x-zod-query: admin.stages/[stageId].query
  tags:
    - admin/stages
  security:
    - StaffSession: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          x-zod: admin.stages/[stageId]/generate-swiss-round.body
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Pairings.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
