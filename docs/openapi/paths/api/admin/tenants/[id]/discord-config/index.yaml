parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Read Discord configuration (linked guilds, channels, roles).
  operationId: adminGetTenantDiscordConfig
  tags:
    - admin/tenants
  security:
    - StaffSession: []
  responses:
    '200':
      description: Discord config.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
