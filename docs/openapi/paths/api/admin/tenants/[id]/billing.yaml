parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: Read a tenant's billing / subscription state (« Régie solidaire »).
  description: |
    Read-only. Requires `admin` role. Returns the billed plan + status, the
    EFFECTIVE plan (a paid plan that is expired / past_due falls back to
    `discovery`), the resulting capabilities, the self-serve catalog, and the
    recent payment history. Scoped to the staff's active tenant unless the
    caller is a cross-tenant pole-admin (else 403).
  operationId: adminGetTenantBilling
  tags:
    - admin/tenants
  security:
    - StaffSession: []
  responses:
    '200':
      description: Tenant billing state.
      content:
        application/json: {}
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/ServerError'
