parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
post:
  summary: Export every row of a tenant as a JSON archive.
  description: |
    Owner only, 3 requests / 5 min. Content is driven by the manifest
    `utils/tenants/tenantTables.ts`, so a new `tenant_id` table joins the
    export by declaration rather than by remembering. Secrets (API keys,
    tokens, integration credentials) and technical caches are excluded by
    construction — handing a key back to someone who is leaving would be a
    leak with a receipt. A per-table cap is reported in `report.truncated`:
    an archive that lies is worse than no archive.
  operationId: adminExportTenant
  tags:
    - admin/tenants
  security:
    - StaffSession: []
  responses:
    '200':
      description: Archive.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
