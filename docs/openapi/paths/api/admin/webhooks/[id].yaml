parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
patch:
  tags:
    - admin/misc
  summary: Active/désactive et/ou modifie un abonnement webhook.
  operationId: adminPatchWebhook
  x-zod-query: admin.tenants/[id].query
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.webhooks/[id].update
          type: object
          description: >-
            Au moins un champ. `url` suit les règles de la création (HTTPS,
            hôte public) ; réactiver ou changer d'URL remet les échecs à zéro.
          properties:
            enabled:
              type: boolean
            url:
              type: string
              format: uri
            event_types:
              type: array
              items:
                type: string
            description:
              type: string
              nullable: true
  responses:
    '200':
      description: Abonnement mis à jour.
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
delete:
  tags:
    - admin/misc
  summary: Supprime un abonnement webhook (CASCADE ses livraisons).
  operationId: adminDeleteWebhook
  x-zod-query: admin.tenants/[id].query
  security:
    - StaffSession: []
  responses:
    '200':
      description: Supprimé.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
