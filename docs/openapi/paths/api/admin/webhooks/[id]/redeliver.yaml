parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
post:
  tags:
    - admin/misc
  summary: Renvoie une livraison webhook échouée.
  description: >-
    Corps d'origine relu dans l'outbox, signé avec le secret courant. La
    ligne de livraison est mise à jour (tentatives, statut, code HTTP).
    409 `NOT_FAILED` si la livraison n'est pas en échec, 409 `EVENT_GONE`
    si l'event a été purgé de l'outbox.
  operationId: adminRedeliverWebhook
  x-zod-query: admin.tenants/[id].query
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.webhooks/[id]/redeliver.create
          type: object
          required:
            - deliveryId
          properties:
            deliveryId:
              type: string
              format: uuid
  responses:
    '200':
      description: Résultat de l'envoi et livraison mise à jour.
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: Livraison non échouée, ou event purgé de l'outbox.
