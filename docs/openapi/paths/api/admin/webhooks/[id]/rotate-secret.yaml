parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
post:
  tags:
    - admin/misc
  summary: Renouvelle le secret de signature d'un abonnement webhook.
  description: >-
    Le nouveau secret n'est rendu qu'ici, une seule fois, et prend effet
    immédiatement (pas de période de grâce). Jamais mis en cache
    d'idempotence ni journalisé.
  operationId: adminRotateWebhookSecret
  x-zod-query: admin.tenants/[id].query
  security:
    - StaffSession: []
  responses:
    '200':
      description: '`secret` (une fois) + abonnement.'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
