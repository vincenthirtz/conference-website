parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
patch:
  summary: Lock, resolve or cancel a Twitch prediction.
  description: |
    Requires `manager` role and the `channel:manage:predictions` scope.
    `status=RESOLVED` requires `winning_outcome_id`.
  operationId: adminTwitchUpdatePrediction
  tags:
    - admin/twitch
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - LOCKED
                - RESOLVED
                - CANCELED
            winning_outcome_id:
              type: string
  responses:
    '200':
      description: Prediction updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      description: 'Missing scope (code MISSING_SCOPE) or forbidden role.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '409':
      description: 'No broadcaster channel connected (code NOT_CONNECTED).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
