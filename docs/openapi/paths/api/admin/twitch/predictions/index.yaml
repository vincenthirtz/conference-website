get:
  summary: Latest Twitch prediction on the broadcaster channel (or null).
  description: |
    Requires `manager` role. `409 NOT_CONNECTED` when no channel is connected.
  operationId: adminTwitchGetPrediction
  tags:
    - admin/twitch
  security:
    - StaffSession: []
  responses:
    '200':
      description: Latest prediction (or null).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      description: 'No broadcaster channel connected (code NOT_CONNECTED).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
post:
  summary: Create a Twitch prediction.
  description: |
    Requires `manager` role and the `channel:manage:predictions` scope.
    `409 NOT_CONNECTED` if the channel is not connected, `403 MISSING_SCOPE`
    if the granted scope lacks `channel:manage:predictions`.
  operationId: adminTwitchCreatePrediction
  tags:
    - admin/twitch
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - title
            - outcomes
            - prediction_window
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 45
            outcomes:
              type: array
              minItems: 2
              maxItems: 10
              items:
                type: string
                minLength: 1
                maxLength: 25
            prediction_window:
              type: integer
              minimum: 30
              maximum: 1800
  responses:
    '201':
      description: Prediction created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      description: 'Missing scope (code MISSING_SCOPE) or forbidden role.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '409':
      description: 'No broadcaster channel connected (code NOT_CONNECTED).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
