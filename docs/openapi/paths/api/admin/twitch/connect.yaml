get:
  summary: Start the broadcaster OAuth flow (returns the authorize URL).
  description: |
    Requires `manager` role. Signs a state (tenant + user + nonce + returnTo),
    sets an httpOnly nonce cookie (double-submit CSRF) and returns the Twitch
    authorize URL in JSON. `503 TWITCH_NOT_CONFIGURED` when the feature is dormant.
  operationId: adminTwitchConnect
  tags:
    - admin/twitch
  security:
    - StaffSession: []
  responses:
    '200':
      description: Authorize URL.
      content:
        application/json:
          schema:
            type: object
            required:
              - url
            properties:
              url:
                type: string
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '503':
      description: Twitch broadcaster OAuth not configured.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
