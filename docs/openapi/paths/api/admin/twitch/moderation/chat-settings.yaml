patch:
  summary: Update the broadcaster channel chat settings.
  description: |
    Requires `manager` role and the `moderator:manage:chat_settings` scope.
    All fields optional; at least one required. `409 NOT_CONNECTED` /
    `403 MISSING_SCOPE`.
  operationId: adminTwitchChatSettings
  tags:
    - admin/twitch
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.twitch/moderation/chat-settings.body
  responses:
    '200':
      description: Chat settings updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      description: 'Missing scope (code MISSING_SCOPE) or forbidden role.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '409':
      description: 'No broadcaster channel connected (code NOT_CONNECTED).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
