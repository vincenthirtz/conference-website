get:
  summary: List channel-point redemptions for a reward.
  description: |
    Requires `manager` role and the `channel:read:redemptions` scope.
    `reward_id` required; `status` defaults to `UNFULFILLED`. Only rewards
    created by our client_id are manageable. `409 NOT_CONNECTED` /
    `403 MISSING_SCOPE`.
  operationId: adminTwitchListRedemptions
  tags:
    - admin/twitch
  security:
    - StaffSession: []
  parameters:
    - name: reward_id
      in: query
      required: true
      schema:
        type: string
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - UNFULFILLED
          - FULFILLED
          - CANCELED
  responses:
    '200':
      description: Redemptions.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      description: 'Missing scope (code MISSING_SCOPE) or forbidden role.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '409':
      description: 'No broadcaster channel connected (code NOT_CONNECTED).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
patch:
  summary: Fulfill or cancel channel-point redemptions.
  description: |
    Requires `manager` role and the `channel:manage:redemptions` scope.
    Only rewards created by our client_id are manageable.
    `409 NOT_CONNECTED` / `403 MISSING_SCOPE`.
  operationId: adminTwitchUpdateRedemptions
  tags:
    - admin/twitch
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - reward_id
            - redemption_ids
            - status
          properties:
            reward_id:
              type: string
            redemption_ids:
              type: array
              minItems: 1
              maxItems: 50
              items:
                type: string
            status:
              type: string
              enum:
                - FULFILLED
                - CANCELED
  responses:
    '200':
      description: Redemptions updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      description: 'Missing scope (code MISSING_SCOPE) or forbidden role.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '409':
      description: 'No broadcaster channel connected (code NOT_CONNECTED).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
