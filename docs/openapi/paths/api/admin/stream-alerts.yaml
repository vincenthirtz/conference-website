get:
  summary: Réglages de la boîte d'alertes de stream.
  description: |
    Rend les réglages de l'espace (`stream_alert_settings`), les règles
    d'annonce par type (`stream_alert_rules`), et un bloc `media` qui donne
    les URLs SERVABLES des fichiers déposés — la base ne garde que des
    chemins de bucket, inaffichables tels quels par un éditeur.
    `null` / liste vide = l'espace n'a jamais ouvert l'éditeur, et la source
    tourne sur les défauts du code.
    Permission `manage_broadcast`. Rate-limit 60 / min.
  operationId: adminGetStreamAlerts
  tags:
    - admin/broadcast
  security:
    - StaffSession: []
  responses:
    '200':
      description: Réglages et règles courants.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
patch:
  summary: Modifier les réglages de la boîte d'alertes.
  description: |
    PAR ESPACE, PAS PAR TOURNOI, même si l'éditeur vit dans la page Outils
    d'un tournoi : les alertes sont celles de LA CHAÎNE. Les ranger sous un
    tournoi obligerait à tout reconfigurer à chaque édition.

    ÉCRITURE PARTIELLE, JAMAIS UN REMPLACEMENT : seuls les champs reçus sont
    écrits. Deux membres du staff peuvent régler la boîte en même temps
    pendant une préparation de direct sans s'écraser l'un l'autre.

    `''` VEUT DIRE « REVIENS AU DÉFAUT » (écrit `NULL`), pas « vide » :
    effacer une phrase rétablit la formulation par défaut au lieu de laisser
    une alerte muette à l'antenne.

    Le son doit être un chemin du site ou une URL `https://` — cette valeur
    finit dans l'attribut `src` d'un lecteur audio, sur une page de régie.

    FICHIERS DÉPOSÉS (`frame`, `sound`) : base64, avec ou sans préfixe
    `data:`. TROIS ÉTATS chacun — un objet dépose, `null` RETIRE, la clé
    absente ne touche à rien. Un éditeur qui n'envoie pas de fichier ne doit
    pas effacer celui d'hier.

    RETIRER L'HABILLAGE NE LAISSE PAS L'ÉCRAN VIDE : `frame: null` rétablit
    l'habillage du CODE (l'animation du nœud, dont la bande de texte est
    mesurée au pixel). Le fichier par défaut reste dans le dépôt pour ça.

    Le son DÉPOSÉ prime sur l'URL collée ; le retirer fait retomber sur
    l'URL si elle existe.

    Formats : habillage image PNG/JPEG/WebP (2 Mio) ou vidéo MP4/WebM
    (8 Mio) ; son MP3/OGG/WAV (2 Mio). Le contenu réel est vérifié (magic
    bytes) — le `mimeType` d'une requête est une affirmation du client, et
    ces fichiers atterrissent dans un bucket PUBLIC. Corps plafonné à 12 Mo,
    le base64 gonflant d'un tiers.

    Permission `manage_broadcast`.
  operationId: adminPatchStreamAlerts
  tags:
    - admin/broadcast
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            settings:
              type: object
              properties:
                enabled:
                  type: boolean
                durationMs:
                  type: [integer, 'null']
                  minimum: 3000
                  maximum: 60000
                soundUrl:
                  type: [string, 'null']
                soundVolume:
                  type: integer
                  minimum: 0
                  maximum: 100
                accentColor:
                  type: [string, 'null']
            frame:
              description: >-
                Habillage déposé. `null` rétablit celui du code (le nœud).
              type: ['object', 'null']
              required:
                - data
                - mimeType
              properties:
                data:
                  type: string
                  description: base64, préfixe `data:` toléré.
                mimeType:
                  type: string
                  enum:
                    - image/png
                    - image/jpeg
                    - image/webp
                    - video/mp4
                    - video/webm
            sound:
              description: >-
                Son déposé. `null` le retire et fait retomber sur `soundUrl`.
              type: ['object', 'null']
              required:
                - data
                - mimeType
              properties:
                data:
                  type: string
                mimeType:
                  type: string
                  enum:
                    - audio/mpeg
                    - audio/ogg
                    - audio/wav
            rules:
              type: array
              items:
                type: object
                required:
                  - kind
                properties:
                  kind:
                    type: string
                    enum:
                      - follow
                      - sub
                      - resub
                      - gift
                      - cheer
                      - raid
                      - donation
                  enabled:
                    type: boolean
                  message:
                    type: [string, 'null']
                    maxLength: 120
                  minAmount:
                    type: [integer, 'null']
  responses:
    '200':
      description: Enregistré.
    '400':
      description: >-
        Réglage refusé, ou fichier refusé : `code` vaut alors
        `unsupported_type`, `too_large`, `content_mismatch`,
        `invalid_base64` ou `missing_data`, et `maxBytes` donne le plafond
        applicable au type envoyé — pour que l'interface annonce la bonne
        limite au lieu d'en inventer une.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '405':
      description: Méthode non autorisée (GET et PATCH seulement).
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
