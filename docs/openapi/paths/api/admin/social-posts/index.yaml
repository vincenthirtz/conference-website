get:
  summary: Catalogue des destinations + historique des posts multi-cibles.
  operationId: adminGetSocialPosts
  tags:
    - admin/communications
  description: |
    Alimente l'onglet « Reseaux » de /admin/communications. Renvoie le
    catalogue des destinations (`utils/social/platforms.ts` : libelle,
    limite de caracteres, image supportee) et l'historique des envois avec
    le statut et le permalien de CHAQUE cible.

    `knownHashtags` liste les tags deja employes par le tenant, du plus
    frequent au moins : c'est le corpus du champ de recherche de tags, qui
    s'enrichit donc de lui-meme au fil des publications.
  security:
    - StaffSession: []
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    '200':
      description: '`{ platforms[], connections, posts[], knownHashtags[] }`.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Apercu (dryRun) ou publication d'un post sur plusieurs destinations.
  operationId: adminPublishSocialPost
  tags:
    - admin/communications
  description: |
    Un texte redige une fois, envoye sur plusieurs destinations, chacune
    pouvant surcharger texte, image et titre. `dryRun` vaut TRUE par defaut
    — l'UI exige un apercu avant de deverrouiller la publication.

    Une publication reelle ecrit `social_posts` + `social_post_targets`,
    cree l'actualite (cible `site_news`) et emet un event `social.post`
    (cible `discord_announce`). Une seule cible en erreur de validation
    refuse TOUT l'envoi ; une cible en echec a la publication laisse les
    autres partir et donne un statut agrege `partial`.

    Honore `Idempotency-Key` : un double-clic ou un retry ne publie pas deux
    fois, ce qui sur une surface publique ne se rattrape qu'a la main.
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [text, targets]
          properties:
            text:
              type: string
              maxLength: 8000
              description: Texte commun, dont chaque cible herite sans surcharge.
            imageUrl:
              type: [string, 'null']
              format: uri
            targets:
              type: array
              minItems: 1
              items:
                type: object
                required: [platform]
                properties:
                  platform:
                    type: string
                    enum: [site_news, discord_announce, bluesky, instagram]
                  textOverride:
                    type: [string, 'null']
                    description: null = herite ; une chaine vide est refusee.
                  imageOverride:
                    type: [string, 'null']
                    format: uri
                  titleOverride:
                    type: [string, 'null']
                    description: Cible `site_news` seulement ; deduit du texte si absent.
                  hashtags:
                    type: [array, 'null']
                    maxItems: 50
                    items:
                      type: string
                      maxLength: 80
                    description: >
                      Cibles `bluesky` et `instagram` seulement (cf.
                      `supportsHashtags`). Normalises cote serveur (sans
                      croisillon, minuscules, dedoublonnes, 30 max) puis AJOUTES
                      au texte avant la mesure de longueur.
            dryRun:
              type: boolean
              default: true
  responses:
    '200':
      description: 'Apercu (`dryRun: true`) : `{ dryRun, targets[] }`.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '201':
      description: 'Publie : `{ dryRun: false, postId, status, targets[] }`.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      description: Payload invalide, destination en double, ou cible refusee a la
        validation.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
