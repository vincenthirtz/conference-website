post:
  tags:
    - admin/demandes
  summary: Prendre en charge ou liberer une demande (« Je prends » / « Liberer »).
  operationId: adminAssignDemande
  x-zod-query: admin.demandes/[id].query
  description: |
    `claim` assigne la demande au staff appelant (`assigned_staff_id`,
    `assigned_at`) ; un dossier deja pris par quelqu'un d'autre repond 409
    en nommant la personne (pas de vol silencieux, ecriture conditionnelle).
    Reprendre son propre dossier ne remet pas `assigned_at` a zero.
    `release` vide l'assignation, ouverte a tout le staff de la file.

    Journal staff : `process_demande` avec `payload.assignment`.

    503 tant que la migration
    `add_staff_assignment_to_demandes_and_support_tickets.sql` n'est pas
    appliquee.
  security:
    - StaffSession: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.demandes/[id]/assign.body
  responses:
    '200':
      description: 'Etat final : `{ assignment: { id, assigned_staff_id, assigned_at, assigned_to } }`.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '503':
      description: Migration d'assignation non appliquee.
