parameters:
  - $ref: '#/components/parameters/TeamId'
get:
  summary: List tournaments the team is enrolled in.
  operationId: adminListTeamTournaments
  x-zod-query: admin.teams/[teamId]/tournaments.query
  tags:
    - admin/teams
  security:
    - StaffSession: []
  responses:
    '200':
      description: Tournaments.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Enroll a team into a tournament.
  operationId: adminEnrollTeamInTournament
  x-zod-query: admin.teams/[teamId]/tournaments.query
  tags:
    - admin/teams
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.teams/[teamId]/tournaments.body
  responses:
    '201':
      description: Enrolled.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Unenroll a team from a tournament.
  operationId: adminUnenrollTeamFromTournament
  x-zod-query: admin.teams/[teamId]/tournaments.query
  tags:
    - admin/teams
  security:
    - StaffSession: []
  responses:
    '204':
      description: Unenrolled.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.teams/[teamId]/tournaments.body
