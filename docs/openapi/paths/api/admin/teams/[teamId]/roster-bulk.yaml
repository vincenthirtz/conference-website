parameters:
  - $ref: '#/components/parameters/TeamId'
post:
  summary: Bulk roster operations on a team.
  description: |
    Applies one operation to a list of team members (best-effort, per-member
    result). Operations: `set_role`, `set_substitute`, `remove`,
    `import_battle_tags`. The captain can never be removed or marked
    substitute via bulk.
  operationId: adminTeamRosterBulk
  x-zod-query: admin.teams/[teamId].id.query
  tags:
    - admin/teams
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.teams/[teamId]/roster-bulk.body
  responses:
    '200':
      description: Per-member results.
      content:
        application/json:
          schema:
            type: object
            properties:
              operation:
                type: string
              results:
                type: array
                items:
                  type: object
                  properties:
                    memberId:
                      type: string
                    ok:
                      type: boolean
                    error:
                      type: string
              successCount:
                type: integer
              failureCount:
                type: integer
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
