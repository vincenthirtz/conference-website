get:
  summary: List teams of the active tenant.
  operationId: adminListTeams
  tags:
    - admin/teams
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: q
      schema:
        type: string
    - in: query
      name: limit
      schema:
        type: integer
        default: 50
    - in: query
      name: offset
      schema:
        type: integer
        default: 0
  responses:
    '200':
      description: Teams.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
