get:
  summary: List teams of the active tenant.
  operationId: adminListTeams
  x-zod-query: admin.teams.query
  tags:
    - admin/teams
  security:
    - StaffSession: []
  responses:
    '200':
      description: Teams.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
