get:
  summary: Read the team(s) that the current user captains/operates.
  description: >-
    Deprecated alias of `GET /api/player/team` (same handler, lot P10).
  deprecated: true
  operationId: adminGetMyTeams
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
  tags:
    - admin/teams
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Teams.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
patch:
  summary: Patch the team(s) the current user captains/operates.
  description: >-
    Requires the `manage_team_info` team permission (a captain has every
    permission; a privileged role only has its own). Deprecated alias of
    `PATCH /api/player/team` (same handler, lot P10).
  deprecated: true
  operationId: adminPatchMyTeams
  parameters:
    - $ref: '#/components/parameters/SubjectAs'
    - $ref: '#/components/parameters/ActAs'
  tags:
    - admin/teams
  security:
    - PlayerBearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: player.team.patch.body
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
