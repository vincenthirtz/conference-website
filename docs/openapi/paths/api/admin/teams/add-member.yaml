post:
  summary: Invite a member to a team, or add them directly with a reason (admin action).
  description: |
    Requires `manage_teams`; the team must belong to the active tenant.
    By default (`mode` omitted or `invite`) nothing is added: a pending
    invitation (`demandes` type `invite`, source `staff`) is created, the
    person receives the private invite link by email and joins when they
    accept (which sets `team_members.accepted_at`). Response 202 with
    `invited: true`, `invitationId`, `inviteUrl` (returned once, stored
    hashed only) and `emailSent`. `setCaptain` on a team that already has a
    captain is refused with 409 `CAPTAIN_ALREADY_SET`.
    `mode: direct` inserts the member immediately and requires `reason`
    (5-500 characters, 400 `REASON_REQUIRED` otherwise), logged in
    `staff_logs`; the person is notified by email and `accepted_at` stays
    null (no TCG attachment to the tenant). A staff member adding their
    own account is always a direct add with `accepted_at` set.
  operationId: adminAddTeamMember
  tags:
    - admin/teams
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
          properties:
            mode:
              type: string
              enum: [invite, direct]
              default: invite
            reason:
              type: string
              minLength: 5
              maxLength: 500
  responses:
    '200':
      description: 'Member added directly (`mode: direct`).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '202':
      description: Invitation created; the person has not joined yet.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '409':
      description: Pending invitation already exists, or captain already set.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
