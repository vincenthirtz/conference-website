parameters:
  - $ref: '#/components/parameters/TeamId'
get:
  summary: Team detail.
  operationId: adminGetTeam
  x-zod-query: admin.teams/[teamId].query
  tags:
    - admin/teams
  security:
    - StaffSession: []
  responses:
    '200':
      description: Team.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  summary: Patch team fields.
  operationId: adminPatchTeam
  x-zod-query: admin.teams/[teamId].id.query
  tags:
    - admin/teams
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.teams/[teamId].update
  responses:
    '200':
      description: Updated.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
put:
  summary: Replace a team.
  operationId: adminReplaceTeam
  x-zod-query: admin.teams/[teamId].id.query
  tags:
    - admin/teams
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.teams/[teamId].update
  responses:
    '200':
      description: Replaced.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  summary: Soft-delete a team.
  operationId: adminDeleteTeam
  x-zod-query: admin.teams/[teamId].delete.query
  tags:
    - admin/teams
  security:
    - StaffSession: []
  responses:
    '204':
      description: Deleted.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
