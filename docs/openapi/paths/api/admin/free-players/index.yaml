get:
  summary: Liste staff des joueuses libres (les deux provenances).
  description: >
    Vue operateur du marche des joueuses libres. Contrairement a la route
    publique, elle EXPOSE les coordonnees : c'est ce qui permet de traiter une
    demande de retrait arrivee par un autre canal que le lien email.
  operationId: adminListFreePlayers
  tags:
    - admin/users
  security:
    - StaffSession: []
  responses:
    '200':
      description: Fiches du tenant.
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  type: object
    '429':
      $ref: '#/components/responses/RateLimited'
delete:
  summary: Retire une fiche « joueuse libre ».
  description: >
    Seconde porte de sortie, cote operateur — la premiere etant le lien de
    retrait envoye par email a la joueuse. Une fiche de provenance Discord peut
    etre supprimee mais reviendra a la synchro suivante tant que le role est
    porte : la reponse le signale via `willReturn`.
  operationId: adminDeleteFreePlayer
  tags:
    - admin/users
  security:
    - StaffSession: []
  parameters:
    - in: query
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    '200':
      description: Fiche retiree.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              willReturn:
                type: boolean
                description: La synchro Discord la repoussera.
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
    '429':
      $ref: '#/components/responses/RateLimited'
