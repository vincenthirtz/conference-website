get:
  summary: List the active tenant's custom-game presets for a game.
  description: >
    Presets de partie personnalisee : code d'import du jeu + rappel de config,
    resolus par perimetre (defaut tenant > tournoi > phase). Aucun jeu n'expose
    d'API pour lancer un lobby, ce code est le seul raccourci automatisable.


    `?game=<slug>` (defaut `overwatch`). `?tournament_id=<uuid>` restreint au
    perimetre de ce tournoi PLUS le defaut tenant (son repli). Tri du plus
    general au plus specifique.
  operationId: adminListCustomGamePresets
  tags:
    - admin/misc
  security:
    - StaffSession: []
  parameters:
    - name: game
      in: query
      required: false
      schema:
        type: string
    - name: tournament_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Presets du tenant pour ce jeu.
      content:
        application/json:
          schema:
            type: object
            properties:
              presets:
                type: array
                items:
                  type: object
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create a custom-game preset for a scope.
  description: >
    Cree un preset. Un seul preset par perimetre (tenant, jeu, tournament_id,
    stage_id) — index unique DB, ce qui rend la resolution deterministe : 409
    `DUPLICATE_PRESET_SCOPE` sinon. `stage_id` exige `tournament_id`. Le code
    d'import est normalise (Overwatch : majuscules, espaces et tirets retires)
    puis valide (4-12 alphanumeriques).
  operationId: adminCreateCustomGamePreset
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - import_code
          properties:
            game:
              type: string
            tournament_id:
              type: [string, 'null']
              format: uuid
            stage_id:
              type: [string, 'null']
              format: uuid
            name:
              type: string
            import_code:
              type: string
            description:
              type: [string, 'null']
            map_pool:
              type: array
              items:
                type: string
            enabled:
              type: boolean
  responses:
    '201':
      description: Preset cree.
      content:
        application/json:
          schema:
            type: object
            properties:
              preset:
                type: object
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: Un preset existe deja sur ce perimetre.
