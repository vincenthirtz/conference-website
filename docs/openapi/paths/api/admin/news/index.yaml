get:
  summary: List news posts (admin view, includes drafts).
  operationId: adminListNews
  tags:
    - admin/content
  security:
    - StaffSession: []
  responses:
    '200':
      description: News list.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create a news post.
  operationId: adminCreateNews
  tags:
    - admin/content
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
