get:
  summary: List tournaments of the active tenant.
  operationId: adminListTournaments
  x-zod-query: admin.tournaments.query
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  responses:
    '200':
      description: Tournaments.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  summary: Create a tournament.
  operationId: adminCreateTournament
  tags:
    - admin/tournaments
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: admin.tournaments.create
  responses:
    '201':
      description: Created.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
