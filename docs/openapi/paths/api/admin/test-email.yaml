post:
  summary: Send a test transactional email to the current staff.
  operationId: adminTestEmail
  tags:
    - admin/misc
  security:
    - StaffSession: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          x-zod: admin.test-email.body
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Sent.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
