parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
get:
  tags:
    - public/tournaments
  summary: Jauge publique de la cagnotte (prize pool) d'un tournoi.
  operationId: getTournamentPrizePool
  description: |
    « Profondeur de la monétisation » — données de la jauge de cagnotte
    crowdfundée. Total affiché = `baseAmountCents` + `raisedAmountCents`.
    N'expose jamais l'email d'un contributeur ; une contribution anonyme voit
    son `name` masqué (`null`). Aucune cagnotte → même forme avec
    `exists:false`, montants à zéro et `recentContributors:[]` (200).
    `Cache-Control: public, s-maxage=60`. Rate-limit 60 req / IP / minute.
  security: []
  responses:
    '200':
      description: État de la cagnotte (ou forme vide si absente).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrizePoolPublic'
    '400':
      $ref: '#/components/responses/BadRequest'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
