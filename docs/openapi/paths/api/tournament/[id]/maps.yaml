parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: round
    in: query
    required: false
    description: >-
      Pool d'une JOURNÉE (`matches.round_number`, entier >= 1). Absent (ou
      `default`) avec `date` absent : pool par défaut du tournoi. Toutes les
      opérations (GET/POST/PUT/DELETE en masse) sont bornées à ce pool. 400 si
      illisible ou combiné à `date`.
    schema:
      type: string
      pattern: '^(\d+|default)$'
  - name: date
    in: query
    required: false
    description: >-
      Pool d'une DATE de jeu (`YYYY-MM-DD`, jour calendaire Europe/Paris),
      prioritaire sur le pool de journée pour les matchs de ce jour. Les
      opérations sont bornées à ce pool ; le DELETE sans `mapId` ne vide que
      lui. 400 si invalide ou combiné à `round`.
    schema:
      type: string
      format: date
get:
  tags:
    - public/tournaments
  summary: Gestion des maps d'un tournoi (pool de maps). Lecture staff (manager+).
  operationId: getTournamentMaps
  security:
    - StaffSession: []
  responses:
    '200':
      description: >-
        Maps du pool ciblé, plus `round` / `date` (portée effective), `rounds`
        (journées du planning avec leur nombre de cartes) et `dates` (jours
        programmés `{ date, rounds, mapsCount }`).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  tags:
    - public/tournaments
  summary: Ajoute des maps au pool d'un tournoi. Staff manager+.
  operationId: createTournamentMaps
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Maps ajoutees.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
put:
  tags:
    - public/tournaments
  summary: Remplace le pool de maps d'un tournoi. Staff manager+.
  operationId: replaceTournamentMaps
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Maps remplacees.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
patch:
  tags:
    - public/tournaments
  summary: Met a jour partiellement les maps d'un tournoi. Staff manager+.
  operationId: patchTournamentMaps
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '200':
      description: Maps mises a jour.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
delete:
  tags:
    - public/tournaments
  summary: Supprime des maps du pool d'un tournoi. Staff manager+.
  operationId: deleteTournamentMaps
  security:
    - StaffSession: []
  responses:
    '204':
      description: Supprime.
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
