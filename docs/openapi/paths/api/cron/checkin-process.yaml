get:
  tags:
    - cron
  summary: Process per-match check-in flow (every 5 minutes).
  operationId: cronCheckinProcessGet
  description: |
    Schedule: every 5 minutes (`*/5 * * * *`) via Netlify scheduled
    function `checkin-cron`.

    Calls `processCheckinForUpcomingMatches()` which scans upcoming
    matches and triggers, depending on time-to-kickoff:
      - email reminders ~1h before kickoff
      - Discord webhook reminders at T-30 / T-15
      - auto-forfeit at T-0 when one side has not checked in

    Cross-tenant by design (all tenants scanned in one pass).
    Heartbeat: on success, upserts `site_settings.last_cron_checkin_at`
    with the current ISO timestamp so the mega-dashboard can detect a
    stalled cron.

    Auth: `Authorization: Bearer <CRON_SECRET>` header OR
    `?secret=<CRON_SECRET>` query string. Both GET and POST accepted.
  security:
    - CronSecret: []
  responses:
    '200':
      description: Check-in tick summary.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '500':
      $ref: '#/components/responses/ServerError'
post:
  tags:
    - cron
  summary: Process per-match check-in flow (every 5 minutes).
  operationId: cronCheckinProcessPost
  description: |
    Same as `GET /api/cron/checkin-process`.
  security:
    - CronSecret: []
  responses:
    '200':
      description: Check-in tick summary.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '500':
      $ref: '#/components/responses/ServerError'
