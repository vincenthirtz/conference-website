get:
  tags:
    - public/v1
  summary: Spécification OpenAPI publique (machine-readable).
  description: >
    Spec OpenAPI 3.1 filtrée à la surface publique (`/api/public/*`), dérivée de
    la spec canonique `docs/openapi.yaml`. Anonyme, CORS `*`, rate-limitée (120
    req/min/IP). `?format=yaml` pour la variante YAML. À importer dans Postman /
    un générateur de code.
  operationId: publicGetOpenApiSpec
  security: []
  parameters:
    - name: format
      in: query
      required: false
      schema:
        type: string
        enum:
          - json
          - yaml
        default: json
  responses:
    '200':
      description: Document OpenAPI (JSON par défaut, YAML si demandé).
      content:
        application/json:
          schema:
            type: object
        text/yaml:
          schema:
            type: string
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
