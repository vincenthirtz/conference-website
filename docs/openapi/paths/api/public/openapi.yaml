get:
  tags:
    - public/v1
  summary: Spécification OpenAPI publique (machine-readable).
  description: |
    Spec OpenAPI 3.1 filtrée à la surface publique (`/api/public/*`), dérivée
    de la spec complète (fragments `docs/openapi/`). À importer dans Postman ou
    un générateur de code. Version rendue lisible : `/developpeurs/reference`.

    Anonyme, CORS `*`. Limite : 120 requêtes par minute par IP (le 429 n'a pas
    de `code`). Cache : `public, max-age=300, s-maxage=3600`.

    ATTENTION — cache CDN : `format` est lu par le code, mais la clé de cache
    du CDN l'ignore. Pendant une heure, la première variante mise en cache
    (JSON ou YAML) est servie aux deux. Préférer la variante JSON (sans
    paramètre) ; `?format=yaml` n'est pas fiable aujourd'hui.
  operationId: publicGetOpenApiSpec
  security: []
  parameters:
    - name: format
      in: query
      required: false
      description: |
        `yaml` pour la variante YAML (`text/yaml`), toute autre valeur donne du
        JSON. Non fiable aujourd'hui (cache CDN, voir la description).
      schema:
        type: string
        enum:
          - json
          - yaml
        default: json
  responses:
    '200':
      description: Document OpenAPI (JSON par défaut, YAML si demandé).
      content:
        application/json:
          schema:
            type: object
        text/yaml:
          schema:
            type: string
    '405':
      $ref: '#/components/responses/PublicMethodNotAllowed'
    '429':
      $ref: '#/components/responses/PublicRateLimited'
    '500':
      $ref: '#/components/responses/PublicServerError'
