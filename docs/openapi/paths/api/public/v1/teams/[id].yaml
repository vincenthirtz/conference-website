parameters:
  - name: id
    in: path
    required: true
    description: Id (UUID) ou slug de l'équipe.
    schema:
      type: string
get:
  tags:
    - public/v1
  summary: Équipe publique + roster public (sans données privées).
  operationId: publicV1GetTeam
  security: []
  responses:
    '200':
      description: Détail équipe.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: '#/components/schemas/PublicV1Team'
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
