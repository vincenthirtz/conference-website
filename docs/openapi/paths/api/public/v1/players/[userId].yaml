parameters:
  - name: userId
    in: path
    required: true
    description: Id (UUID) de la joueuse.
    schema:
      type: string
      format: uuid
get:
  tags:
    - public/v1
  summary: Profil public d'une joueuse (rating, historique, H2H, achievements).
  operationId: publicV1GetPlayer
  security: []
  responses:
    '200':
      description: Profil joueur.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: '#/components/schemas/PlayerProfileResponse'
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
