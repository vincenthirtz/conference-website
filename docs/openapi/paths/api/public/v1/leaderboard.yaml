get:
  tags:
    - public/v1
  summary: Classement Glicko-2 public des joueuses.
  operationId: publicV1GetLeaderboard
  security: []
  parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    '200':
      description: Page du classement + pagination.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardPlayer'
              pagination:
                $ref: '#/components/schemas/PublicV1Pagination'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
