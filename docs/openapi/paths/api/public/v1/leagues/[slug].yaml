parameters:
  - name: slug
    in: path
    required: true
    description: Slug de la ligue (pas d'identifiant UUID).
    schema:
      type: string
get:
  tags:
    - public/v1
  summary: Détail public d'une league (standings + tournois liés).
  description: |
    Ligue publique de l'espace servi avec son classement, ses tournois et ses
    scrims comptés. 404 si la ligue est inconnue, privée ou en brouillon.

    Espace servi : voir « Quel espace répond » dans l'introduction. Le jeton
    `Authorization` est ignoré ici.

    Anonyme, CORS `*`. Limite : 120 requêtes par minute par IP pour cet
    endpoint. Cache CDN : 120 s.
  operationId: publicV1GetLeague
  security: []
  responses:
    '200':
      description: Détail league.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PublicCacheControl'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: '#/components/schemas/LeagueDetailResponse'
          example:
            data:
              league:
                id: 4b3a2918-0f7e-4d6c-95b4-a39281706f5e
                name: Saison 2026
                slug: saison-2026
                description: null
                game: overwatch
                status: active
                start_date: '2026-01-10'
                end_date: '2026-12-20'
                points_table:
                  '1': 100
                  '2': 70
                  '3': 50
                is_public: true
                created_at: '2025-12-01T10:00:00+00:00'
                updated_at: '2026-09-01T08:30:00+00:00'
              standings:
                - teamId: 1e2d3c4b-5a69-4788-9a0b-1c2d3e4f5a6b
                  teamName: Les Aurores
                  teamSlug: les-aurores
                  logoUrl: https://example.org/logos/aurores.png
                  points: 170
                  tournamentsCounted: 2
                  scrimsCounted: 1
                  bestRank: 1
                  rank: 1
              tournaments:
                - id: 3f2c8a1e-6b4d-4c7a-9e21-5d8f0b7a1c34
                  name: Coupe d'automne 2026
                  slug: coupe-automne-2026
                  weight: 1
              scrims:
                - id: 7f6e5d4c-3b2a-4190-8f7e-6d5c4b3a2190
                  name: Aurores vs Nébuleuse
                  slug: null
                  weight: 0.5
                  team1Name: Les Aurores
                  team2Name: Nébuleuse
                  team1Score: 3
                  team2Score: 1
                  scheduledDate: '2026-09-12T19:00:00+00:00'
    '404':
      $ref: '#/components/responses/PublicNotFound'
    '405':
      $ref: '#/components/responses/PublicMethodNotAllowed'
    '429':
      $ref: '#/components/responses/PublicRateLimited'
    '500':
      $ref: '#/components/responses/PublicServerError'
