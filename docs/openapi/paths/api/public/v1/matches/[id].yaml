parameters:
  - name: id
    in: path
    required: true
    description: Id (UUID) du match.
    schema:
      type: string
      format: uuid
get:
  tags:
    - public/v1
  summary: Détail d'un match public + games (map par map).
  operationId: publicV1GetMatch
  security: []
  responses:
    '200':
      description: Détail match.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: '#/components/schemas/PublicV1MatchDetail'
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
