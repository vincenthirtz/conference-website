parameters:
  - name: id
    in: path
    required: true
    description: Id (UUID) du match.
    schema:
      type: string
      format: uuid
post:
  tags:
    - public/v1
  summary: Pose le score final d'un match (écriture publique authentifiée).
  description: |
    Écriture publique autoritaire (pas de consensus capitaine) — réutilise
    `applyMatchScore`. Idempotent (`Idempotency-Key`). Requiert le scope
    `matches:write`.
  operationId: publicV1ReportMatchResult
  security:
    - PublicApiToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          # Généré depuis le schéma zod du handler (lib/apiContracts).
          x-zod: public.v1.matchResult
  responses:
    '200':
      description: Match finalisé.
      content:
        application/json:
          schema:
            # Généré depuis le contrat zod ; le handler construit sa réponse avec ce type.
            x-zod: public.v1.matchResult.response
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '429':
      $ref: '#/components/responses/RateLimited'
