get:
  tags:
    - public/v1
  summary: Liste des tournois publics (published/running/completed).
  operationId: publicV1ListTournaments
  security: []
  parameters:
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - published
          - running
          - completed
    - name: game
      in: query
      required: false
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    '200':
      description: Page de tournois publics + pagination.
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/PublicV1TournamentSummary'
              pagination:
                $ref: '#/components/schemas/PublicV1Pagination'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
