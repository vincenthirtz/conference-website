parameters:
  - name: id
    in: path
    required: true
    description: Id (UUID) ou slug du tournoi.
    schema:
      type: string
get:
  tags:
    - public/v1
  summary: Classement final du tournoi (vide si non finalisé).
  description: |
    Classement final d'un tournoi public (404 si le tournoi est inconnu ou
    non public). Liste VIDE tant que le tournoi n'a pas été finalisé : ce n'est
    pas une erreur.

    Espace servi : voir « Quel espace répond » dans l'introduction. Le jeton
    `Authorization` est ignoré ici.

    Anonyme, CORS `*`. Limite : 120 requêtes par minute par IP pour cet
    endpoint. Cache : 60 s.
  operationId: publicV1GetTournamentStandings
  security: []
  parameters:
    - $ref: '#/components/parameters/PublicTenant'
  responses:
    '200':
      description: Classement final trié par rank.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PublicCacheControl'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/PublicV1Standing'
          example:
            data:
              - rank: 1
                teamId: 1e2d3c4b-5a69-4788-9a0b-1c2d3e4f5a6b
                teamName: Les Aurores
                teamSlug: les-aurores
                logoUrl: https://example.org/logos/aurores.png
                prize: null
    '404':
      $ref: '#/components/responses/PublicNotFound'
    '405':
      $ref: '#/components/responses/PublicMethodNotAllowed'
    '429':
      $ref: '#/components/responses/PublicRateLimited'
    '500':
      $ref: '#/components/responses/PublicServerError'
