get:
  tags:
    - public/misc
  summary: Liste les derniers builds Netlify (status badge).
  operationId: getNetlifyBuilds
  security: []
  responses:
    '200':
      description: Builds recents.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '503':
      description: Netlify creds non configures.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
