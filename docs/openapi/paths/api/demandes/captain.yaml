get:
  parameters:
    - $ref: '#/components/parameters/SubjectAs'
  tags:
    - public/teams
  summary: Liste les demandes de capitanat (recues/emises) du joueur connecte.
  operationId: listCaptainDemandes
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Demandes.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
post:
  tags:
    - public/teams
  summary: Soumet une demande de capitanat / changement.
  operationId: submitCaptainDemande
  security:
    - PlayerBearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    '201':
      description: Demande creee.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
