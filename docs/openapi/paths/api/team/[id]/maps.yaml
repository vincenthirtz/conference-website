parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
get:
  tags:
    - public/teams
  summary: Profil de maps d'une equipe (stats par map sur tous les matchs joues).
  operationId: getTeamMaps
  security: []
  responses:
    '200':
      description: Stats par map.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
