get:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
    - $ref: '#/components/parameters/ActAs'
  tags:
    - public/teams
  summary: Etat du lien d'auto-inscription actif de l'equipe geree.
  description: >-
    Le « lien d'equipe » : un lien prive et unique que la capitaine (ou un
    manager) diffuse elle-meme, et qui inscrit AU ROSTER quiconque l'ouvre en
    etant connecte — sans email, sans invitation nominative. Gate
    `manage_roster`. Le jeton n'est JAMAIS renvoye ici : il n'est stocke que
    hashe (SHA-256) et n'est montre qu'une fois, a la creation.
  operationId: playerGetTeamInviteLink
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Lien actif, ou null s'il n'y en a pas.
      content:
        application/json:
          schema:
            type: object
            required:
              - link
            properties:
              link:
                type: [object, 'null']
    '403':
      description: L'appelante ne gere pas cette equipe.
post:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
    - $ref: '#/components/parameters/ActAs'
  tags:
    - public/teams
  summary: (Re)genere le lien d'auto-inscription de l'equipe.
  description: >-
    Revoque le lien precedent (un seul lien vivant par equipe) et en cree un
    neuf. Le jeton en clair est renvoye UNE SEULE FOIS. Anti-escalade : seule la
    capitaine peut creer un lien qui accorde un role a privileges (403
    ROLE_ESCALATION sinon). Refuse si le roster est verrouille par un tournoi en
    cours (409 ROSTER_LOCKED).
  operationId: playerCreateTeamInviteLink
  security:
    - PlayerBearer: []
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            role:
              type: string
              description: Role attribue a qui entre par ce lien. Fige.
            max_uses:
              type: [integer, 'null']
              minimum: 1
              maximum: 50
              description: Nombre d'entrees autorisees. null = illimite.
            ttl_days:
              type: integer
              minimum: 1
              maximum: 30
  responses:
    '201':
      description: Lien cree. token / url ne seront plus jamais reaffiches.
      content:
        application/json:
          schema:
            type: object
            required:
              - link
              - url
              - token
            properties:
              link:
                type: object
              url:
                type: string
              token:
                type: string
    '400':
      description: Corps invalide (INVALID_BODY).
    '403':
      description: Pas de permission, ou ROLE_ESCALATION.
    '409':
      description: Roster verrouille (ROSTER_LOCKED).
delete:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
    - $ref: '#/components/parameters/ActAs'
  tags:
    - public/teams
  summary: Revoque le lien d'auto-inscription actif.
  description: >-
    Le lien cesse immediatement de fonctionner. Idempotent : revoquer alors
    qu'il n'y a pas de lien actif reussit sans rien changer.
  operationId: playerRevokeTeamInviteLink
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Lien revoque.
      content:
        application/json:
          schema:
            type: object
            properties:
              link:
                type: [object, 'null']
              revoked:
                type: boolean
