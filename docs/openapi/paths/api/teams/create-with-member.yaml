post:
  tags:
    - public/teams
  summary: Cree une equipe avec capitaine + roster initial (route publique
    self-service).
  operationId: createTeamWithMember
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: player.onboarding.create-team
  responses:
    '200':
      description: Equipe + membres crees.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '500':
      $ref: '#/components/responses/ServerError'
