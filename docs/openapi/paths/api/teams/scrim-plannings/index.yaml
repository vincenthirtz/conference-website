get:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
  tags:
    - public/teams
  summary: List open scrim planning sessions visible to the caller (captain or staff).
  operationId: listScrimPlannings
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Open plannings with the caller's party and availability.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
