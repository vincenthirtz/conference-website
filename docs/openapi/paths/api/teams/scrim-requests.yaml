get:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
  tags:
    - public/teams
  summary: Le capitaine liste les demandes de scrim recues pour son equipe.
  operationId: listInboundScrimRequests
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Demandes scrim pending.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  tags:
    - public/teams
  summary: Accepte ou refuse une demande de scrim recue.
  operationId: respondToScrimRequest
  parameters:
    - $ref: '#/components/parameters/TeamScope'
  security:
    - PlayerBearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - requestId
            - action
          properties:
            requestId:
              type: string
              format: uuid
            action:
              type: string
              enum:
                - accept
                - reject
            reason:
              type: string
  responses:
    '200':
      description: Action appliquee.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/RateLimited'
