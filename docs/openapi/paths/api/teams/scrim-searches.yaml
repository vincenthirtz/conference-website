get:
  tags:
    - public/teams
  summary: Recherche de scrim active de mon equipe (ou null).
  operationId: playerGetScrimSearch
  parameters:
    - $ref: '#/components/parameters/TeamScope'
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Recherche active, ou null si aucune (ou perimee).
      content:
        application/json:
          schema:
            type: object
            properties:
              search:
                anyOf:
                  - $ref: '#/components/schemas/ScrimSearch'
                  - type: 'null'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/RateLimited'
post:
  tags:
    - public/teams
  summary: Publier / relancer la recherche de scrim de mon equipe.
  description: >-
    Annonce DATEE et perissable : les creneaux doivent etre futurs, et l'annonce
    expire d'elle-meme (dernier creneau + 2 h). Une seule annonce active par
    equipe — republier met a jour l'existante. Les equipes dont les creneaux se
    recoupent recoivent `scrim.search.matched` (push / Discord / email selon
    leurs preferences). `teams.open_for_scrim` est recale en consequence : le
    booleen devient un derive. Permission requise : `manage_scrims`.
  operationId: playerPublishScrimSearch
  parameters:
    - $ref: '#/components/parameters/TeamScope'
  security:
    - PlayerBearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - slots
          properties:
            slots:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: string
                format: date-time
            format:
              type: [string, 'null']
            note:
              type: [string, 'null']
              maxLength: 280
  responses:
    '201':
      description: Annonce publiee.
      content:
        application/json:
          schema:
            type: object
            properties:
              search:
                $ref: '#/components/schemas/ScrimSearch'
              matchedTeams:
                type: integer
                description: Nombre d'equipes compatibles notifiees.
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/RateLimited'
delete:
  tags:
    - public/teams
  summary: Clore la recherche de scrim active de mon equipe.
  operationId: playerCloseScrimSearch
  parameters:
    - $ref: '#/components/parameters/TeamScope'
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Annonce close.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              search:
                type: [object, 'null']
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '429':
      $ref: '#/components/responses/RateLimited'
