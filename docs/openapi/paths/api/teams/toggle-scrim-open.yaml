post:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
    - $ref: '#/components/parameters/ActAs'
  tags:
    - public/teams
  summary: Bascule le flag open_for_scrim de l'equipe (opt-in public /scrim).
  operationId: toggleTeamScrimOpen
  security:
    - PlayerBearer: []
  requestBody:
    required: false
    description: "`open` absent : bascule de l'etat courant."
    content:
      application/json:
        schema:
          x-zod: player.teams.toggle-scrim-open.body
  responses:
    '200':
      description: Nouveau flag applique.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '429':
      $ref: '#/components/responses/RateLimited'
