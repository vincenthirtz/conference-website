get:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
  tags:
    - public/teams
  summary: Le capitaine liste les demandes de join pending pour son equipe.
  operationId: listJoinRequests
  security:
    - PlayerBearer: []
  responses:
    '200':
      description: Demandes pending.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
post:
  parameters:
    - $ref: '#/components/parameters/TeamScope'
    - $ref: '#/components/parameters/SubjectAs'
    - $ref: '#/components/parameters/ActAs'
  tags:
    - public/teams
  summary: Approuve ou rejette une demande de join (ajoute le membre si approuvee).
  operationId: respondToJoinRequest
  security:
    - PlayerBearer: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - requestId
            - action
          properties:
            requestId:
              type: string
              format: uuid
            action:
              type: string
              enum:
                - approve
                - reject
            role:
              type: string
  responses:
    '200':
      description: Action appliquee.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
