get:
  tags:
    - teams
  summary: Feuille de match d'une equipe (etat, roster eligible, composition).
  description: >-
    S'ouvre une fois le CHECK-IN de l'equipe effectue. Permission d'equipe
    `validate_lineup` (capitaine, manager, coach).
  operationId: getTeamMatchLineup
  security:
    - PlayerBearer: []
  parameters:
    - name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Etat de la feuille.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '403':
      description: Role sans permission `validate_lineup`.
    '404':
      description: Match introuvable.
put:
  tags:
    - teams
  summary: Enregistre la composition (brouillon).
  operationId: saveTeamMatchLineup
  security:
    - PlayerBearer: []
  parameters:
    - name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - starters
          properties:
            starters:
              type: array
              items:
                type: string
                format: uuid
  responses:
    '200':
      description: Composition enregistree.
    '409':
      description: Feuille close (check-in manquant, match termine) ou deja validee.
post:
  tags:
    - teams
  summary: Valide la feuille (validated_by_kind = team).
  operationId: validateTeamMatchLineup
  security:
    - PlayerBearer: []
  parameters:
    - name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            starters:
              type: array
              items:
                type: string
                format: uuid
  responses:
    '200':
      description: Feuille validee.
    '409':
      description: Feuille close ou deja validee.
