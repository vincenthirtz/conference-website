get:
  tags:
    - public/tcg
  summary: Figurine voxel d'un heros Overwatch, en SVG.
  description: >-
    Rendue a la volee par le moteur des maquettes. Tout est dans le CHEMIN et
    rien dans la query : le cache CDN ne distingue pas deux variantes d'une
    meme URL par leurs parametres. La sortie ne dependant que du chemin, elle
    se met en cache un an, et la version (v1) permet a une retouche des modeles
    de se propager sans attendre l'expiration.

    PAS DE COULEUR D'EQUIPE, contrairement aux figurines de role : un heros a
    SES couleurs, et c'est la couleur dominante qui le fait reconnaitre a cette
    taille.
  operationId: tcgHeroFigureSvg
  security: []
  parameters:
    - name: version
      in: path
      required: true
      schema:
        type: string
      description: Version des modeles, `v1`. Une autre version rend 404.
    - name: file
      in: path
      required: true
      schema:
        type: string
      description: "`<slug>.svg`, le slug d'un heros sculpte (ex. `reinhardt.svg`)."
  responses:
    '200':
      description: Le SVG de la figurine.
      content:
        image/svg+xml:
          schema:
            type: string
    '404':
      description: Version inconnue, ou heros non sculpte.
    '405':
      description: Methode non autorisee.
