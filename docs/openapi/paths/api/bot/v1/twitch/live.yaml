get:
  tags:
    - bot/misc
  summary: Channels Twitch enregistres + statut live courant (cache 60s).
  operationId: botGetTwitchLive
  parameters:
    - name: includeOffline
      in: query
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: Liste live (+ offline si demande).
      content:
        application/json: {}
    "401":
      $ref: "#/components/responses/Unauthorized"
    "429":
      $ref: "#/components/responses/RateLimited"
