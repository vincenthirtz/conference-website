get:
  tags:
    - bot/misc
  summary: Liste les demandes (toutes equipes) avec filtres status/type.
  operationId: botListDemandes
  parameters:
    - name: status
      in: query
      schema:
        type: string
    - name: type
      in: query
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    '200':
      description: Liste paginate.
      content:
        application/json: {}
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "429":
      $ref: "#/components/responses/RateLimited"
