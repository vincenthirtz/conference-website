parameters:
  - $ref: '#/components/parameters/StageId'
post:
  tags:
    - bot/tournaments
  summary: Marque BYE les matchs incomplets d'un stage et propage le bracket.
  operationId: botStageAutoByes
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.stages/[stageId]/auto-byes
          properties:
            actorDiscordUserId:
              description: Snowflake Discord (user, guild, channel, role).
  responses:
    '200':
      description: Auto-byes appliques.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      $ref: '#/components/responses/Forbidden'
  x-zod-query: bot.stages/[stageId]/auto-byes.query
