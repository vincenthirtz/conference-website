parameters:
  - $ref: '#/components/parameters/StageId'
post:
  tags:
    - bot/tournaments
  summary: Finalise une phase (is_active=false).
  operationId: botFinalizeStage
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - actorDiscordUserId
          properties:
            actorDiscordUserId:
              $ref: '#/components/schemas/DiscordId'
            force:
              type: boolean
              default: false
  responses:
    '200':
      description: Phase finalisee.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ok'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
