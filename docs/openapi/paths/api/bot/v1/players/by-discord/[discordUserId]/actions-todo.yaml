parameters:
  - $ref: '#/components/parameters/DiscordUserId'
get:
  tags:
    - bot/players
  summary: Actions a faire (todo) du joueur.
  operationId: botGetPlayerActionsTodo
  responses:
    '200':
      description: Liste todo.
      content:
        application/json:
          schema:
            type: object
            properties:
              todos:
                type: array
                items:
                  type: object
                  additionalProperties: true
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "404":
      $ref: "#/components/responses/NotFound"
    "429":
      $ref: "#/components/responses/RateLimited"
