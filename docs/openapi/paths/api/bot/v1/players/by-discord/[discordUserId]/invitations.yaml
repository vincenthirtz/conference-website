parameters:
  - $ref: '#/components/parameters/DiscordUserId'
get:
  tags:
    - bot/players
  summary: Invitations pending recues par ce joueur.
  operationId: botGetPlayerInvitations
  responses:
    '200':
      description: Liste des invitations.
      content:
        application/json:
          schema:
            type: object
            properties:
              invitations:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "404":
      $ref: "#/components/responses/NotFound"
    "429":
      $ref: "#/components/responses/RateLimited"
