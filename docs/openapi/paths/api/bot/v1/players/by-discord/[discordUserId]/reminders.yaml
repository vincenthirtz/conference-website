parameters:
  - $ref: '#/components/parameters/DiscordUserId'
get:
  tags:
    - bot/players
  summary: Reminders dus pour ce joueur.
  operationId: botGetPlayerReminders
  responses:
    '200':
      description: Liste des reminders.
      content:
        application/json:
          schema:
            type: object
            properties:
              reminders:
                type: array
                items:
                  $ref: '#/components/schemas/Reminder'
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "404":
      $ref: "#/components/responses/NotFound"
    "429":
      $ref: "#/components/responses/RateLimited"
