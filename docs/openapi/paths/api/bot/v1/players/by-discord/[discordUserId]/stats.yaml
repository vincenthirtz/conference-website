parameters:
  - $ref: '#/components/parameters/DiscordUserId'
get:
  tags:
    - bot/players
  summary: Stats agregees d'un joueur (wins/losses/etc.).
  operationId: botGetPlayerStats
  responses:
    '200':
      description: Stats joueur.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "404":
      $ref: "#/components/responses/NotFound"
    "429":
      $ref: "#/components/responses/RateLimited"
