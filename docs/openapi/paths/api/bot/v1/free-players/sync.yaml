post:
  tags:
    - bot/free-players
  summary: Full-replace des joueurs libres du tenant (role "Recherche une equipe").
  description: >-
    Le bot pousse la liste complete des membres Discord portant le role
    "Recherche une equipe". Le site remplace integralement la table free_players
    du tenant par la liste recue (upsert des presents + purge des absents). Pour
    chaque joueur, auth_user_id est resolu via user_discord_links (null si non
    lie au site).
  operationId: botSyncFreePlayers
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.free-players/sync
          properties:
            players:
              items:
                properties:
                  discordUserId:
                    description: Snowflake Discord (user, guild, channel, role).
  responses:
    '200':
      description: Synchronisation effectuee.
      content:
        application/json:
          schema:
            type: object
            required:
              - count
              - linked
              - unlinked
              - unlinkedDiscordIds
            properties:
              count:
                type: integer
                description: Nombre de joueurs libres apres synchronisation.
              linked:
                type: integer
                description: Nombre de joueurs dont le compte Discord est lie au site.
              unlinked:
                type: integer
                description: Nombre de joueurs sans compte site lie.
              unlinkedDiscordIds:
                type: array
                description: >-
                  Les discordUserId du set recu sans compte site lie
                  (sous-ensemble du payload ; unlinked = longueur du tableau).
                  Le bot l'utilise pour cibler le CTA /inscription.
                items:
                  $ref: '#/components/schemas/DiscordId'
    '400':
      $ref: '#/components/responses/BadRequest'
