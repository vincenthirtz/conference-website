parameters:
  - $ref: '#/components/parameters/MatchId'
get:
  tags:
    - bot/matches
  summary: Vue capitaine / manager — liste les preuves attachées à un de ses matches.
  operationId: botListMatchEvidence
  parameters:
    - name: actorDiscordUserId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DiscordId'
  responses:
    '200':
      description: Liste des preuves (URLs signées courte-durée pour les binaires).
      content:
        application/json:
          schema:
            type: object
            required:
              - matchId
              - evidence
            properties:
              matchId:
                $ref: '#/components/schemas/Uuid'
              evidence:
                type: array
                items:
                  $ref: '#/components/schemas/MatchEvidenceItem'
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      description: |
        Le compte Discord (via `user_discord_links`, tous les comptes du site
        lies) n'est ni capitaine (`teams.captain_id`) ni manager d'equipe
        (`team_members.role = 'manager'`) d'une des deux equipes du match, dans
        le tenant du match — les coachs sont exclus. `code: REPORT_BOTH_SIDES` :
        il tient les DEUX equipes du match (une preuve porte un `team_side`, une seule personne ne la depose pas pour les deux cotes). Meme regle que
        `/api/bot/v1/matches/{matchId}/report` (utils/matches/reportRight.ts).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/ServerError'
  x-zod-query: bot.matches/[matchId]/evidence.query
post:
  tags:
    - bot/matches
  summary: Capitaine ou manager d'équipe attache une preuve à un match (capture, replay, ou lien).
  description: |
    Union discriminée sur `kind`. `screenshot` / `replay_file` portent un
    binaire base64 (validé : magic bytes + extension allowlistée), hashé
    (sha256) et uploadé dans le bucket privé `match-evidence` ; `replay_url`
    porte un lien externe. Le camp (`team_side`) est déduit de
    l'appelante (capitaine ou manager de cette équipe). Limite de corps 15 Mo. Rate limit : 40/min par IP + 10/min
    par acteur (`discordUserId`). `Idempotency-Key` honoré (réponses 2xx).
  operationId: botAttachMatchEvidence
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.matches/[matchId]/evidence
  responses:
    '201':
      description: Preuve enregistrée.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MatchEvidenceCreateResult'
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      description: |
        Le compte Discord (via `user_discord_links`, tous les comptes du site
        lies) n'est ni capitaine (`teams.captain_id`) ni manager d'equipe
        (`team_members.role = 'manager'`) d'une des deux equipes du match, dans
        le tenant du match — les coachs sont exclus. `code: REPORT_BOTH_SIDES` :
        il tient les DEUX equipes du match (une preuve porte un `team_side`, une seule personne ne la depose pas pour les deux cotes). Meme regle que
        `/api/bot/v1/matches/{matchId}/report` (utils/matches/reportRight.ts).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      $ref: '#/components/responses/NotFound'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
  x-zod-query: bot.matches/[matchId]/evidence.query
