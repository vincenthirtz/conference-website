parameters:
  - $ref: '#/components/parameters/MatchId'
post:
  tags:
    - bot/matches
  summary: Marque une equipe en forfait sur un match (staff admin/owner).
  operationId: botForfeitMatch
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.matches/[matchId]/forfeit
          properties:
            actorDiscordUserId:
              description: Snowflake Discord (user, guild, channel, role).
  responses:
    '200':
      description: Forfait applique.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              matchId:
                $ref: '#/components/schemas/Uuid'
              forfeitTeamId:
                $ref: '#/components/schemas/Uuid'
              winnerTeamId:
                $ref: '#/components/schemas/Uuid'
              team1_score:
                type: [integer, 'null']
              team2_score:
                type: [integer, 'null']
              status:
                type: [string, 'null']
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/ServerError'
  x-zod-query: bot.matches/[matchId]/forfeit.query
