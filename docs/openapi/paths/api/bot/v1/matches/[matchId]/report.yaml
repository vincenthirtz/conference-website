parameters:
  - $ref: '#/components/parameters/MatchId'
post:
  tags:
    - bot/matches
  summary: Capitaine soumet le score final d'un match (resoud dispute si accord).
  operationId: botReportMatchScore
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.matches/[matchId]/report
          properties:
            discordUserId:
              description: Snowflake Discord (user, guild, channel, role).
  responses:
    '200':
      description: |
        Report enregistre. Trois etats possibles :
        - `awaiting_opponent` : un seul report, on attend l'autre cote.
        - `finalized` : match finalise. `resolution` precise la voie —
          `agreed` (les deux reports concordent) ou `auto_resolved`
          (report unilateral emporté sur silence adverse + preuve, avec
          `reason` renseigné).
        - `disputed` : conflit — desaccord des deux capitaines OU report
          unilateral non confirme au-dela du delai SLA (silence adverse
          sans preuve). Le motif est stocké et exposé au staff.
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - matchId
            properties:
              status:
                type: string
                enum:
                  - awaiting_opponent
                  - finalized
                  - disputed
              resolution:
                type: [string, 'null']
                enum:
                  - agreed
                  - auto_resolved
                  - null
                description: |
                  Présent (non null) uniquement quand `status=finalized` :
                  `agreed` si les deux reports concordent, `auto_resolved`
                  si un report unilateral a été appliqué sur silence adverse.
              reason:
                type: [string, 'null']
                description: |
                  Motif de l'auto-resolution, renseigné uniquement quand
                  `resolution=auto_resolved` ; null sinon.
              matchId:
                $ref: '#/components/schemas/Uuid'
              scrimId:
                anyOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              mySide:
                type: integer
                enum:
                  - 1
                  - 2
              opponentSide:
                type: integer
                enum:
                  - 1
                  - 2
              team1Score:
                type: integer
              team2Score:
                type: integer
              winnerTeamId:
                anyOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              myReport:
                type: object
                additionalProperties: true
              opponentReport:
                type: object
                additionalProperties: true
    '400':
      description: |
        Entree invalide, match bye/incomplet, ou `code: INVALID_SCORE_FOR_FORMAT`
        (couple de scores impossible pour le best-of : en BO impair le
        vainqueur a exactement ceil(N/2) manches et le perdant moins ; format
        inconnu = aucune borne). `error` est redige pour etre affiche tel quel
        sur Discord.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: |
        `code` : `MATCH_FINALIZED` (match clos, ou clos pendant le report),
        `MATCH_NOT_STARTED` (coup d'envoi `scheduled_at` pas encore passe et
        match pas `ongoing`), `FINALIZATION_IN_PROGRESS` (l'autre capitaine
        finalise le meme score au meme instant — reessayer),
        `DISPUTE_UNDER_STAFF_REVIEW` (dispute ouverte par le staff : l'accord
        des capitaines ne la referme pas ; le report est enregistre et seul le
        staff tranche). `error` est redige pour etre affiche tel quel sur
        Discord.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      $ref: '#/components/responses/ServerError'
  x-zod-query: bot.matches/[matchId]/report.query
