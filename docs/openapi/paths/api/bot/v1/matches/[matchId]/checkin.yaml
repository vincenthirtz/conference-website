parameters:
  - $ref: '#/components/parameters/MatchId'
post:
  tags:
    - bot/matches
  summary: Valide le check-in d'une equipe (capitaine, coach ou manager) via Discord.
  operationId: botMatchCheckin
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.matches/[matchId]/checkin
          properties:
            discordUserId:
              description: Snowflake Discord (user, guild, channel, role).
  responses:
    '200':
      description: Check-in effectue (ou deja effectue).
      content:
        application/json: {}
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '500':
      $ref: '#/components/responses/ServerError'
  x-zod-query: bot.matches/[matchId]/checkin.query
