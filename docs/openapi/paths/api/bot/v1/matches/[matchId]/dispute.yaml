parameters:
  - $ref: '#/components/parameters/MatchId'
get:
  tags:
    - bot/matches
  summary: Vue capitaine / manager d'une dispute en cours sur un de ses matches.
  operationId: botGetMatchDispute
  parameters:
    - name: actorDiscordUserId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/DiscordId'
  responses:
    '200':
      description: Etat de la dispute filtre pour la capitaine ou la manager.
      content:
        application/json:
          schema:
            type: object
            required:
              - matchId
              - status
              - reports
            properties:
              matchId:
                $ref: '#/components/schemas/Uuid'
              status:
                type: string
              openedAt:
                anyOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
              reports:
                type: array
                items:
                  type: object
                  properties:
                    teamId:
                      $ref: '#/components/schemas/Uuid'
                    teamName:
                      type: [string, 'null']
                    submittedBy:
                      type: [string, 'null']
                    scoreA:
                      type: integer
                    scoreB:
                      type: integer
                    submittedAt:
                      anyOf:
                        - $ref: '#/components/schemas/Timestamp'
                        - type: 'null'
              staffNote:
                type: [string, 'null']
              resolution:
                type: [object, 'null']
                properties:
                  resolvedAt:
                    $ref: '#/components/schemas/Timestamp'
                  decidedScoreA:
                    type: [integer, 'null']
                  decidedScoreB:
                    type: [integer, 'null']
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      description: |
        Compte Discord non lie au site, ou :
        Le compte Discord (via `user_discord_links`, tous les comptes du site
        lies) n'est ni capitaine (`teams.captain_id`) ni manager d'equipe
        (`team_members.role = 'manager'`) d'une des deux equipes du match, dans
        le tenant du match — les coachs sont exclus. `code: REPORT_BOTH_SIDES` :
        il tient les DEUX equipes du match (le litige se suit depuis chaque equipe separement). Meme regle que
        `/api/bot/v1/matches/{matchId}/report` (utils/matches/reportRight.ts).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/ServerError'
