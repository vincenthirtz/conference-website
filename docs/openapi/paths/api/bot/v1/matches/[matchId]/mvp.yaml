parameters:
  - $ref: '#/components/parameters/MatchId'
get:
  tags:
    - bot/matches
  summary: Candidates et etat du vote MVP d'un match.
  description: >-
    Sert au bot a (re)poster le message de vote : la liste des titulaires des
    deux equipes, et l'etat du vote s'il a deja ete ouvert.
  operationId: botGetMatchMvp
  responses:
    '200':
      description: Match trouve.
      content:
        application/json:
          schema:
            type: object
            required:
              - matchId
              - candidates
            properties:
              matchId:
                $ref: '#/components/schemas/Uuid'
              status:
                type: string
              roundName:
                type: [string, 'null']
              candidates:
                type: array
                items:
                  type: object
                  properties:
                    memberId:
                      $ref: '#/components/schemas/Uuid'
                    teamId:
                      $ref: '#/components/schemas/Uuid'
                    teamName:
                      type: [string, 'null']
                    battleTag:
                      type: [string, 'null']
                    displayName:
                      type: [string, 'null']
                    label:
                      type: string
              poll:
                type: ['object', 'null']
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/ServerError'
  x-zod-query: bot.matches/[matchId]/mvp.query
post:
  tags:
    - bot/matches
  summary: Ouvre le vote MVP, encaisse une voix, ou clot et depouille.
  description: >-
    Trois actions sur la meme route. `open` fige les candidates et ancre le
    message poste par le bot ; `vote` enregistre une voix (une par personne, la
    derniere compte) ; `close` ferme le vote et desige la gagnante. Le
    depouillement fait passer les voix Twitch devant les voix Discord quand le
    chat du live a vote.
  operationId: botPostMatchMvp
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.matches/[matchId]/mvp
  responses:
    '200':
      description: Action effectuee.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              poll:
                type: ['object', 'null']
              candidates:
                type: array
                items:
                  type: object
              votable:
                type: boolean
              match:
                type: ['object', 'null']
              memberId:
                anyOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              changed:
                type: boolean
              award:
                type: ['object', 'null']
              winnerLabel:
                type: [string, 'null']
              reason:
                type: [string, 'null']
              tallies:
                type: object
              channelId:
                type: [string, 'null']
              messageId:
                type: [string, 'null']
              team1Name:
                description: >-
                  Equipes du match, rendues a la cloture. Le bot les nomme dans
                  ses deux messages (edition du post de vote, annonce de la
                  gagnante) et ne les obtient autrement que par la liste des
                  votes echus — ou une cloture demandee ne figure pas.
                type: [string, 'null']
              team2Name:
                type: [string, 'null']
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      description: Vote clos, match non termine, ou candidate invalide.
    '500':
      $ref: '#/components/responses/ServerError'
  # PAS de `x-zod` au niveau de l'opération : l'assembleur remplace ce nœud
  # par le JSON Schema là où il le trouve, donc ici il déversait
  # `type`/`properties`/`required` dans `post` lui-même. Le corps se déclare
  # dans `requestBody` (ci-dessus), et nulle part ailleurs.
  x-zod-query: bot.matches/[matchId]/mvp.query
