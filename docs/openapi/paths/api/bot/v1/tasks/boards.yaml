get:
  tags:
    - bot/tasks
  summary: Boards Kanban non archives (id, name) pour autocomplete /kanban.
  operationId: botListTaskBoards
  parameters:
    - name: actorDiscordUserId
      in: query
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Boards (id, name).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "429":
      $ref: "#/components/responses/RateLimited"
