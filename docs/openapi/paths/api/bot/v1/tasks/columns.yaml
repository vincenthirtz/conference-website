get:
  tags:
    - bot/tasks
  summary: Colonnes d'un board (id, name, isDone) pour autocomplete /kanban.
  operationId: botListTaskColumns
  parameters:
    - name: actorDiscordUserId
      in: query
      required: true
      schema:
        type: string
    - name: boardId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Colonnes (id, name, isDone).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
