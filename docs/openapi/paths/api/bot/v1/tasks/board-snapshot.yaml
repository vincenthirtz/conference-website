get:
  tags:
    - bot/tasks
  summary: Etat complet d'un board pour la vue live du bot (LECTURE SEULE, sans
    acteur staff).
  description: |
    Snapshot COMPLET d'un board Kanban pour le rendu « live » dans Discord,
    rafraîchi sur l'event `task.board_changed`. N'exige PAS d'acteur staff
    (`requireBotStaff`) : lecture seule scopée au tenant de la clé bot.
    Colonnes triées par position ; cartes non supprimées triées par position ;
    `assigneeName` résolu (null si non assigné) ; `checklist` = compteur
    done/total des items ; `dueDate` = date ISO ou null ; `labels` = noms
    portés par la carte (ordre préservé) enrichis de leur couleur
    (`color` null si le nom n'a pas de définition de label sur le board).
  operationId: botTaskBoardSnapshot
  parameters:
    - name: boardId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Snapshot du board.
      content:
        application/json:
          schema:
            type: object
            required: [board]
            properties:
              board:
                type: object
                required: [id, name, columns]
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  columns:
                    type: array
                    items:
                      type: object
                      required: [name, isDone, cards]
                      properties:
                        name: {type: string}
                        isDone: {type: boolean}
                        cards:
                          type: array
                          items:
                            type: object
                            required: [title, priority, assigneeName, dueDate, checklist, labels]
                            properties:
                              title: {type: string}
                              priority: {type: string, enum: [low, medium, high, urgent]}
                              assigneeName: {type: [string, 'null']}
                              dueDate: {type: [string, 'null']}
                              checklist:
                                type: object
                                required: [done, total]
                                properties:
                                  done: {type: integer}
                                  total: {type: integer}
                              labels:
                                type: array
                                description: >-
                                  Labels portes par la carte (noms de
                                  tasks.labels[], ordre preserve), chacun
                                  enrichi de sa couleur via task_labels. color
                                  null si le nom n'a pas de definition de label
                                  sur le board.
                                items:
                                  type: object
                                  required: [name, color]
                                  properties:
                                    name: {type: string}
                                    color: {type: [string, 'null']}
    '400':
      description: boardId absent ou invalide (INVALID_QUERY).
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      description: Board introuvable dans le tenant (code board_not_found).
