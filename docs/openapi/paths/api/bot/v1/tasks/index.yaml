get:
  tags:
    - bot/tasks
  summary: Liste des cartes Kanban (filtres boardId, columnId, assignee=me, q, limit).
  operationId: botListTasks
  parameters:
    - name: actorDiscordUserId
      in: query
      required: true
      schema:
        type: string
    - name: boardId
      in: query
      schema:
        type: string
        format: uuid
    - name: columnId
      in: query
      schema:
        type: string
        format: uuid
    - name: assignee
      in: query
      schema:
        type: string
        enum: [me]
    - name: q
      in: query
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    '200':
      description: Cartes normalisees (id, title, boardName, columnName, priority,
        assigneeName, dueDate).
      content:
        application/json:
          schema:
            type: object
            properties:
              tasks:
                type: array
                items:
                  type: object
                  additionalProperties: true
post:
  tags:
    - bot/tasks
  summary: Cree une carte Kanban (createTaskCore). Emet task.created +
    task.board_changed.
  operationId: botCreateTask
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [actorDiscordUserId, boardId, columnId, title]
          properties:
            actorDiscordUserId: {type: string}
            boardId: {type: string, format: uuid}
            columnId: {type: string, format: uuid}
            title: {type: string}
            description: {type: string}
            priority: {type: string, enum: [low, medium, high, urgent]}
            assigneeStaffId: {type: [string, 'null'], format: uuid}
            dueDate: {type: string}
            labels:
              type: array
              items: {type: string}
  responses:
    '201':
      description: Carte creee.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
