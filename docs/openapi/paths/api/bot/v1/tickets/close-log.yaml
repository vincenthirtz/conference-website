post:
  tags:
    - bot/tickets
  summary: Archive la fermeture d'un ticket Discord dans staff_logs.
  description: >-
    Le bot Discord pousse ici un enregistrement d'audit a la fermeture d'un
    ticket. Le site l'archive dans staff_logs (action ticket_closed, via
    discord_bot, visible dans /admin/logs). Le closer (closedByDiscordId) est
    resolu vers son compte site via user_discord_links (table globale) ;
    l'auth_user_id lie devient le staff_id du log. Si le compte n'est pas lie,
    aucune row n'est ecrite (logged: false). L'echec d'insertion n'est jamais
    propage (audit best-effort).
  operationId: botTicketCloseLog
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.tickets/close-log
          properties:
            closedByDiscordId:
              description: Snowflake Discord (user, guild, channel, role).
            number:
              description: Numero du ticket (devient entity_id du log).
            openerDiscordId:
              description: Snowflake Discord (user, guild, channel, role).
            claimedByDiscordId:
              description: Snowflake du staff ayant pris le ticket (optionnel).
            messageCount:
              description: Nombre de messages dans le ticket (optionnel).
            channelName:
              description: Nom du salon du ticket (optionnel).
  responses:
    '200':
      description: Enregistrement traite.
      content:
        application/json:
          schema:
            type: object
            required:
              - logged
            properties:
              logged:
                type: boolean
                description: >-
                  true si une row staff_logs a ete ecrite (closer lie au site),
                  false si le closer n'est pas lie.
    '400':
      $ref: '#/components/responses/BadRequest'
