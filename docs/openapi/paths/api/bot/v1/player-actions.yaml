get:
  tags:
    - bot/players
  summary: Liste cross-player des actions joueurs recentes (audit support).
  operationId: botListPlayerActions
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: action
      in: query
      schema:
        type: string
  responses:
    '200':
      description: Liste paginate.
      content:
        application/json:
          schema:
            type: object
            properties:
              actions:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerAction'
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "429":
      $ref: "#/components/responses/RateLimited"
