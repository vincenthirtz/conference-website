get:
  tags:
    - bot/autocomplete
  summary: Autocomplete des cast members par substring sur le nom.
  operationId: botAutocompleteCastMembers
  parameters:
    - name: q
      in: query
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 25
  responses:
    '200':
      description: Resultats autocomplete.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AutocompleteResult'
