get:
  tags:
    - bot/misc
  summary: Audit log des actions staff (filtres limit, action, entityType).
  operationId: botListStaffLogs
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: action
      in: query
      schema:
        type: string
    - name: entityType
      in: query
      schema:
        type: string
  responses:
    '200':
      description: Liste des entrees staff_logs.
      content:
        application/json: {}
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "429":
      $ref: "#/components/responses/RateLimited"
