get:
  tags:
    - bot/misc
  summary: Leaderboard des equipes (wins/losses/score).
  operationId: botGetTeamLeaderboard
  parameters:
    - name: tournamentId
      in: query
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    '200':
      description: Leaderboard.
      content:
        application/json:
          schema:
            type: object
            properties:
              leaderboard:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "429":
      $ref: "#/components/responses/RateLimited"
