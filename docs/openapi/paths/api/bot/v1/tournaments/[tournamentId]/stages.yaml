parameters:
  - $ref: '#/components/parameters/TournamentId'
post:
  tags:
    - bot/tournaments
  summary: Cree une phase dans un tournoi (staff admin/owner).
  operationId: botCreateTournamentStage
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.tournaments/[tournamentId]/stages
          properties:
            actorDiscordUserId:
              description: Snowflake Discord (user, guild, channel, role).
  responses:
    '201':
      description: Phase creee.
      content:
        application/json:
          schema:
            type: object
            properties:
              stage:
                $ref: '#/components/schemas/Stage'
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      $ref: '#/components/responses/Forbidden'
  x-zod-query: bot.tournaments/[tournamentId]/stages.query
