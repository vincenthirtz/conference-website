parameters:
  - $ref: '#/components/parameters/TeamId'
patch:
  tags:
    - bot/teams
  summary: Persiste les IDs Discord (role, channel, voice channel) d'une equipe.
  operationId: botUpdateTeamDiscordIds
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.teams/[teamId]/discord
          properties:
            actorDiscordUserId:
              description: Snowflake Discord (user, guild, channel, role).
  responses:
    '200':
      description: IDs persistes.
      content:
        application/json: {}
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
  x-zod-query: bot.teams/[teamId]/discord.query
