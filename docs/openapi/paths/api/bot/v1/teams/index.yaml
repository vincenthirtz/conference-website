get:
  tags:
    - bot/teams
  summary: Liste les equipes (filtres search, isActive, isJoinable, country).
  operationId: botListTeams
  parameters:
    - name: search
      in: query
      schema:
        type: string
    - name: country
      in: query
      schema:
        type: string
    - name: isActive
      in: query
      schema:
        type: boolean
    - name: isJoinable
      in: query
      schema:
        type: boolean
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: offset
      in: query
      schema:
        type: integer
        minimum: 0
  responses:
    '200':
      description: Liste des equipes.
      content:
        application/json:
          schema:
            type: object
            required:
              - teams
            properties:
              teams:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "429":
      $ref: "#/components/responses/RateLimited"
  x-zod-query: bot.teams/index.query
post:
  tags:
    - bot/teams
  summary: Cree une equipe avec le capitaine donne.
  operationId: botCreateTeam
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.teams/index
          properties:
            captainDiscordUserId:
              description: Snowflake Discord (user, guild, channel, role).
  responses:
    '201':
      description: Equipe creee.
      content:
        application/json:
          schema:
            type: object
            properties:
              team:
                $ref: '#/components/schemas/Team'
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
    '409':
      $ref: '#/components/responses/Conflict'
    '500':
      $ref: '#/components/responses/ServerError'
  x-zod-query: bot.teams/index.query
