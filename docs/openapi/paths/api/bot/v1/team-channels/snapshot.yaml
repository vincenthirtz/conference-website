post:
  tags:
    - bot/misc
  summary: Le bot depose l'etat Discord observe pour un lot d'equipes.
  description: >-
    Seul le bot voit le guild. Le site ne connait que des ids stockes, qui
    peuvent pointer sur un salon supprime — d'ou cette photo, datee, qui
    alimente l'ecran /admin/discord/team-channels.

    Upsert par equipe (pas de purge) : le bot peut rafraichir UNE equipe apres
    une action sans reposter tout le guild. `access` dit qui entre et PAR QUEL
    CHEMIN (role d'equipe / permission individuelle sur le salon texte / sur le
    vocal) — la distinction sert a retirer quelqu'un au bon endroit.
  operationId: botPostTeamChannelsSnapshot
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - teams
          properties:
            teams:
              type: array
              maxItems: 500
              items:
                type: object
                required:
                  - teamId
                  - roleExists
                  - textChannelExists
                  - voiceChannelExists
                properties:
                  teamId:
                    type: string
                    format: uuid
                  roleId:
                    type: [string, 'null']
                  roleName:
                    type: [string, 'null']
                  roleExists:
                    type: boolean
                  textChannelId:
                    type: [string, 'null']
                  textChannelName:
                    type: [string, 'null']
                  textChannelExists:
                    type: boolean
                  voiceChannelId:
                    type: [string, 'null']
                  voiceChannelName:
                    type: [string, 'null']
                  voiceChannelExists:
                    type: boolean
                  access:
                    type: array
                    items:
                      type: object
                      properties:
                        discordUserId:
                          type: string
                        username:
                          type: [string, 'null']
                        source:
                          type: string
                          enum: [role, text, voice]
                  warnings:
                    type: array
                    items:
                      type: string
  responses:
    '200':
      description: Photo enregistree.
      content:
        application/json:
          schema:
            type: object
            properties:
              count:
                type: integer
              capturedAt:
                type: string
                format: date-time
