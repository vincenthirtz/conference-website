get:
  tags:
    - bot/cast
  summary: Liste les cast assignments a venir (filtres tournament, castMember, hours).
  operationId: botListCastAssignments
  parameters:
    - name: tournament
      in: query
      schema:
        type: string
        format: uuid
    - name: castMemberId
      in: query
      schema:
        type: string
        format: uuid
    - name: hours
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 720
        default: 48
    - name: includePast
      in: query
      schema:
        type: boolean
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    '200':
      description: Liste des assignments.
      content:
        application/json:
          schema:
            type: object
            properties:
              assignments:
                type: array
                items:
                  $ref: '#/components/schemas/CastAssignment'
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "429":
      $ref: "#/components/responses/RateLimited"
