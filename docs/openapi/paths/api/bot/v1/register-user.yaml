post:
  tags:
    - bot/players
  summary: Cree un compte site avec le Discord ID deja lie (welcome email).
  operationId: botRegisterUser
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.register-user
          properties:
            discordUserId:
              description: Snowflake Discord (user, guild, channel, role).
            discordUsername:
              type: string
            displayName:
              type: string
  responses:
    '201':
      description: Compte cree.
      content:
        application/json: {}
    '400':
      $ref: '#/components/responses/BadRequest'
    '409':
      $ref: '#/components/responses/Conflict'
    '500':
      $ref: '#/components/responses/ServerError'
