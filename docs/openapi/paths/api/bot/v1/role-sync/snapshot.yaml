get:
  tags:
    - bot/misc
  summary: Snapshot complet user_discord_links -> roles attendus (sync Discord roles).
  description: >-
    Chaque user porte `teams[]` (TOUTES ses equipes : une manager peut en
    encadrer plusieurs, le bot doit alors poser les deux roles Discord) et
    `team` (appartenance principale, conservee pour la compat descendante).
  operationId: botGetRoleSyncSnapshot
  responses:
    '200':
      description: Snapshot des roles.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "401":
      $ref: "#/components/responses/Unauthorized"
    "429":
      $ref: "#/components/responses/RateLimited"
