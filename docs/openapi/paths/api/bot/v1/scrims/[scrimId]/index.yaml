parameters:
  - $ref: '#/components/parameters/ScrimId'
get:
  tags:
    - bot/scrims
  summary: Lit un scrim (par UUID ou slug) + ses matchs.
  operationId: botGetScrim
  responses:
    '200':
      description: Scrim trouve.
      content:
        application/json:
          schema:
            type: object
            properties:
              scrim:
                $ref: '#/components/schemas/Scrim'
              matches:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
    '404':
      $ref: '#/components/responses/NotFound'
patch:
  tags:
    - bot/scrims
  summary: Met a jour un scrim (staff admin/owner).
  operationId: botUpdateScrim
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.scrims/[scrimId]/index
          properties:
            actorDiscordUserId:
              description: Snowflake Discord (user, guild, channel, role).
  responses:
    '200':
      description: Scrim mis a jour.
      content:
        application/json:
          schema:
            type: object
            properties:
              scrim:
                $ref: '#/components/schemas/Scrim'
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
