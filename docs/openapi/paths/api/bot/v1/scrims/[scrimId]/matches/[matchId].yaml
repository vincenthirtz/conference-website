parameters:
  - $ref: '#/components/parameters/ScrimId'
  - $ref: '#/components/parameters/MatchId'
patch:
  tags:
    - bot/scrims
  summary: Met a jour un match de scrim (score, status, etc.).
  description: |
    Rouvrir un match clos ou en litige (`finished`/`walkover`/`cancelled`/
    `disputed` → `pending`/`ongoing`/`postponed`) purge d'abord les reports de
    score des capitaines (trace `purged_reports` dans staff_logs), meme si le
    PATCH pose aussi un score. Echec de purge → 500, match inchange.
  operationId: botUpdateScrimMatch
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          x-zod: bot.scrims/[scrimId]/matches/[matchId]
          properties:
            actorDiscordUserId:
              description: Snowflake Discord (user, guild, channel, role).
  responses:
    '200':
      description: Match mis a jour.
      content:
        application/json: {}
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
  x-zod-query: bot.scrims/[scrimId]/matches/[matchId].query
