parameters:
  - $ref: '#/components/parameters/ScrimId'
  - $ref: '#/components/parameters/MatchId'
patch:
  tags:
    - bot/scrims
  summary: Met a jour un match de scrim (score, status, etc.).
  operationId: botUpdateScrimMatch
  parameters:
    - $ref: '#/components/parameters/IdempotencyKey'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - actorDiscordUserId
          properties:
            actorDiscordUserId:
              $ref: '#/components/schemas/DiscordId'
            team1_score:
              type: integer
              minimum: 0
            team2_score:
              type: integer
              minimum: 0
            winner_team_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            forfeit_team_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            status:
              type: string
            best_of:
              type: integer
            match_format:
              type: string
            stream_url:
              type: [string, 'null']
            replay_url:
              type: [string, 'null']
            lobby_code:
              type: [string, 'null']
            notes:
              type: [string, 'null']
            scheduled_at:
              oneOf:
                - type: string
                  format: date-time
                - type: 'null'
            started_at:
              oneOf:
                - type: string
                  format: date-time
                - type: 'null'
            completed_at:
              oneOf:
                - type: string
                  format: date-time
                - type: 'null'
  responses:
    '200':
      description: Match mis a jour.
      content:
        application/json:
          schema:
            type: object
            properties:
              match:
                $ref: '#/components/schemas/Match'
    '400':
      $ref: '#/components/responses/BadRequest'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
