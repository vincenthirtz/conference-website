get:
  summary: Discord return after a per-tenant bot install.
  description: |
    PUBLIC by URL, but inert without a valid signed `state` — that signature
    is the only proof the return comes from a link we issued. Attaches the
    guild to the tenant carried by the state, using the same rules as the
    admin attach endpoint (`utils/tenants/attachGuild.ts`), then REDIRECTS to
    the tenant page with a readable flag (`linked`, `already_linked`,
    `cancelled`, `invalid_state`, `failed`). A browser return deserves a
    page, not raw JSON.
  operationId: onboardDiscordCallback
  tags:
    - public
  security: []
  responses:
    '302':
      description: Redirect to the tenant page with a status flag.
    '405':
      description: Method not allowed.
