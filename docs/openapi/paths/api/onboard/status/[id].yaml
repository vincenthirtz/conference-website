get:
  tags:
    - public/onboard
  summary: Polling de l'etat d'une tenant_request (UI d'attente bot-invite).
  operationId: getOnboardRequestStatus
  security: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Etat de la demande + URL d'invitation bot.
      content:
        application/json: {}
    '401':
      $ref: '#/components/responses/Unauthorized'
    '404':
      $ref: '#/components/responses/NotFound'
