parameters:
  - in: path
    name: userId
    required: true
    schema:
      type: string
get:
  summary: Profil complet d'un joueur (rating, courbe, matches récents, H2H).
  operationId: getPlayerProfile
  tags:
    - public/players
  security: []
  responses:
    '200':
      description: Profil joueur.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlayerProfileResponse'
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/ServerError'
