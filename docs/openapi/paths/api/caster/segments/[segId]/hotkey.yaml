parameters:
  - $ref: '#/components/parameters/SegId'
post:
  tags:
    - public/caster
  summary: Hotkey caster sur un segment (advance, mark done, etc.).
  operationId: triggerSegmentHotkey
  security:
    - StaffSession: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            hotkey:
              type: string
  responses:
    '200':
      description: Action appliquee.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
