parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: "[v1] Maps activées d'un tournoi (app caster)."
  description: Route canonique. Lecture publique tenant-scopée (`x-tenant-id`).
  operationId: casterV1ListTournamentMaps
  tags:
    - public
  security: []
  parameters:
    - $ref: '#/components/parameters/XTenantId'
  responses:
    '200':
      description: Liste des maps activées.
      content:
        application/json:
          schema:
            type: object
            required:
              - maps
            properties:
              maps:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/Uuid'
                    map_name:
                      type: string
                    map_type:
                      type: [string, 'null']
                    image_url:
                      type: [string, 'null']
    '400':
      $ref: '#/components/responses/BadRequest'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
