parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
get:
  summary: "[v1] Maps activées d'un tournoi (app caster)."
  description: Route canonique. Lecture publique tenant-scopée (`x-tenant-id`).
  operationId: casterV1ListTournamentMaps
  tags:
    - public
  security: []
  parameters:
    - $ref: '#/components/parameters/XTenantId'
    - name: date
      in: query
      required: false
      description: >-
        Date de jeu `YYYY-MM-DD` (Europe/Paris). Pool de cette date s'il
        existe ; prioritaire sur `round`. 400 si invalide.
      schema:
        type: string
        format: date
    - name: round
      in: query
      required: false
      description: >-
        Journée (`matches.round_number`). Pool de cette journée s'il existe.
        Sans pool propre (ou sans paramètre) : pool par défaut du tournoi.
      schema:
        type: integer
  responses:
    '200':
      description: Liste des maps activées.
      content:
        application/json:
          schema:
            type: object
            required:
              - maps
            properties:
              maps:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/Uuid'
                    map_name:
                      type: string
                    map_type:
                      type: [string, 'null']
                    image_url:
                      type: [string, 'null']
              round:
                type: [integer, 'null']
              date:
                type: [string, 'null']
                format: date
              source:
                type: string
                enum: [date, round, tournament]
    '400':
      $ref: '#/components/responses/BadRequest'
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
