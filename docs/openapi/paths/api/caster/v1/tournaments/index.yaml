get:
  summary: "[v1] Liste publique des tournois pour l'app caster (Electron)."
  description: |
    Route canonique versionnée. Lecture publique tenant-scopée
    (`x-tenant-id`) via `supabaseAdmin`. Statuts retenus : `running`,
    `published`. Voir `docs/CASTER_API_CONTRACT.md`.
  operationId: casterV1ListTournaments
  tags:
    - public
  security: []
  parameters:
    - $ref: '#/components/parameters/XTenantId'
  responses:
    '200':
      description: Liste de tournois.
      content:
        application/json:
          schema:
            type: object
            required:
              - tournaments
            properties:
              tournaments:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/Uuid'
                    name:
                      type: string
                    slug:
                      type: string
                    game:
                      type: string
                    status:
                      type: string
                    start_date:
                      anyOf:
                        - $ref: '#/components/schemas/Timestamp'
                        - type: 'null'
                    format_type:
                      type: [string, 'null']
    '429':
      $ref: '#/components/responses/RateLimited'
    '500':
      $ref: '#/components/responses/ServerError'
