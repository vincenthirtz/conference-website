post:
  tags:
    - public/auth
  summary: Envoie un email de reset de mot de passe (template Brevo brande).
  operationId: requestPasswordReset
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
            redirectPath:
              type: string
              enum:
                - /admin/reset-password
  responses:
    '200':
      description: Reponse generique (anti-enumeration).
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              message:
                type: string
    '429':
      $ref: '#/components/responses/RateLimited'
