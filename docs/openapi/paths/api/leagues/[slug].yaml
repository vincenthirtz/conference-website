parameters:
  - in: path
    name: slug
    required: true
    schema:
      type: string
get:
  summary: Détail public d'une league (standings + tournois liés).
  operationId: getPublicLeagueBySlug
  tags:
    - public/leagues
  security: []
  responses:
    '200':
      description: Détail league.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LeagueDetailResponse'
    '400':
      $ref: '#/components/responses/BadRequest'
    '404':
      $ref: '#/components/responses/NotFound'
    '500':
      $ref: '#/components/responses/ServerError'
