get:
  tags:
    - public/tournaments
  summary: Stats agregees des maps pour un tournoi (winrate par map, vetos).
  operationId: getMapsStats
  security: []
  parameters:
    - name: tournamentId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    '200':
      description: Stats par map + veto info.
      content:
        application/json: {}
    '500':
      $ref: '#/components/responses/ServerError'
    "400":
      $ref: "#/components/responses/BadRequest"
    "429":
      $ref: "#/components/responses/RateLimited"
