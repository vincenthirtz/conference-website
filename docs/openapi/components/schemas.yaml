Error:
  type: object
  required:
    - error
  properties:
    error:
      type: string
      description: Message lisible côté client.
    code:
      type: string
      description: Code machine (ex. `MISSING_TENANT_ID`, `UNKNOWN_TENANT`).
    details:
      type: object
      additionalProperties: true
  example:
    error: Invalid or missing API key.
    code: MISSING_TENANT_ID
Ok:
  type: object
  required:
    - ok
  properties:
    ok:
      type: boolean
      enum:
        - true
TcgTradeSubject:
  description: |
    Un SUJET de carte TCG dans une proposition d'echange : joueuse ou equipe
    par UUID, map par slug du registre. Jamais un exemplaire, jamais une
    image : l'exemplaire est choisi par la base, la face relue a l'affichage.
  oneOf:
    - type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [player, team]
        id:
          type: string
          format: uuid
    - type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [map]
        id:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
Uuid:
  type: string
  format: uuid
Timestamp:
  type: string
  format: date-time
TcgSetCompletedNotice:
  type: object
  description: >-
    Une serie TCG dont la recompense vient d'etre ecrite par l'appel en cours.
    Faits bruts (l'interface formule le libelle) ; aucun nom de joueuse.
  properties:
    key:
      type: string
    kind:
      type: string
      enum: [map_mode, tournament_teams, team_roster]
    mode:
      type: [string, 'null']
    tournamentName:
      type: [string, 'null']
    teamName:
      type: [string, 'null']
    coins:
      type: integer
TcgShowcaseState:
  type: object
  description: >-
    Etat de la vitrine TCG d'une joueuse. `cards` = cartes ENCORE possedees
    parmi celles choisies, dans l'ordre choisi, faces filtrees par le
    consentement ; `unavailable` = cartes choisies qui ne le sont plus.
  properties:
    enabled:
      type: boolean
    cards:
      type: array
      items:
        type: object
        properties:
          key:
            type: string
            description: '`player:<uuid>`, `team:<uuid>` ou `map:<slug>`.'
          kind:
            type: string
            enum: [player, team, map]
          userId:
            type: string
          teamId:
            type: string
          slug:
            type: [string, 'null']
          displayName:
            type: [string, 'null']
          name:
            type: [string, 'null']
          imageUrl:
            type: [string, 'null']
          logoUrl:
            type: [string, 'null']
          cardImageUrl:
            type: [string, 'null']
          rarity:
            type: string
            enum: [common, rare, epic, legendary]
            description: Meilleure rarete ENCORE possedee pour ce sujet.
          isFoil:
            type: boolean
    unavailable:
      type: integer
    maxCards:
      type: integer
    publicProfileUrl:
      type: [string, 'null']
PlayerTwitchStatus:
  type: object
  description: >-
    Etat du rattachement Twitch d'une joueuse. `twitchLogin` est un pseudo
    d'AFFICHAGE : Twitch autorise le renommage, donc rien ne s'y appuie pour
    decider d'un gain — c'est `twitch_user_id`, jamais rendu ici, qui fait foi.
  required:
    - configured
    - linked
  properties:
    configured:
      type: boolean
      description: >-
        False quand la fonctionnalite est dormante. L'ecran masque alors le
        bouton plutot que de proposer un chemin qui finirait en 503.
    linked:
      type: boolean
    twitchLogin:
      type: [string, 'null']
    linkedAt:
      type: [string, 'null']
      format: date-time
TcgOverlayTokenState:
  type: object
  description: >-
    Le lien de la source navigateur OBS du TCG. `url` est un SECRET PORTEUR :
    quiconque l'a voit les annonces. Il n'y en a qu'un actif par espace —
    emettre revoque le precedent.
  required:
    - url
  properties:
    url:
      type: [string, 'null']
      description: URL complete a coller dans OBS, ou `null` si aucun lien actif.
    createdAt:
      type: [string, 'null']
      format: date-time
    lastUsedAt:
      type: [string, 'null']
      format: date-time
      description: >-
        Dernier appel de l'overlay. Permet de constater qu'un lien oublie sert
        encore, donc de le revoquer en connaissance de cause.
PlayerHeroPreferences:
  type: object
  description: >-
    Héros préférés et évités d'une joueuse. Listes GLOBALES au compte : une
    joueuse les conserve en changeant d'équipe. Deux listes vides sont un état
    normal, pas une absence de données. `slots` est rendu par l'API pour que
    l'interface borne ses emplacements sans recopier le nombre — la contrainte
    SQL, elle, écrit `3` en dur (du SQL ne peut pas importer une constante
    TypeScript), donc les deux ne bougent qu'ensemble, par migration.
  required:
    - picks
    - bans
    - slots
  properties:
    picks:
      type: array
      maxItems: 3
      items:
        type: string
      description: >-
        Ordre de préférence décroissant. Le premier est celui qui représentera
        la joueuse sur sa carte à collectionner faute de photo.
    bans:
      type: array
      maxItems: 3
      items:
        type: string
      description: >-
        Jamais proposés, y compris lorsque la recommandation retombe sur le rôle
        de la joueuse.
    slots:
      type: integer
      description: Nombre d'emplacements par liste.
DiscoveryCard:
  type: object
  description: >-
    Carte de découverte GLOBALE (cross-tenant) du joueur courant. Opt-in
    explicite, invisible par défaut. « Absent = défaut » : `discoverable` false,
    `showRatings`/`showTeams` true. `optedInAt` est posé au premier passage
    `discoverable=true` (audit RGPD, jamais effacé ensuite).
  required:
    - discoverable
    - displayName
    - avatarUrl
    - tagline
    - showRatings
    - showTeams
    - optedInAt
  properties:
    discoverable:
      type: boolean
    displayName:
      type: [string, 'null']
    avatarUrl:
      type: [string, 'null']
    tagline:
      type: [string, 'null']
    showRatings:
      type: boolean
    showTeams:
      type: boolean
    optedInAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
DirectoryPlayer:
  type: object
  description: >-
    Carte enrichie d'un joueur découvrable de l'annuaire cross-tenant (recherche
    + listes de suivi). `stats` omises si `showRatings=false`, `teams` omises si
    `showTeams=false`.
  required:
    - authUserId
    - displayName
    - avatarUrl
    - tagline
    - discordUsername
    - isFollowing
    - followerCount
  properties:
    authUserId:
      $ref: '#/components/schemas/Uuid'
    displayName:
      type: string
    avatarUrl:
      type: [string, 'null']
    tagline:
      type: [string, 'null']
    discordUsername:
      type: [string, 'null']
    stats:
      type: object
      required:
        - games
        - peakRating
        - tenants
      properties:
        games:
          type: integer
          description: Somme des parties jouées, tous tenants.
        peakRating:
          type: number
          description: Meilleur rating (max cross-tenant).
        tenants:
          type: integer
          description: Nombre de tenants distincts où le joueur a un rating.
    teams:
      type: array
      items:
        type: object
        required:
          - name
          - slug
        properties:
          name:
            type: string
          slug:
            type: [string, 'null']
    isFollowing:
      type: boolean
      description: True si le caller suit ce joueur.
    followerCount:
      type: integer
      description: Nombre total de followers du joueur.
BattlenetStatus:
  type: object
  description: >-
    Etat de la verification d'identite Battle.net pour le joueur connecte (`GET
    /api/player/battlenet-status`). `configured` reflete la presence des creds
    Blizzard cote serveur (feature dormante si `false`) ; `linked` / `battleTag`
    / `verifiedAt` decrivent le lien du joueur.
  required:
    - configured
    - linked
    - battleTag
    - verifiedAt
  properties:
    configured:
      type: boolean
      description: >-
        True si les creds Blizzard sont presents cote serveur (feature active) ;
        false = feature dormante.
    linked:
      type: boolean
      description: True si le joueur a un BattleTag verifie lie a son profil.
    battleTag:
      type: [string, 'null']
      description: BattleTag verifie (ex. `Player#1234`), ou `null` si non lie.
    verifiedAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
      description: Horodatage de la verification, ou `null` si non lie.
    reward:
      type: [object, 'null']
      description: >-
        Ajout additif (2026-09-15). La recompense TCG de la verification, pour
        que la carte l'annonce sans ecrire de nombre : `coins` vient du registre
        `earnSources.ts`. `null` = recompense non activee (`schemaReady` faux).
        `claimable: false` = deja recue (tous tenants confondus) OU registre
        illisible — une erreur de lecture n'est pas une absence, on ne promet
        pas a l'aveugle.
      required: [coins, claimable]
      properties:
        coins:
          type: integer
          minimum: 1
        claimable:
          type: boolean
PrizeCheckoutRequest:
  type: object
  description: >-
    Corps de `POST /api/helloasso/prize-checkout` (« Profondeur de la
    monétisation », cash-prize crowdfundé). Au moins un de `tournamentId` /
    `prizePoolId` doit être fourni ; si les deux le sont, `prizePoolId` fait
    foi. `contributorName` / `email` / `message` / `isAnonymous` sont capturés
    dans `prize_pool_checkouts` (l'`email` reste privé, jamais réexposé).
    Montant en CENTIMES (cohérent avec le checkout générique, HelloAsso et le
    schéma DB).
  required:
    - amountCents
  properties:
    tournamentId:
      $ref: '#/components/schemas/Uuid'
    prizePoolId:
      $ref: '#/components/schemas/Uuid'
    amountCents:
      type: integer
      minimum: 100
      maximum: 10000000
      description: Montant de la contribution en centimes (1 € à 100 000 €).
    contributorName:
      type: string
      minLength: 1
      maxLength: 100
    email:
      type: string
      format: email
      maxLength: 254
      description: Email privé du contributeur — jamais réexposé publiquement.
    message:
      type: string
      maxLength: 500
    isAnonymous:
      type: boolean
      default: false
PrizeRecentContributor:
  type: object
  description: >-
    Contribution récente exposée publiquement (jauge de cagnotte). N'expose
    JAMAIS l'email ; `name` est `null` pour une contribution anonyme.
  required:
    - name
    - amountCents
    - message
    - createdAt
  properties:
    name:
      type: [string, 'null']
      description: Nom affiché, ou `null` si la contribution est anonyme.
    amountCents:
      type: integer
    message:
      type: [string, 'null']
    createdAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
PrizePoolPublic:
  type: object
  description: >-
    Vue publique de la cagnotte d'un tournoi. Si aucune cagnotte n'existe, même
    forme avec `exists:false`, montants à zéro et `recentContributors:[]`.
  required:
    - exists
    - isOpen
    - currency
    - baseAmountCents
    - raisedAmountCents
    - totalCents
    - goalAmountCents
    - contributorCount
    - recentContributors
  properties:
    exists:
      type: boolean
    isOpen:
      type: boolean
    currency:
      type: string
      description: Code ISO 4217 (ex. `EUR`).
    baseAmountCents:
      type: integer
      description: Dotation de base (fixée par l'orga), en centimes.
    raisedAmountCents:
      type: integer
      description: Total des contributions confirmées, en centimes.
    totalCents:
      type: integer
      description: '`baseAmountCents` + `raisedAmountCents`.'
    goalAmountCents:
      type: [integer, 'null']
      description: Objectif de collecte, ou `null` si non défini.
    contributorCount:
      type: integer
    recentContributors:
      type: array
      items:
        $ref: '#/components/schemas/PrizeRecentContributor'
PrizePoolAdmin:
  type: object
  description: >-
    Configuration complète de la cagnotte (vue organisateur). `total_cents` (=
    `base_amount_cents` + `raised_amount_cents`) n'est présent que dans la
    réponse GET ; les réponses PUT/POST renvoient la row brute (sans
    `total_cents`). `raised_amount_cents` est dénormalisé et géré exclusivement
    par le webhook HelloAsso.
  required:
    - id
    - tournament_id
    - tenant_id
    - title
    - currency
    - goal_amount_cents
    - base_amount_cents
    - raised_amount_cents
    - is_open
    - created_at
    - updated_at
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    tournament_id:
      $ref: '#/components/schemas/Uuid'
    tenant_id:
      $ref: '#/components/schemas/Uuid'
    title:
      type: [string, 'null']
    currency:
      type: string
    goal_amount_cents:
      type: [integer, 'null']
    base_amount_cents:
      type: integer
    raised_amount_cents:
      type: integer
    is_open:
      type: boolean
    total_cents:
      type: integer
      description: Présent uniquement dans la réponse GET.
    created_at:
      $ref: '#/components/schemas/Timestamp'
    updated_at:
      $ref: '#/components/schemas/Timestamp'
PrizeContributionAdmin:
  type: object
  description: >-
    Contribution telle que vue par l'organisateur (inclut les identifiants de
    corrélation HelloAsso). Toujours scopée par tenant. N'inclut pas l'email.
  required:
    - id
    - amount_cents
    - contributor_name
    - is_anonymous
    - message
    - helloasso_payment_id
    - checkout_intent_id
    - created_at
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    amount_cents:
      type: integer
    contributor_name:
      type: [string, 'null']
    is_anonymous:
      type: boolean
    message:
      type: [string, 'null']
    helloasso_payment_id:
      type: [string, 'null']
    checkout_intent_id:
      type: [string, 'null']
    created_at:
      $ref: '#/components/schemas/Timestamp'
PrizePoolUpsertRequest:
  type: object
  description: >-
    Corps de `PUT`/`POST /api/admin/tournaments/{id}/prize-pool`. Tous les
    champs sont optionnels ; seuls ceux fournis sont écrasés.
    `raised_amount_cents` n'est jamais modifiable ici.
  properties:
    title:
      type: [string, 'null']
      maxLength: 200
    goal_amount_cents:
      type: [integer, 'null']
      minimum: 1
    base_amount_cents:
      type: integer
      minimum: 0
    is_open:
      type: boolean
PrizePoolUpsertResponse:
  type: object
  required:
    - pool
  properties:
    pool:
      $ref: '#/components/schemas/PrizePoolAdmin'
PlayerPushSubscription:
  type: object
  required:
    - id
    - endpoint
    - created
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    endpoint:
      type: string
      format: uri
    created:
      type: boolean
      description: "true si la subscription vient d'être créée (201), false si mise à
        jour (200)."
TwitchTokenResponse:
  type: object
  required:
    - access_token
    - refresh_token
    - expires_in
    - token_type
  properties:
    access_token:
      type: string
    refresh_token:
      type: string
    expires_in:
      type: integer
    scope:
      oneOf:
        - type: string
        - type: array
          items:
            type: string
    token_type:
      type: string
DiscordId:
  type: string
  pattern: ^[0-9]{17,20}$
  description: Snowflake Discord (user, guild, channel, role).
MatchEvidenceItem:
  type: object
  description: |
    Une preuve rattachée à un match (capture d'écran, fichier replay, ou
    lien externe). Pour les preuves binaires (`screenshot`, `replay_file`),
    `signedUrl` est une URL signée courte-durée (~10 min) vers l'objet dans
    le bucket privé `match-evidence` — jamais le chemin de stockage brut.
    Pour `replay_url`, `signedUrl` est null et `externalUrl` porte le lien.
  required:
    - id
    - teamSide
    - kind
    - externalUrl
    - signedUrl
    - mimeType
    - sizeBytes
    - sha256
    - note
    - createdAt
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    teamSide:
      type: [integer, 'null']
      enum:
        - 1
        - 2
        - null
      description: |
        Camp du capitaine ayant soumis la preuve (1 ou 2). `null` pour une
        preuve neutre attachée par le staff.
    kind:
      type: string
      enum:
        - screenshot
        - replay_file
        - replay_url
    externalUrl:
      type: [string, 'null']
      format: uri
      description: Lien externe (VOD/replay hébergé) pour `kind=replay_url`, sinon null.
    signedUrl:
      type: [string, 'null']
      format: uri
      description: URL signée ~10 min vers le binaire privé ; null pour `replay_url`.
    mimeType:
      type: [string, 'null']
    sizeBytes:
      type: [integer, 'null']
    sha256:
      type: [string, 'null']
      description: SHA-256 hex du binaire ; null pour `replay_url`.
    note:
      type: [string, 'null']
    createdAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
AdminMatchEvidenceItem:
  description: |
    Item de preuve enrichi pour la vue staff : ajoute l'identité du
    soumetteur (capitaine Discord ou compte auth).
  allOf:
    - $ref: '#/components/schemas/MatchEvidenceItem'
    - type: object
      required:
        - submittedByDiscordUserId
        - submittedByAuthUserId
      properties:
        submittedByDiscordUserId:
          type: [string, 'null']
          description: Discord user id du capitaine soumetteur ; null si preuve staff.
        submittedByAuthUserId:
          anyOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Compte auth du soumetteur (capitaine ou membre staff) ; null
            possible.
MatchEvidenceCreateResult:
  type: object
  required:
    - id
    - kind
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    kind:
      type: string
      enum:
        - screenshot
        - replay_file
        - replay_url
Tenant:
  type: object
  required:
    - id
    - slug
    - name
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    slug:
      type: string
    name:
      type: string
    createdAt:
      $ref: '#/components/schemas/Timestamp'
Team:
  type: object
  required:
    - id
    - name
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    name:
      type: string
    slug:
      type: string
    logoUrl:
      type: [string, 'null']
    captainUserId:
      $ref: '#/components/schemas/Uuid'
    discordRoleId:
      anyOf:
        - $ref: '#/components/schemas/DiscordId'
        - type: 'null'
    discordChannelId:
      anyOf:
        - $ref: '#/components/schemas/DiscordId'
        - type: 'null'
    joinable:
      type: boolean
    tenantId:
      $ref: '#/components/schemas/Uuid'
TeamMember:
  type: object
  required:
    - userId
    - role
  properties:
    userId:
      $ref: '#/components/schemas/Uuid'
    displayName:
      type: string
    battleTag:
      type: [string, 'null']
    discordUserId:
      anyOf:
        - $ref: '#/components/schemas/DiscordId'
        - type: 'null'
    role:
      type: string
      enum:
        - captain
        - member
        - substitute
        - coach
    joinedAt:
      $ref: '#/components/schemas/Timestamp'
Match:
  type: object
  required:
    - id
    - status
    - team1Id
    - team2Id
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    tournamentId:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    scrimId:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    stageId:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    team1Id:
      $ref: '#/components/schemas/Uuid'
    team2Id:
      $ref: '#/components/schemas/Uuid'
    team1Score:
      type: [integer, 'null']
    team2Score:
      type: [integer, 'null']
    winnerTeamId:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    status:
      type: string
      enum:
        - pending
        - scheduled
        - ongoing
        - finished
        - disputed
        - forfeit
        - cancelled
    scheduledAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    lobbyInfo:
      type: [object, 'null']
      properties:
        host:
          type: string
        password:
          type: string
    streamUrl:
      type: [string, 'null']
    discordThreadId:
      anyOf:
        - $ref: '#/components/schemas/DiscordId'
        - type: 'null'
Tournament:
  type: object
  required:
    - id
    - name
    - status
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    name:
      type: string
    slug:
      type: string
    status:
      type: string
      enum:
        - draft
        - published
        - ongoing
        - finished
        - archived
    startsAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    endsAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    prizePoolEur:
      type: [integer, 'null']
Stage:
  type: object
  required:
    - id
    - tournamentId
    - name
    - kind
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    tournamentId:
      $ref: '#/components/schemas/Uuid'
    name:
      type: string
    kind:
      type: string
      enum:
        - group
        - swiss
        - single_elim
        - double_elim
        - round_robin
    order:
      type: integer
Scrim:
  type: object
  required:
    - id
    - status
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    name:
      type: [string, 'null']
    status:
      type: string
      enum:
        - draft
        - open
        - scheduled
        - in_progress
        - finished
        - cancelled
    scheduledAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    teamAId:
      $ref: '#/components/schemas/Uuid'
    teamBId:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
CastAssignment:
  type: object
  required:
    - id
    - matchId
    - casterUserId
    - role
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    matchId:
      $ref: '#/components/schemas/Uuid'
    casterUserId:
      $ref: '#/components/schemas/Uuid'
    casterDisplayName:
      type: string
    role:
      type: string
      enum:
        - play_by_play
        - color
