      type: [string, 'null']
      format: date-time
    tournament_id:
      type: [string, 'null']
      format: uuid
BroadcastWaveResult:
  type: object
  description: |
    Per-campaign result of one wave processed by `processCampaignWave`.
    The success-path shape is whatever `processCampaignWave` returns
    (typically counts of sent/queued/skipped); the failure shape carries
    `campaignId` + `error`.
  properties:
    campaignId:
      type: string
      format: uuid
      description: Campaign whose wave failed (only present on error).
    error:
      type: string
      description: Error message captured during the wave (only on error).
  additionalProperties: true
CronBroadcastResult:
  type: object
  required:
    - success
    - processed
    - results
  properties:
    success:
      type: boolean
      enum:
        - true
    processed:
      type: integer
      minimum: 0
      description: Number of `broadcast_schedules` rows examined this tick.
    results:
      type: array
      description: One entry per scheduled campaign (success or error).
      items:
        $ref: '#/components/schemas/BroadcastWaveResult'
CronEmailDigestResult:
  type: object
  required:
    - success
    - candidates
    - emailsSent
    - recipients
    - skipped
  description: |
    Summary returned by `runEmailDispatcher()`. `candidates` = outbox events
    examined this run, `emailsSent` = digest emails actually sent,
    `recipients` = distinct users emailed, `skipped` = (event,user) pairs
    deduped / dropped (already delivered, no email, no opt-in, etc.).
  properties:
    success:
      type: boolean
      enum:
        - true
    candidates:
      type: integer
      minimum: 0
    emailsSent:
      type: integer
      minimum: 0
    recipients:
      type: integer
      minimum: 0
    skipped:
      type: integer
      minimum: 0
CronCheckinResult:
  type: object
  required:
    - success
    - scanned
    - acted
    - errors
  description: |
    Summary returned by `processCheckinForUpcomingMatches`. Cross-tenant
    tick — `scanned` counts every upcoming match across tenants, `acted`
    counts the ones that triggered an action (email/Discord/forfeit),
    `errors` counts handler-level failures (route still returns 200).
  properties:
    success:
      type: boolean
      enum:
        - true
    scanned:
      type: integer
      minimum: 0
    acted:
      type: integer
      minimum: 0
    errors:
      type: integer
      minimum: 0
  additionalProperties: true
CronDisputeSlaResult:
  type: object
  required:
    - tenants_scanned
    - breaches_found
    - events_emitted
    - duration_ms
  properties:
    tenants_scanned:
      type: integer
      minimum: 0
      description: Number of active tenants scanned this tick.
    breaches_found:
      type: integer
      minimum: 0
      description: Total disputes past SLA across all tenants.
    events_emitted:
      type: integer
      minimum: 0
      description: |
        `dispute.sla_breached` events successfully written to
        `bot_event_outbox`. Matches whose emit failed are NOT stamped, so
        they are retried next tick.
    duration_ms:
      type: integer
      minimum: 0
      description: Wall-clock duration of the tick.
CronOutboxMaintenanceLatency:
  type: object
  required:
    - sampleSize
    - sampleCap
  description: |
    Delivery-latency percentiles computed over `created_at → delivered_at`
    for rows delivered in the last 24h. `null` when no sample.
  properties:
    sampleSize:
      type: integer
      minimum: 0
      description: Number of rows actually sampled (≤ `sampleCap`).
    sampleCap:
      type: integer
      description: Hard cap on the sample (10 000).
    p50:
      type: [number, 'null']
      description: Median in ms.
    p95:
      type: [number, 'null']
    p99:
      type: [number, 'null']
    max:
      type: [number, 'null']
CronOutboxMaintenanceStats:
  type: object
  required:
    - pendingCount
    - delivered24h
    - failed24h
    - latencyMs
  properties:
    pendingCount:
      type: integer
      minimum: 0
      description: Rows currently `status='pending'`.
    oldestPendingAgeSec:
      type: [integer, 'null']
      description: Age of the oldest pending row in seconds (null if none).
    delivered24h:
      type: integer
      minimum: 0
      description: Rows delivered in the last 24h.
    failed24h:
      type: integer
      minimum: 0
      description: Rows that hit `status='failed'` (`last_push_at`) last 24h.
    latencyMs:
      $ref: '#/components/schemas/CronOutboxMaintenanceLatency'
CronOutboxMaintenanceResult:
  type: object
  required:
    - success
    - config
    - markedFailed
    - deleted
    - stats
  properties:
    success:
      type: boolean
      enum:
        - true
    config:
      type: object
      required:
        - failedAfterHours
        - deleteAfterDays
      properties:
        failedAfterHours:
          type: number
          description: |
            Threshold for poison-pill (`OUTBOX_FAILED_AFTER_HOURS`).
            Default 6.
        deleteAfterDays:
          type: number
          description: |
            Retention for delivered/failed rows
            (`OUTBOX_DELETE_AFTER_DAYS`). Default 7.
    markedFailed:
      type: integer
      minimum: 0
      description: Pending rows promoted to `failed` this tick.
    deleted:
      type: integer
      minimum: 0
      description: Delivered/failed rows older than cutoff deleted this tick.
    stats:
      $ref: '#/components/schemas/CronOutboxMaintenanceStats'
CronOverrunCheckResult:
  type: object
  required:
    - success
    - runs_examined
    - segments_examined
    - escalated
    - deduped
    - errors
    - truncated_by_time_budget
    - duration_ms
  properties:
    success:
      type: boolean
      enum:
        - true
    runs_examined:
      type: integer
      minimum: 0
      description: Number of `event_runs` with `status='live'` scanned.
    segments_examined:
      type: integer
      minimum: 0
      description: Live segments inspected for overrun.
    escalated:
      type: integer
      minimum: 0
      description: New `event_cues` rows inserted this tick.
    deduped:
      type: integer
      minimum: 0
      description: |
        Inserts that hit `23505` on `uq_event_cues_dedup_key` — a cue with
        the same `auto-overrun:{runId}:{segId}` already exists.
    errors:
      type: integer
      minimum: 0
      description: Cue insert errors not classified as dedup.
    truncated_by_time_budget:
      type: boolean
      description: |
        `true` when the 20s soft time budget was exceeded and the loop
        broke early. Remaining work picked up next tick.
    duration_ms:
      type: integer
      minimum: 0
CronWebPushDispatchResult:
  type: object
  required:
    - success
    - processed
    - sent
    - skipped_already_delivered
    - skipped_max_attempts
    - skipped_prefs
    - expired_removed
    - failed
    - events_examined
    - duration_ms
    - truncated_by_time_budget
  properties:
    success:
      type: boolean
      enum:
        - true
    events_examined:
      type: integer
      minimum: 0
      description: |
        Outbox events loaded as candidates (filtered by event_name and
        `WEB_PUSH_WINDOW_HOURS`, capped by `WEB_PUSH_BATCH_LIMIT`).
    processed:
      type: integer
      minimum: 0
      description: Events for which at least one delivery was attempted.
    sent:
      type: integer
      minimum: 0
      description: Successful `webpush.sendNotification` calls.
    skipped_already_delivered:
      type: integer
      minimum: 0
      description: |
        (event, subscription) pairs with existing
        `status='delivered'` or `'expired'`.
    skipped_max_attempts:
      type: integer
      minimum: 0
      description: |
        Pairs whose previous attempts reached `MAX_ATTEMPTS_BEFORE_GIVING_UP`
        (5). No further retries.
    skipped_prefs:
      type: integer
      minimum: 0
      description: |
        Recipients excluded because of opt-out rows in
        `notification_prefs`.
    expired_removed:
      type: integer
      minimum: 0
      description: |
        Subscriptions that returned 410/404 and were deleted from
        `push_subscriptions` (CASCADE drops `web_push_deliveries`).
    failed:
      type: integer
      minimum: 0
      description: |
        Transient/5xx errors. Row stays `failed`, `attempts` incremented,
        retried next tick until threshold.
    duration_ms:
      type: integer
      minimum: 0
    truncated_by_time_budget:
      type: boolean
      description: |
        `true` when the 8s soft time budget was exceeded. The rest of the
        batch is picked up on the next 1-minute tick.
CronWebPushInFlightSkip:
  type: object
  description: |
    Returned when a previous tick is still running inside the same
    Netlify worker. Cross-instance contention is handled by the
    `UNIQUE(outbox_event_id, subscription_id)` constraint on
    `web_push_deliveries`.
  required:
    - success
    - skipped
  properties:
    success:
      type: boolean
      enum:
        - true
    skipped:
      type: string
      enum:
        - in_flight
CronSyncGameHeroesResult:
  type: object
  description: |
    Summary returned by `syncAllGameHeroes()`. `success=false` indicates
    at least one upstream sync failed (HTTP status will be 207 in that
    case so the heartbeat write still happens).
  required:
    - success
    - startedAt
    - finishedAt
    - durationMs
    - games
  properties:
    success:
      type: boolean
    startedAt:
      type: string
      format: date-time
    finishedAt:
      type: string
      format: date-time
    durationMs:
      type: integer
      minimum: 0
    games:
      type: array
      items:
        type: object
        required:
          - game
          - ok
          - fetched
          - upserted
        properties:
          game:
            type: string
            enum:
              - lol
              - dota2
          ok:
            type: boolean
          fetched:
            type: integer
            minimum: 0
            description: Number of rows received from the upstream API.
          upserted:
            type: integer
            minimum: 0
            description: Number of rows written to `game_heroes`.
          error:
            type: string
            description: Only present when `ok=false`.
GameHero:
  type: object
  description: |
    A champion (LoL) or hero (Dota 2) row from `public.game_heroes`,
    exposed in camelCase. `attribute` is Dota-only
    (`strength|agility|intelligence|universal`), `title` is LoL-only.
  required:
    - id
    - game
    - externalId
    - key
    - name
    - roles
    - imageUrl
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    game:
      type: string
      enum:
        - lol
        - dota2
    externalId:
      type: string
      description: Riot champion key (numeric) for LoL, OpenDota hero id for Dota 2.
    key:
      type: string
      description: Technical slug ("Aatrox", "antimage").
    name:
      type: string
    title:
      type: [string, 'null']
    roles:
      type: array
      items:
        type: string
    attribute:
      type: [string, 'null']
      enum:
        - strength
        - agility
        - intelligence
        - universal
        - null
    imageUrl:
      type: string
      format: uri
      description: Splash art URL on the upstream CDN.
    iconUrl:
      type: [string, 'null']
      format: uri
GameHeroesResponse:
  type: object
  required:
    - game
    - total
    - heroes
  properties:
    game:
      type: string
      enum:
        - lol
        - dota2
    total:
      type: integer
      minimum: 0
    heroes:
      type: array
      items:
        $ref: '#/components/schemas/GameHero'
DraftEngineError:
  type: object
  description: |
    Structured error returned by the draft engine endpoints (Lots 2-3).
    `code` is the machine-readable reason; `error` is a human-readable
    message. Additional context fields (`expected`, `got`, `format`,
    `allowed`, `draftId`…) may be present depending on the code.
  required:
    - error
    - code
  properties:
    error:
      type: string
    code:
      type: string
      enum:
        - MATCH_NOT_FOUND
        - TOURNAMENT_NOT_FOUND
        - GAME_NOT_DRAFTABLE
        - FORMAT_NOT_SUPPORTED
        - GAME_INDEX_OUT_OF_RANGE
        - DRAFT_ALREADY_EXISTS
        - DRAFT_NOT_FOUND
        - SIDES_INVALID
        - SIDES_REQUIRED
        - DRAFT_NOT_IN_PROGRESS
        - DRAFT_NOT_PENDING
        - STEP_OUT_OF_ORDER
        - HERO_NOT_FOUND
        - HERO_WRONG_GAME
        - HERO_ALREADY_BANNED
        - HERO_ALREADY_PICKED
        - HERO_FEARLESS_BLOCKED
        - PICK_TIMER_INVALID
        - NO_ELIGIBLE_HERO
        - DEADLINE_NOT_REACHED
        - STEP_ALREADY_COMMITTED
        - DB_ERROR
  additionalProperties: true
InitMatchDraftRequest:
  type: object
  required:
    - gameIndex
  properties:
    gameIndex:
      type: integer
      minimum: 1
      description: 1-based index of the game inside the match (bo3 → 1..3).
    fearless:
      type: boolean
      description: |
        Override the default fearless flag from the game's DraftFlow.
        When true, a hero picked in any prior game of the match cannot
        be picked again.
    pickTimerSeconds:
      type: integer
      minimum: 5
      maximum: 300
      description: Per-step pick timer (Lot 3 wires the server-side enforcement).
SetMatchDraftSidesRequest:
  type: object
  required:
    - team1Side
    - team2Side
  properties:
    team1Side:
      type: string
      description: LoL = blue|red ; Dota = radiant|dire.
    team2Side:
      type: string
      description: Must differ from team1Side.
CommitMatchDraftStepRequest:
  type: object
  required:
    - stepNumber
    - heroId
  properties:
    stepNumber:
      type: integer
      minimum: 1
      description: Must equal current_step + 1.
    heroId:
      $ref: '#/components/schemas/Uuid'
DraftFlowStep:
  type: object
  required:
    - step_number
    - phase
    - action
    - side
  properties:
    step_number:
      type: integer
      minimum: 1
    phase:
      type: string
      enum:
        - ban_1
        - pick_1
        - ban_2
        - pick_2
        - ban_3
        - pick_3
    action:
      type: string
      enum:
        - ban
        - pick
    side:
      type: string
      enum:
        - team1
        - team2
DraftFlow:
  type: object
  required:
    - steps
    - fearless
  properties:
    steps:
      type: array
      items:
        $ref: '#/components/schemas/DraftFlowStep'
    fearless:
      type: boolean
MatchDraft:
  type: object
  description: Row of public.match_drafts (snake_case mirrors the DB).
  required:
    - id
    - match_id
    - game_index
    - game
    - current_step
    - status
    - fearless
    - pick_timer_seconds
    - tenant_id
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    match_id:
      $ref: '#/components/schemas/Uuid'
    game_index:
      type: integer
      minimum: 1
    game:
      type: string
      enum:
        - lol
        - dota2
    team1_side:
      type: [string, 'null']
      enum:
        - blue
        - red
        - radiant
        - dire
        - null
    team2_side:
      type: [string, 'null']
      enum:
        - blue
        - red
        - radiant
        - dire
        - null
    current_step:
      type: integer
      minimum: 0
    status:
      type: string
      enum:
        - pending
        - in_progress
        - completed
        - cancelled
    fearless:
      type: boolean
    pick_timer_seconds:
      type: integer
    started_at:
      type: [string, 'null']
      format: date-time
    completed_at:
      type: [string, 'null']
      format: date-time
    tenant_id:
      $ref: '#/components/schemas/Uuid'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
MatchDraftStep:
  type: object
  description: Row of public.match_draft_steps.
  required:
    - id
    - draft_id
    - step_number
    - phase
    - action
    - side
    - auto_picked
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    draft_id:
      $ref: '#/components/schemas/Uuid'
    step_number:
      type: integer
    phase:
      type: string
    action:
      type: string
      enum:
        - ban
        - pick
    side:
      type: string
      enum:
        - team1
        - team2
    hero_id:
      oneOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    committed_at:
      type: [string, 'null']
      format: date-time
    deadline_at:
      type: [string, 'null']
      format: date-time
    auto_picked:
      type: boolean
    created_at:
      type: string
      format: date-time
DraftState:
  type: object
  description: Assembled draft state returned by every Lot 2 endpoint.
  required:
    - draft
    - flow
    - steps
    - nextStepIndex
    - bannedHeroes
    - team1Picks
    - team2Picks
  properties:
    draft:
      $ref: '#/components/schemas/MatchDraft'
    flow:
      $ref: '#/components/schemas/DraftFlow'
    steps:
      type: array
      items:
        $ref: '#/components/schemas/MatchDraftStep'
    nextStepIndex:
      type: integer
      description: Zero-based index in `flow.steps` of the next step to play, or -1
        once completed.
    bannedHeroes:
      type: array
      items:
        $ref: '#/components/schemas/GameHero'
    team1Picks:
      type: array
      items:
        $ref: '#/components/schemas/GameHero'
    team2Picks:
      type: array
      items:
        $ref: '#/components/schemas/GameHero'
MatchDraftStateResponse:
  type: object
  required:
    - draft
  properties:
    draft:
      oneOf:
        - $ref: '#/components/schemas/DraftState'
        - type: 'null'
    teams:
      type: object
      description: |
        Resolved team names for the spectator UI auto-title (Lot 5
        polish). Public endpoint only — admin GET omits this field.
      properties:
        team1Name:
          type: [string, 'null']
        team2Name:
          type: [string, 'null']
DeleteMatchDraftResponse:
  type: object
  required:
    - success
    - deletedDraftId
    - deletedSteps
  properties:
    success:
      type: boolean
      enum:
        - true
    deletedDraftId:
      $ref: '#/components/schemas/Uuid'
    deletedSteps:
      type: integer
      minimum: 0
      description: Count of match_draft_steps rows removed.
BotInitMatchDraftResponse:
  type: object
  description: |
    Response shape of `POST /api/bot/v1/matches/:matchId/drafts`.
    The bot uses `captains[].discordUserId` to DM each captain with
    the captain UI link. `null` values mean the captain has not
    linked Discord yet — the bot falls back to a channel post.
  required:
    - success
    - draft
    - captains
  properties:
    success:
      type: boolean
      enum:
        - true
    draft:
      $ref: '#/components/schemas/DraftState'
    captains:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: object
        required:
          - teamSlot
        properties:
          teamSlot:
            type: integer
            enum:
              - 1
              - 2
          teamId:
            $ref: '#/components/schemas/Uuid'
          teamName:
            type: [string, 'null']
          authUserId:
            $ref: '#/components/schemas/Uuid'
          discordUserId:
            type: [string, 'null']
            description: Snowflake or null when the captain hasn't linked Discord.
DraftAutoPickResponse:
  type: object
  description: |
    Return shape of `POST /api/admin/matches/.../auto-pick`. When the
    current step's deadline is still in the future (or the step is
    already committed, or the draft is not in_progress), the engine
    is a no-op and the response carries `autoPicked: false` only.
  required:
    - autoPicked
  properties:
    autoPicked:
      type: boolean
    stepNumber:
      type: integer
      minimum: 1
      description: Present when autoPicked = true.
    heroId:
      $ref: '#/components/schemas/Uuid'
    draft:
      $ref: '#/components/schemas/DraftState'
CronDraftAutoPickResult:
  type: object
  description: |
    Tick summary returned by `/api/cron/draft-auto-pick`. `success` is
    false only if at least one individual draft errored; per-draft
    errors are caught so one bad row never blocks the rest.
  required:
    - success
    - scanned
    - autoPicked
    - errors
  properties:
    success:
      type: boolean
    scanned:
      type: integer
      minimum: 0
      description: |
        Number of distinct drafts whose current step deadline_at was
        in the past at the start of the tick.
    autoPicked:
      type: integer
      minimum: 0
    errors:
      type: integer
      minimum: 0
CronPlanRenewalResult:
  type: object
  description: |
    Résumé du tick de `/api/cron/plan-renewal`. `checked` = tenants aux plans
    payants examinés ; `markedPastDue` = bascules expiration → past_due ;
    `remindersSent` = relances de renouvellement envoyées ; `errors` =
    échecs par-tenant non fatals.
