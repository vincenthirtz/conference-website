  type: object
  description: |
    Versioned overlay state stored in `event_runs.broadcast_state` (JSONB,
    freeform — no dedicated columns). Always normalised on read: absent
    fields are backfilled with defaults (`scene` → `'starting'`,
    `auto_director` → `true`, `on_air` → `false`, `pip.enabled` → `false`).
  required:
    - v
    - on_air
    - lower_third
    - pip
    - scene
    - auto_director
    - scene_updated_at
  properties:
    v:
      type: integer
      enum:
        - 1
      description: Schema version (always 1).
