    country:
      type: [string, 'null']
    member_count:
      type: integer
    is_joinable:
      type: boolean
    open_for_scrim:
      type: boolean
      description: L'equipe se declare disponible pour un scrim.
ScrimSearch:
  type: object
  required:
    - id
    - team_id
    - slots
    - status
    - expires_at
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    team_id:
      $ref: '#/components/schemas/Uuid'
    slots:
      type: array
      items:
        type: string
        format: date-time
    format:
      type: [string, 'null']
    note:
      type: [string, 'null']
    status:
      type: string
      enum: [active, fulfilled, cancelled]
    expires_at:
      type: string
      format: date-time
DirectoryTeam:
  type: object
  required:
    - id
    - name
    - member_count
    - is_joinable
    - is_full
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    name:
      type: string
    short_name:
      type: [string, 'null']
    logo_url:
      type: [string, 'null']
    slug:
      type: [string, 'null']
    country:
      type: [string, 'null']
    member_count:
      type: integer
    is_joinable:
      type: boolean
    is_full:
      type: boolean
    rating:
      type: [number, 'null']
    reliability:
      type: object
      description: >-
        Fiabilite derivee des propositions de scrim recues. `responseRate` et
        `medianResponseHours` sont null sous le seuil d'echantillon.
      properties:
        received:
          type: integer
        answered:
          type: integer
        ignored:
          type: integer
        responseRate:
          type: [integer, 'null']
        medianResponseHours:
          type: [number, 'null']
    scrim_search:
      type: [object, 'null']
      properties:
        slots:
          type: array
          items:
            type: string
            format: date-time
        format:
          type: [string, 'null']
        note:
          type: [string, 'null']
        expires_at:
          type: string
          format: date-time
        common_slots:
          type: array
          items:
            type: string
            format: date-time
    common_rhythm_slots:
      type: array
      description: >-
        Creneaux RECURRENTS en commun (rythme d'equipe). Repli quand aucune des
        deux equipes n'a d'annonce vivante. Cles "<jour ISO>-<minutes>".
      items:
        type: string
    encounters_recent:
      type: integer
      description: Affrontements (match ou scrim) sur les 90 derniers jours.
    match:
      type: object
      description: >-
        Score de compatibilite d'adversaire. Porte le tri de l'annuaire. Un
        facteur `null` vaut un a priori neutre dans le calcul.
      required:
        - score
        - factors
        - reasons
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        factors:
          type: object
          properties:
            slots:
              type: [number, 'null']
            level:
              type: [number, 'null']
            reliability:
              type: [number, 'null']
            novelty:
              type: [number, 'null']
        reasons:
          type: array
          description: Codes de raison, traduits cote UI. Trois au maximum.
          items:
            type: string
            enum:
              - common_slots
              - common_rhythm
              - no_common_slots
              - similar_level
              - level_gap
              - reliable
              - slow_to_answer
              - never_played
              - played_recently
TeamRhythm:
  type: object
  description: >-
    Rythme d'equipe : disponibilite RECURRENTE du roster. La heatmap et le noyau
    sont exprimes dans `referenceTimezone` (celui de l'appelant) ; chaque membre
    declare dans le sien et est reprojete.
  required:
    - teamId
    - referenceTimezone
    - mySlots
    - threshold
    - heatmap
    - coreSlots
  properties:
    teamId:
      type: [string, 'null']
      format: uuid
    teamName:
      type: [string, 'null']
    referenceTimezone:
      type: string
    mySlots:
      type: array
      items:
        type: string
    myTimezone:
      type: string
    memberNames:
      type: object
      additionalProperties:
        type: string
    memberCount:
      type: integer
    declaredCount:
      type: integer
    threshold:
      type: integer
      description: Nombre de disponibles a partir duquel un creneau est « noyau ».
    heatmap:
      type: object
      additionalProperties:
        type: object
        properties:
          count:
            type: integer
          userIds:
            type: array
            items:
              type: string
              format: uuid
    coreSlots:
      type: array
      items:
        type: string
    suggestedSlots:
      type: array
      description: Prochaines occurrences reelles du noyau, pretes pour une annonce.
      items:
        type: string
        format: date-time
    suggestion:
      type: [object, 'null']
      description: >-
        Creneau d'entrainement suggere : appartient au noyau, n'est pas couvert
        par l'annonce vivante, et n'a pas ete joue plus d'une fois. `null` quand
        il n'y a rien a proposer — cas normal. Une seule suggestion a la fois.
      properties:
        slot:
          type: string
          description: Cle de creneau recurrent "<jour ISO>-<minutes>".
        availableCount:
          type: integer
        playedCount:
          type: integer
          description: Fois ou l'equipe a REELLEMENT joue a cette heure-la.
    suggestionSlots:
      type: array
      description: Prochaines occurrences du seul creneau suggere.
      items:
        type: string
        format: date-time
    canAnnounce:
      type: boolean
PlayerProgression:
  type: object
  description: >-
    Niveau de l'appelante dans le temps + jalons de son equipe. Toutes les
    valeurs sont derivees ; rien n'est declaratif.
  required:
    - series
    - milestones
  properties:
    teamId:
      type: [string, 'null']
      format: uuid
    teamName:
      type: [string, 'null']
    rating:
      type: [integer, 'null']
      description: Niveau courant. `null` si jamais notee.
    peak:
      type: [integer, 'null']
      description: Meilleur niveau atteint, courant compris.
    delta:
      type: [integer, 'null']
      description: >-
        Variation entre le premier et le dernier point de la serie affichee.
        `null` sous deux mesures — `0` signifierait « n'a pas bouge », ce qui
        n'est pas la meme information.
    ratedGames:
      type: integer
      description: Affrontements notes qui alimentent la serie.
    series:
      type: array
      description: Serie chronologique plafonnee (12 points max).
      items:
        type: object
        properties:
          at:
            type: string
            format: date-time
          rating:
            type: number
    milestones:
      type: array
      description: >-
        Faits dates ou chiffres, dans l'ordre du recit. `streakType` n'est
        renseigne que pour le code `streak`.
      items:
        type: object
        required:
          - code
        properties:
          code:
            type: string
            enum:
              - first_encounter
              - first_win
              - encounters_reached
              - peak_rating
              - streak
          value:
            type: integer
          at:
            type: string
            format: date-time
          streakType:
            type: string
            enum: [win, loss]
ScoutingReport:
  type: object
  description: >-
    Dossier d'adversaire. Tout ce qui concerne la cible derive de RESULTATS
    publics ; `myNotes` seul est prive et appartient a l'appelant.
  required:
    - myTeam
    - target
    - report
  properties:
    myTeam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    timezone:
      type: string
      description: Fuseau dans lequel `usualSlots` est exprime.
    teamNames:
      type: object
      description: Noms des adversaires communs, indexes par id.
      additionalProperties:
        type: string
    target:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: [string, 'null']
        logoUrl:
          type: [string, 'null']
        slug:
          type: [string, 'null']
        country:
          type: [string, 'null']
        rating:
          type: [number, 'null']
        reliability:
          type: object
          description: Identique a celle exposee par l'annuaire.
          properties:
            received:
              type: integer
            answered:
              type: integer
            ignored:
              type: integer
            responseRate:
              type: [integer, 'null']
            medianResponseHours:
              type: [number, 'null']
    myNotes:
      type: array
      description: >-
        Revues de l'equipe APPELANTE sur cette cible. Jamais celles de la cible.
      items:
        type: object
        properties:
          subjectType:
            type: string
            enum: [match, scrim]
          subjectId:
            type: string
            format: uuid
          playedAt:
            type: [string, 'null']
            format: date-time
          vodUrl:
            type: [string, 'null']
          notes:
            type: [string, 'null']
    report:
      type: object
      properties:
        headToHead:
          type: object
          properties:
            played:
              type: integer
            wins:
              type: integer
            losses:
              type: integer
            draws:
              type: integer
            recent:
              type: array
              items:
                type: object
                properties:
                  subjectType:
                    type: string
                    enum: [match, scrim]
                  subjectId:
                    type: string
                    format: uuid
                  playedAt:
                    type: [string, 'null']
                    format: date-time
                  result:
                    type: string
                    enum: [win, loss, draw]
                  myScore:
                    type: [integer, 'null']
                  opponentScore:
                    type: [integer, 'null']
        recentForm:
          type: [array, 'null']
          description: "`null` sous le seuil d'echantillon."
          items:
            type: string
            enum: [win, loss, draw]
        record:
          type: [object, 'null']
          properties:
            played:
              type: integer
            wins:
              type: integer
            losses:
              type: integer
        commonOpponents:
          type: array
          items:
            type: object
            properties:
              teamId:
                type: string
                format: uuid
              myWins:
                type: integer
              myLosses:
                type: integer
              theirWins:
                type: integer
              theirLosses:
                type: integer
        usualSlots:
          type: [array, 'null']
          description: >-
            Derives des heures REELLEMENT jouees. `null` sous le seuil
            d'echantillon.
          items:
            type: object
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
              hour:
                type: integer
              count:
                type: integer
TeamHealth:
  type: object
  description: >-
    Sante d'equipe : constats derives des donnees existantes. Pas de score, pas
    d'indicateur declaratif — chaque code se rattache a un geste precis.
  required:
    - teamId
    - issues
    - blockingCount
  properties:
    teamId:
      type: [string, 'null']
      format: uuid
    teamName:
      type: [string, 'null']
    blockingCount:
      type: integer
    memberCount:
      type: integer
    requiredStarters:
      type: integer
      description: Effectif requis pour aligner une equipe.
    requiredStartersSource:
      type: string
      enum: [tournament, lineup]
      description: >-
        `tournament` quand l'equipe est inscrite a un tournoi declarant
        `min_players`, `lineup` sinon (taille de line-up du jeu).
    issues:
      type: array
      description: Ordonnes du plus bloquant au plus accessoire.
      items:
        type: object
        required:
          - code
          - severity
          - count
        properties:
          code:
            type: string
            enum:
              - no_captain
              - roster_shortfall
              - missing_battle_tag
              - unverified_battle_tag
              - discord_unlinked
              - never_logged_in
              - no_rhythm
              - invisible_for_scrims
              - unreviewed_encounters
          severity:
            type: string
            enum: [blocking, warning, info]
          count:
            type: integer
            description: Personnes ou objets concernes. 0 pour un constat binaire.
