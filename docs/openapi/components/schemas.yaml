    name:
      type: string
    short_name:
      type: [string, 'null']
    slug:
      type: [string, 'null']
    logo_url:
      type: [string, 'null']
    roster:
      type: array
      items:
        $ref: '#/components/schemas/PublicV1TeamMember'
