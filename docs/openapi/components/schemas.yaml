      type: [string, 'null']
      description: Free lower-third caption, or null when hidden.
    pip:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    scene:
      $ref: '#/components/schemas/BroadcastScene'
    auto_director:
      type: boolean
      description: >-
        When true (default), the auto-director reactor switches `scene` on match
        status changes. When false, scene changes are operator-driven only.
