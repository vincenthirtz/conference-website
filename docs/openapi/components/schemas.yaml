    - success
    - checked
    - markedPastDue
    - remindersSent
    - errors
  properties:
    success:
      type: boolean
      enum:
        - true
    checked:
      type: integer
      minimum: 0
    markedPastDue:
      type: integer
      minimum: 0
    remindersSent:
      type: integer
      minimum: 0
    errors:
      type: integer
      minimum: 0
ContactFormSubmission:
  type: object
  required:
    - name
    - email
    - subject
    - message
  properties:
    name:
