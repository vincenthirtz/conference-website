PlayerTwitchStatus:
  type: object
  description: >-
    Etat du rattachement Twitch d'une joueuse. `twitchLogin` est un pseudo
    d'AFFICHAGE : Twitch autorise le renommage, donc rien ne s'y appuie pour
    decider d'un gain — c'est `twitch_user_id`, jamais rendu ici, qui fait foi.
  required:
    - configured
    - linked
  properties:
    configured:
      type: boolean
      description: >-
        False quand la fonctionnalite est dormante. L'ecran masque alors le
        bouton plutot que de proposer un chemin qui finirait en 503.
    linked:
      type: boolean
    twitchLogin:
      type: [string, 'null']
    linkedAt:
      type: [string, 'null']
      format: date-time
PlayerHeroPreferences:
  type: object
  description: >-
    Héros préférés et évités d'une joueuse. Listes GLOBALES au compte : une
    joueuse les conserve en changeant d'équipe. Deux listes vides sont un état
    normal, pas une absence de données. `slots` est rendu par l'API pour que
    l'interface borne ses emplacements sans recopier le nombre — la contrainte
    SQL, elle, écrit `3` en dur (du SQL ne peut pas importer une constante
    TypeScript), donc les deux ne bougent qu'ensemble, par migration.
  required:
    - picks
    - bans
    - slots
  properties:
    picks:
      type: array
      maxItems: 3
      items:
        type: string
      description: >-
        Ordre de préférence décroissant. Le premier est celui qui représentera
        la joueuse sur sa carte à collectionner faute de photo.
    bans:
      type: array
      maxItems: 3
      items:
        type: string
      description: >-
        Jamais proposés, y compris lorsque la recommandation retombe sur le rôle
        de la joueuse.
    slots:
      type: integer
      description: Nombre d'emplacements par liste.
DiscoveryCard:
  type: object
  description: >-
    Carte de découverte GLOBALE (cross-tenant) du joueur courant. Opt-in
    explicite, invisible par défaut. « Absent = défaut » : `discoverable` false,
    `showRatings`/`showTeams` true. `optedInAt` est posé au premier passage
    `discoverable=true` (audit RGPD, jamais effacé ensuite).
  required:
    - discoverable
    - displayName
    - avatarUrl
    - tagline
    - showRatings
    - showTeams
    - optedInAt
  properties:
    discoverable:
      type: boolean
    displayName:
      type: [string, 'null']
    avatarUrl:
      type: [string, 'null']
    tagline:
      type: [string, 'null']
    showRatings:
      type: boolean
    showTeams:
      type: boolean
    optedInAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
DirectoryPlayer:
  type: object
  description: >-
    Carte enrichie d'un joueur découvrable de l'annuaire cross-tenant (recherche
    + listes de suivi). `stats` omises si `showRatings=false`, `teams` omises si
    `showTeams=false`.
  required:
    - authUserId
    - displayName
    - avatarUrl
    - tagline
    - discordUsername
    - isFollowing
    - followerCount
  properties:
    authUserId:
      $ref: '#/components/schemas/Uuid'
    displayName:
      type: string
    avatarUrl:
      type: [string, 'null']
    tagline:
      type: [string, 'null']
    discordUsername:
      type: [string, 'null']
    stats:
      type: object
      required:
        - games
        - peakRating
        - tenants
      properties:
        games:
          type: integer
          description: Somme des parties jouées, tous tenants.
        peakRating:
          type: number
          description: Meilleur rating (max cross-tenant).
        tenants:
          type: integer
          description: Nombre de tenants distincts où le joueur a un rating.
    teams:
      type: array
      items:
        type: object
        required:
          - name
          - slug
        properties:
          name:
            type: string
          slug:
            type: [string, 'null']
    isFollowing:
      type: boolean
      description: True si le caller suit ce joueur.
    followerCount:
      type: integer
      description: Nombre total de followers du joueur.
BattlenetStatus:
  type: object
  description: >-
    Etat de la verification d'identite Battle.net pour le joueur connecte (`GET
    /api/player/battlenet-status`). `configured` reflete la presence des creds
    Blizzard cote serveur (feature dormante si `false`) ; `linked` / `battleTag`
    / `verifiedAt` decrivent le lien du joueur.
  required:
    - configured
    - linked
    - battleTag
    - verifiedAt
  properties:
    configured:
      type: boolean
      description: >-
        True si les creds Blizzard sont presents cote serveur (feature active) ;
        false = feature dormante.
    linked:
      type: boolean
      description: True si le joueur a un BattleTag verifie lie a son profil.
    battleTag:
      type: [string, 'null']
      description: BattleTag verifie (ex. `Player#1234`), ou `null` si non lie.
    verifiedAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
      description: Horodatage de la verification, ou `null` si non lie.
    reward:
      type: [object, 'null']
      description: >-
        Ajout additif (2026-09-15). La recompense TCG de la verification, pour
        que la carte l'annonce sans ecrire de nombre : `coins` vient du registre
        `earnSources.ts`. `null` = recompense non activee (`schemaReady` faux).
        `claimable: false` = deja recue (tous tenants confondus) OU registre
        illisible — une erreur de lecture n'est pas une absence, on ne promet
        pas a l'aveugle.
      required: [coins, claimable]
      properties:
        coins:
          type: integer
          minimum: 1
        claimable:
          type: boolean
PlayerPushSubscription:
  type: object
  required:
    - id
    - endpoint
    - created
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    endpoint:
      type: string
      format: uri
    created:
      type: boolean
      description: "true si la subscription vient d'être créée (201), false si mise à
        jour (200)."
TwitchTokenResponse:
  type: object
  required:
    - access_token
    - refresh_token
    - expires_in
    - token_type
  properties:
    access_token:
      type: string
    refresh_token:
      type: string
    expires_in:
      type: integer
    scope:
      oneOf:
        - type: string
        - type: array
          items:
            type: string
    token_type:
      type: string
Team:
  type: object
  required:
    - id
    - name
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    name:
      type: string
    slug:
      type: string
    logoUrl:
      type: [string, 'null']
    captainUserId:
      $ref: '#/components/schemas/Uuid'
    discordRoleId:
      anyOf:
        - $ref: '#/components/schemas/DiscordId'
        - type: 'null'
    discordChannelId:
      anyOf:
        - $ref: '#/components/schemas/DiscordId'
        - type: 'null'
    joinable:
      type: boolean
    tenantId:
      $ref: '#/components/schemas/Uuid'
TeamMember:
  type: object
  required:
    - userId
    - role
  properties:
    userId:
      $ref: '#/components/schemas/Uuid'
    displayName:
      type: string
    battleTag:
      type: [string, 'null']
    discordUserId:
      anyOf:
        - $ref: '#/components/schemas/DiscordId'
        - type: 'null'
    role:
      type: string
      enum:
        - captain
        - member
        - substitute
        - coach
    joinedAt:
      $ref: '#/components/schemas/Timestamp'
Invitation:
  type: object
  required:
    - id
    - status
    - type
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    userId:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    teamId:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    type:
      type: string
      enum:
        - invite
        - join_request
    status:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - cancelled
    comment:
      type: [string, 'null']
    source:
      type: [string, 'null']
    payload:
      type: [object, 'null']
      additionalProperties: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
    processedAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
PlayerAction:
  type: object
  required:
    - action
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    actorAuthUserId:
      $ref: '#/components/schemas/Uuid'
    actorDiscordUserId:
      $ref: '#/components/schemas/DiscordId'
    action:
      type: string
    entityType:
      type: [string, 'null']
    entityId:
      type: [string, 'null']
    targetAuthUserId:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    payload:
      type: [object, 'null']
      additionalProperties: true
    createdAt:
      $ref: '#/components/schemas/Timestamp'
AdminTeamExportMember:
  type: object
  description: >-
    One member in `GET /api/admin/teams/export`. Game identity only — no email,
    phone, real name, birth date or user id.
  required:
    - pseudo
    - battleTag
    - discord
    - role
    - specialty
    - isCaptain
  properties:
    pseudo:
      type: [string, 'null']
      description: >-
        Team display name, else account display name, else BattleTag before `#`,
        else Discord username.
    battleTag:
      type: [string, 'null']
    discord:
      type: [string, 'null']
      description: user_discord_links.discord_username
    role:
      type: [string, 'null']
      description: team_members.role (player, coach, manager…)
    specialty:
      type: [string, 'null']
      description: tank / dps / support / flex
    isCaptain:
      type: boolean
PublicTeamSummary:
  type: object
  required:
    - id
    - name
    - member_count
    - is_joinable
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    name:
      type: string
    short_name:
      type: [string, 'null']
    logo_url:
      type: [string, 'null']
    country:
      type: [string, 'null']
    member_count:
      type: integer
    is_joinable:
      type: boolean
    open_for_scrim:
      type: boolean
      description: L'equipe se declare disponible pour un scrim.
DirectoryTeam:
  type: object
  required:
    - id
    - name
    - member_count
    - is_joinable
    - is_full
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    name:
      type: string
    short_name:
      type: [string, 'null']
    logo_url:
      type: [string, 'null']
    slug:
      type: [string, 'null']
    country:
      type: [string, 'null']
    member_count:
      type: integer
    is_joinable:
      type: boolean
    is_full:
      type: boolean
    rating:
      type: [number, 'null']
    reliability:
      type: object
      description: >-
        Fiabilite derivee des propositions de scrim recues. `responseRate` et
        `medianResponseHours` sont null sous le seuil d'echantillon.
      properties:
        received:
          type: integer
        answered:
          type: integer
        ignored:
          type: integer
        responseRate:
          type: [integer, 'null']
        medianResponseHours:
          type: [number, 'null']
    scrim_search:
      type: [object, 'null']
      properties:
        slots:
          type: array
          items:
            type: string
            format: date-time
        format:
          type: [string, 'null']
        note:
          type: [string, 'null']
        expires_at:
          type: string
          format: date-time
        common_slots:
          type: array
          items:
            type: string
            format: date-time
    common_rhythm_slots:
      type: array
      description: >-
        Creneaux RECURRENTS en commun (rythme d'equipe). Repli quand aucune des
        deux equipes n'a d'annonce vivante. Cles "<jour ISO>-<minutes>".
      items:
        type: string
    encounters_recent:
      type: integer
      description: Affrontements (match ou scrim) sur les 90 derniers jours.
    match:
      type: object
      description: >-
        Score de compatibilite d'adversaire. Porte le tri de l'annuaire. Un
        facteur `null` vaut un a priori neutre dans le calcul.
      required:
        - score
        - factors
        - reasons
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        factors:
          type: object
          properties:
            slots:
              type: [number, 'null']
            level:
              type: [number, 'null']
            reliability:
              type: [number, 'null']
            novelty:
              type: [number, 'null']
        reasons:
          type: array
          description: Codes de raison, traduits cote UI. Trois au maximum.
          items:
            type: string
            enum:
              - common_slots
              - common_rhythm
              - no_common_slots
              - similar_level
              - level_gap
              - reliable
              - slow_to_answer
              - never_played
              - played_recently
TeamRhythm:
  type: object
  description: >-
    Rythme d'equipe : disponibilite RECURRENTE du roster. La heatmap et le noyau
    sont exprimes dans `referenceTimezone` (celui de l'appelant) ; chaque membre
    declare dans le sien et est reprojete.
  required:
    - teamId
    - referenceTimezone
    - mySlots
    - threshold
    - heatmap
    - coreSlots
  properties:
    teamId:
      type: [string, 'null']
      format: uuid
    teamName:
      type: [string, 'null']
    referenceTimezone:
      type: string
    mySlots:
      type: array
      items:
        type: string
    myTimezone:
      type: string
    memberNames:
      type: object
      additionalProperties:
        type: string
    memberCount:
      type: integer
    declaredCount:
      type: integer
    threshold:
      type: integer
      description: Nombre de disponibles a partir duquel un creneau est « noyau ».
    heatmap:
      type: object
      additionalProperties:
        type: object
        properties:
          count:
            type: integer
          userIds:
            type: array
            items:
              type: string
              format: uuid
    coreSlots:
      type: array
      items:
        type: string
    suggestedSlots:
      type: array
      description: Prochaines occurrences reelles du noyau, pretes pour une annonce.
      items:
        type: string
        format: date-time
    suggestion:
      type: [object, 'null']
      description: >-
        Creneau d'entrainement suggere : appartient au noyau, n'est pas couvert
        par l'annonce vivante, et n'a pas ete joue plus d'une fois. `null` quand
        il n'y a rien a proposer — cas normal. Une seule suggestion a la fois.
      properties:
        slot:
          type: string
          description: Cle de creneau recurrent "<jour ISO>-<minutes>".
        availableCount:
          type: integer
        playedCount:
          type: integer
          description: Fois ou l'equipe a REELLEMENT joue a cette heure-la.
    suggestionSlots:
      type: array
      description: Prochaines occurrences du seul creneau suggere.
      items:
        type: string
        format: date-time
    canAnnounce:
      type: boolean
PlayerProgression:
  type: object
  description: >-
    Niveau de l'appelante dans le temps + jalons de son equipe. Toutes les
    valeurs sont derivees ; rien n'est declaratif.
  required:
    - series
    - milestones
  properties:
    teamId:
      type: [string, 'null']
      format: uuid
    teamName:
      type: [string, 'null']
    rating:
      type: [integer, 'null']
      description: Niveau courant. `null` si jamais notee.
    peak:
      type: [integer, 'null']
      description: Meilleur niveau atteint, courant compris.
    delta:
      type: [integer, 'null']
      description: >-
        Variation entre le premier et le dernier point de la serie affichee.
        `null` sous deux mesures — `0` signifierait « n'a pas bouge », ce qui
        n'est pas la meme information.
    ratedGames:
      type: integer
      description: Affrontements notes qui alimentent la serie.
    series:
      type: array
      description: Serie chronologique plafonnee (12 points max).
      items:
        type: object
        properties:
          at:
            type: string
            format: date-time
          rating:
            type: number
    milestones:
      type: array
      description: >-
        Faits dates ou chiffres, dans l'ordre du recit. `streakType` n'est
        renseigne que pour le code `streak`.
      items:
        type: object
        required:
          - code
        properties:
          code:
            type: string
            enum:
              - first_encounter
              - first_win
              - encounters_reached
              - peak_rating
              - streak
          value:
            type: integer
          at:
            type: string
            format: date-time
          streakType:
            type: string
            enum: [win, loss]
ScoutingReport:
  type: object
  description: >-
    Dossier d'adversaire. Tout ce qui concerne la cible derive de RESULTATS
    publics ; `myNotes` seul est prive et appartient a l'appelant.
  required:
    - myTeam
    - target
    - report
  properties:
    myTeam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    timezone:
      type: string
      description: Fuseau dans lequel `usualSlots` est exprime.
    teamNames:
      type: object
      description: Noms des adversaires communs, indexes par id.
      additionalProperties:
        type: string
    target:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: [string, 'null']
        logoUrl:
          type: [string, 'null']
        slug:
          type: [string, 'null']
        country:
          type: [string, 'null']
        rating:
          type: [number, 'null']
        reliability:
          type: object
          description: Identique a celle exposee par l'annuaire.
          properties:
            received:
              type: integer
            answered:
              type: integer
            ignored:
              type: integer
            responseRate:
              type: [integer, 'null']
            medianResponseHours:
              type: [number, 'null']
    myNotes:
      type: array
      description: >-
        Revues de l'equipe APPELANTE sur cette cible. Jamais celles de la cible.
      items:
        type: object
        properties:
          subjectType:
            type: string
            enum: [match, scrim]
          subjectId:
            type: string
            format: uuid
          playedAt:
            type: [string, 'null']
            format: date-time
          vodUrl:
            type: [string, 'null']
          notes:
            type: [string, 'null']
    report:
      type: object
      properties:
        headToHead:
          type: object
          properties:
            played:
              type: integer
            wins:
              type: integer
            losses:
              type: integer
            draws:
              type: integer
            recent:
              type: array
              items:
                type: object
                properties:
                  subjectType:
                    type: string
                    enum: [match, scrim]
                  subjectId:
                    type: string
                    format: uuid
                  playedAt:
                    type: [string, 'null']
                    format: date-time
                  result:
                    type: string
                    enum: [win, loss, draw]
                  myScore:
                    type: [integer, 'null']
                  opponentScore:
                    type: [integer, 'null']
        recentForm:
          type: [array, 'null']
          description: "`null` sous le seuil d'echantillon."
          items:
            type: string
            enum: [win, loss, draw]
        record:
          type: [object, 'null']
          properties:
            played:
              type: integer
            wins:
              type: integer
            losses:
              type: integer
        commonOpponents:
          type: array
          items:
            type: object
            properties:
              teamId:
                type: string
                format: uuid
              myWins:
                type: integer
              myLosses:
                type: integer
              theirWins:
                type: integer
              theirLosses:
                type: integer
        usualSlots:
          type: [array, 'null']
          description: >-
            Derives des heures REELLEMENT jouees. `null` sous le seuil
            d'echantillon.
          items:
            type: object
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
              hour:
                type: integer
              count:
                type: integer
TeamHealth:
  type: object
  description: >-
    Sante d'equipe : constats derives des donnees existantes. Pas de score, pas
    d'indicateur declaratif — chaque code se rattache a un geste precis.
  required:
    - teamId
    - issues
    - blockingCount
  properties:
    teamId:
      type: [string, 'null']
      format: uuid
    teamName:
      type: [string, 'null']
    blockingCount:
      type: integer
    memberCount:
      type: integer
    requiredStarters:
      type: integer
      description: Effectif requis pour aligner une equipe.
    requiredStartersSource:
      type: string
      enum: [tournament, lineup]
      description: >-
        `tournament` quand l'equipe est inscrite a un tournoi declarant
        `min_players`, `lineup` sinon (taille de line-up du jeu).
    issues:
      type: array
      description: Ordonnes du plus bloquant au plus accessoire.
      items:
        type: object
        required:
          - code
          - severity
          - count
        properties:
          code:
            type: string
            enum:
              - no_captain
              - roster_shortfall
              - missing_battle_tag
              - unverified_battle_tag
              - discord_unlinked
              - never_logged_in
              - no_rhythm
              - invisible_for_scrims
              - unreviewed_encounters
          severity:
            type: string
            enum: [blocking, warning, info]
          count:
            type: integer
            description: Personnes ou objets concernes. 0 pour un constat binaire.
TeamReviews:
  type: object
  description: >-
    Memoire d'equipe : affrontements joues (matchs + scrims meles dans un seul
    ordre chronologique) et revues privees associees.
  required:
    - teamId
    - encounters
    - opponents
    - reviewedCount
  properties:
    teamId:
      type: [string, 'null']
      format: uuid
    teamName:
      type: [string, 'null']
    reviewedCount:
      type: integer
    opponents:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
          count:
            type: integer
    encounters:
      type: array
      items:
        type: object
        required:
          - subjectType
          - subjectId
        properties:
          subjectType:
            type: string
            enum: [match, scrim]
          subjectId:
            type: string
            format: uuid
          playedAt:
            type: [string, 'null']
            format: date-time
          opponentTeamId:
            type: [string, 'null']
            format: uuid
          opponentName:
            type: [string, 'null']
          myScore:
            type: [integer, 'null']
          opponentScore:
            type: [integer, 'null']
          result:
            type: [string, 'null']
            enum: [win, loss, draw, null]
          label:
            type: [string, 'null']
          review:
            type: [object, 'null']
            properties:
              vodUrl:
                type: [string, 'null']
              notes:
                type: [string, 'null']
              updatedAt:
                type: [string, 'null']
                format: date-time
              updatedBy:
                type: [string, 'null']
                format: uuid
PublicFreePlayerSignupInput:
  # Généré depuis le schéma zod du handler (lib/apiContracts).
  x-zod: public.freePlayerSignup
PublicFreePlayer:
  type: object
  description: >
    Projection ANONYMISEE : aucun moyen de contact (ni email, ni pseudo Discord,
    ni snowflake).
  required:
    - id
    - name
    - roles
  properties:
