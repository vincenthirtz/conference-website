              - match
              - scrim
          assignmentId:
            $ref: '#/components/schemas/Uuid'
          role:
            type: [string, 'null']
          startsAt:
            $ref: '#/components/schemas/Timestamp'
          match:
            type: [object, 'null']
            additionalProperties: true
          scrim:
            type: [object, 'null']
            additionalProperties: true
CasterBriefing:
  type: object
  required:
    - match
    - teams
    - headToHead
    - recentNews
  properties:
    match:
      type: object
      required:
        - id
        - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scheduledAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        status:
          type: string
        matchFormat:
          type: [string, 'null']
        roundName:
          type: [string, 'null']
        tournament:
          type: [object, 'null']
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
            slug:
              type: [string, 'null']
    teams:
      type: array
      items:
        type: object
        properties:
          id:
            $ref: '#/components/schemas/Uuid'
          name:
            type: string
          shortName:
            type: [string, 'null']
          logoUrl:
            type: [string, 'null']
          country:
            type: [string, 'null']
          members:
            type: array
            items:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                battle_tag:
                  type: [string, 'null']
                role:
                  type: string
                is_substitute:
                  type: boolean
                is_captain:
                  type: boolean
                is_manager:
                  type: boolean
    headToHead:
      type: object
      required:
        - totalMeetings
        - aWins
        - bWins
        - draws
      properties:
        totalMeetings:
          type: integer
        aWins:
          type: integer
        bWins:
          type: integer
        draws:
          type: integer
        lastPlayedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        lastMatchId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    recentNews:
      type: array
      items:
        type: object
        required:
          - id
          - title
          - slug
        properties:
          id:
            $ref: '#/components/schemas/Uuid'
          title:
            type: string
          slug:
            type: string
          tag:
            type: [string, 'null']
          publishedAt:
            oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
          excerpt:
            type: [string, 'null']
