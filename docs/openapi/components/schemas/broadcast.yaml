CastAssignment:
  type: object
  required:
    - id
    - matchId
    - casterUserId
    - role
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    matchId:
      $ref: '#/components/schemas/Uuid'
    casterUserId:
      $ref: '#/components/schemas/Uuid'
    casterDisplayName:
      type: string
    role:
      type: string
      enum:
        - play_by_play
        - color
        - observer
        - director
    confirmedAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
EventRun:
  type: object
  required:
    - id
    - name
    - status
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    slug:
      type: string
    name:
      type: string
    status:
      type: string
      enum:
        - draft
        - scheduled
        - live
        - done
    startedAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    endedAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
EventSegment:
  type: object
  required:
    - id
    - runId
    - ord
    - type
    - status
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    runId:
      $ref: '#/components/schemas/Uuid'
    ord:
      type: integer
    type:
      type: string
      enum:
        - match
        - intermission
        - intro
        - outro
        - interview
        - segment
    title:
      type: string
    durationMin:
      type: integer
    matchId:
      anyOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    status:
      type: string
      enum:
        - upcoming
        - live
        - done
        - skipped
    obs_scene:
      type: [string, 'null']
      maxLength: 200
      description: |
        Nom de la scène OBS mise à l'antenne au démarrage du segment.
        `null` = pas de bascule automatique. C'est un nom, pas un
        identifiant : obs-websocket adresse les scènes par nom, et rien
        côté serveur ne peut valider qu'elle existe.
EventWave:
  type: object
  required:
    - id
    - event_run_id
    - ord
    - title
    - status
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    tenant_id:
      $ref: '#/components/schemas/Uuid'
    event_run_id:
      $ref: '#/components/schemas/Uuid'
    ord:
      type: integer
    title:
      type: string
    planned_start_at:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    duration_min:
      type: [integer, 'null']
    status:
      type: string
      enum:
        - upcoming
        - live
        - done
        - skipped
    started_at:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    ended_at:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
EventStation:
  type: object
  required:
    - id
    - event_run_id
    - ord
    - name
    - status
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    tenant_id:
      $ref: '#/components/schemas/Uuid'
    event_run_id:
      $ref: '#/components/schemas/Uuid'
    ord:
      type: integer
    name:
      type: string
    stream_url:
      type: [string, 'null']
    notes:
      type: [string, 'null']
    status:
      type: string
BroadcastScene:
  type: string
  description: The overlay scene the OBS browser-source renders.
  enum:
    - starting
    - match
    - pause
    - results
    - end
    - custom
NextMatchResult:
  type: object
  description: Result of the one-click "next match" broadcast transition.
  required:
    - segment
    - alreadyStarted
    - runId
  properties:
    segment:
      allOf:
        - $ref: '#/components/schemas/EventSegment'
      description: The segment now promoted to `status='live'`.
    alreadyStarted:
      type: boolean
      description: >-
        True when the target segment was already live (idempotent no-op swap),
        false when it was promoted from `upcoming`.
    runId:
      type: string
      format: uuid
      description: The live run the transition happened on.
OverlayState:
  type: object
  description: |
    Chrome-less overlay payload for a run's OBS browser source. PUBLIC and
    cacheable (`Cache-Control: s-maxage=5, stale-while-revalidate`); never
    exposes staff-only fields (`auto_director`, casters, stream URLs,
    checklists, broadcast messages…). When the run is unknown or not live,
    a safe empty-ish shape is returned (scene `'starting'`, `match` null,
    `onAir` false) with a 200 so the browser source never errors mid-show.
  required:
    - scene
    - onAir
    - lowerThird
    - pip
    - match
    - sponsors
  properties:
    scene:
      $ref: '#/components/schemas/BroadcastScene'
    onAir:
      type: boolean
    lowerThird:
      type: [string, 'null']
    pip:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    match:
      anyOf:
        - $ref: '#/components/schemas/OverlayMatch'
        - type: 'null'
    sponsors:
      type: array
      items:
        $ref: '#/components/schemas/OverlaySponsor'
OverlayMatch:
  type: object
  description: The current match block rendered by the overlay.
  required:
    - team1
    - team2
    - format
    - status
  properties:
    team1:
      anyOf:
        - $ref: '#/components/schemas/OverlayTeam'
        - type: 'null'
    team2:
      anyOf:
        - $ref: '#/components/schemas/OverlayTeam'
        - type: 'null'
    format:
      type: [string, 'null']
      description: Match format (e.g. `bo1`, `bo3`), or null.
    status:
      type: [string, 'null']
      description: Match status (e.g. `ongoing`, `finished`), or null.
OverlayTeam:
  type: object
  required:
    - name
    - logoUrl
    - score
  properties:
    name:
      type: string
    logoUrl:
      type: [string, 'null']
    score:
      type: [integer, 'null']
OverlaySponsor:
  type: object
  required:
    - name
    - logoUrl
    - websiteUrl
  properties:
    name:
      type: string
    logoUrl:
      type: [string, 'null']
    websiteUrl:
      type: [string, 'null']
CreateEventSegmentInput:
  type: object
  required:
    - type
    - title
  properties:
    type:
      type: string
      enum:
        - match
        - break
        - intro
        - outro
        - custom
    title:
      type: string
      minLength: 1
      maxLength: 200
    ord:
      type: integer
      minimum: 0
    match_id:
      type: [string, 'null']
      format: uuid
    duration_min:
      type: [integer, 'null']
      minimum: 1
    planned_start_at:
      type: [string, 'null']
      format: date-time
    broadcast_message:
      type: [object, 'null']
      additionalProperties: false
      properties:
        discord:
          type: string
          maxLength: 2000
        push_title:
          type: string
          maxLength: 200
        push_body:
          type: string
          maxLength: 500
        email_subject:
          type: string
          maxLength: 200
    caster_checklist:
      type: array
      items:
        type: object
        required:
          - key
          - label
        properties:
          key:
            type: string
            minLength: 1
            maxLength: 80
          label:
            type: string
            minLength: 1
            maxLength: 200
          checked_by_user_id:
            type: [string, 'null']
            format: uuid
          checked_at:
            type: [string, 'null']
            format: date-time
PublicEventRun:
  type: object
  required:
    - id
    - name
    - status
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    slug:
      type: string
    name:
      type: string
    description:
      type: [string, 'null']
    scheduledAt:
      oneOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    status:
      type: string
      enum:
        - draft
        - scheduled
        - live
        - done
    startedAt:
      oneOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    endedAt:
      oneOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
PublicEventSegment:
  type: object
  required:
    - id
    - ord
    - type
    - status
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    ord:
      type: integer
    type:
      type: string
      enum:
        - match
        - intermission
        - intro
        - outro
        - interview
        - segment
    title:
      type: [string, 'null']
    durationMin:
      type: [integer, 'null']
    matchId:
      oneOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    status:
      type: string
      enum:
        - upcoming
        - live
        - done
        - skipped
    startedAt:
      oneOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    endedAt:
      oneOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
CasterMe:
  type: object
  required:
    - caster
    - upcomingAssignments
  properties:
    caster:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        title:
          type: [string, 'null']
        imageUrl:
          type: [string, 'null']
        twitchUrl:
          type: [string, 'null']
        city:
          type: [string, 'null']
    upcomingAssignments:
      type: array
      items:
        type: object
        required:
          - kind
          - assignmentId
        properties:
          kind:
            type: string
            enum:
              - match
              - scrim
          assignmentId:
            $ref: '#/components/schemas/Uuid'
          role:
            type: [string, 'null']
          startsAt:
            $ref: '#/components/schemas/Timestamp'
          match:
            type: [object, 'null']
            additionalProperties: true
          scrim:
            type: [object, 'null']
            additionalProperties: true
CasterBriefing:
  type: object
  required:
    - match
    - teams
    - headToHead
    - recentNews
  properties:
    match:
      type: object
      required:
        - id
        - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        scheduledAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        status:
          type: string
        matchFormat:
          type: [string, 'null']
        roundName:
          type: [string, 'null']
        tournament:
          type: [object, 'null']
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
            slug:
              type: [string, 'null']
    teams:
      type: array
      items:
        type: object
        properties:
          id:
            $ref: '#/components/schemas/Uuid'
          name:
            type: string
          shortName:
            type: [string, 'null']
          logoUrl:
            type: [string, 'null']
          country:
            type: [string, 'null']
          members:
            type: array
            items:
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                battle_tag:
                  type: [string, 'null']
                role:
                  type: string
                is_substitute:
                  type: boolean
                is_captain:
                  type: boolean
                is_manager:
                  type: boolean
    headToHead:
      type: object
      required:
        - totalMeetings
        - aWins
        - bWins
        - draws
      properties:
        totalMeetings:
          type: integer
        aWins:
          type: integer
        bWins:
          type: integer
        draws:
          type: integer
        lastPlayedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        lastMatchId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    recentNews:
      type: array
      items:
        type: object
        required:
          - id
          - title
          - slug
        properties:
          id:
            $ref: '#/components/schemas/Uuid'
          title:
            type: string
          slug:
            type: string
          tag:
            type: [string, 'null']
          publishedAt:
            oneOf:
              - $ref: '#/components/schemas/Timestamp'
              - type: 'null'
          excerpt:
            type: [string, 'null']
CasterCueAck:
  type: object
  required:
    - ack
    - alreadyAcked
  properties:
    ack:
      type: object
      required:
        - cue_id
        - cast_member_id
        - acked_at
      properties:
        cue_id:
          $ref: '#/components/schemas/Uuid'
        cast_member_id:
          $ref: '#/components/schemas/Uuid'
        acked_at:
          $ref: '#/components/schemas/Timestamp'
    alreadyAcked:
      type: boolean
MatchOverlaySource:
  type: object
  description: |
    Ce qu'une source navigateur OBS affiche pour UN match : la rencontre, ses
    équipes, ses manches et son veto, plus la marque de l'espace.

    PUBLIC et cacheable (`Cache-Control: s-maxage=5, stale-while-revalidate=30`),
    mais restreint : le tournoi doit être `visibility: public`, et l'espace
    propriétaire doit porter la capacité de palier `matchOverlays` (sinon
    `402`). `match` vaut `null` quand il n'y a rien à montrer — c'est l'écran
    d'attente, pas une erreur.
  required:
    - match
    - tournament
    - branding
    - serverTime
  properties:
    match:
      anyOf:
        - $ref: '#/components/schemas/MatchOverlayView'
        - type: 'null'
    tournament:
      anyOf:
        - type: object
          required: [id, slug, name, shortName, game]
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: [string, 'null']
            name:
              type: [string, 'null']
            shortName:
              type: [string, 'null']
            game:
              type: [string, 'null']
        - type: 'null'
    branding:
      anyOf:
        - type: object
          required: [name, logoUrl, accent]
          properties:
            name:
              type: [string, 'null']
            logoUrl:
              type: [string, 'null']
            accent:
              type: [string, 'null']
        - type: 'null'
      description: Marque de l'espace (white-label), `null` pour la Coupe elle-même.
    serverTime:
      type: string
      format: date-time
      description: >-
        Heure du serveur, dont le compte à rebours se sert au lieu de l'horloge
        du poste de régie.
MatchOverlayView:
  type: object
  description: Le match tel qu'il s'affiche à l'antenne.
  required:
    - id
    - phase
    - format
    - roundName
    - scheduledAt
    - startedAt
    - team1
    - team2
    - maps
    - veto
  properties:
    id:
      type: string
      format: uuid
    phase:
      type: string
      enum: [upcoming, live, final]
    format:
      type: [string, 'null']
      description: Format du match (`bo1`, `bo3`…), tel que saisi.
    roundName:
      type: [string, 'null']
    scheduledAt:
      type: [string, 'null']
      format: date-time
    startedAt:
      type: [string, 'null']
      format: date-time
    team1:
      anyOf:
        - $ref: '#/components/schemas/MatchOverlayTeam'
        - type: 'null'
    team2:
      anyOf:
        - $ref: '#/components/schemas/MatchOverlayTeam'
        - type: 'null'
    maps:
      type: array
      items:
        type: object
        required: [order, name, team1Score, team2Score, winner]
        properties:
          order:
            type: integer
          name:
            type: [string, 'null']
          team1Score:
            type: [integer, 'null']
          team2Score:
            type: [integer, 'null']
          winner:
            type: [integer, 'null']
            enum: [1, 2, null]
    veto:
      type: array
      items:
        type: object
        required: [step, action, map, side]
        properties:
          step:
            type: integer
          action:
            type: string
            enum: [ban, pick, decider]
          map:
            type: [string, 'null']
          side:
            type: [integer, 'null']
            enum: [1, 2, null]
MatchOverlayTeam:
  type: object
  description: Une équipe du match, côté écran.
  required:
    - name
    - shortName
    - logoUrl
    - score
    - isWinner
  properties:
    name:
      type: string
    shortName:
      type: [string, 'null']
    logoUrl:
      type: [string, 'null']
    score:
      type: integer
      description: Manches gagnées. `0` plutôt que `null` quand rien n'est saisi.
    isWinner:
      type: boolean
      description: Lu sur `winner_team_id`, jamais déduit d'une comparaison de scores.
DayOverlaySource:
  type: object
  description: |
    Le programme d'une journée d'un tournoi, tel que la source OBS
    « matchs du jour » l'affiche. PUBLIC et cacheable 15 s ; mêmes
    restrictions que `MatchOverlaySource` (tournoi public, capacité
    `matchOverlays`).
  required:
    - date
    - matches
    - currentMatchId
    - tournament
    - branding
    - serverTime
  properties:
    date:
      type: string
      format: date
      description: Jour affiché, heure de Paris.
    matches:
      type: array
      description: Matchs du jour dans l'ordre du programme (40 au plus).
      items:
        $ref: '#/components/schemas/DayOverlayMatch'
    currentMatchId:
      type: [string, 'null']
      format: uuid
      description: >-
        Match mis en avant : en cours, sinon prochain à jouer, sinon dernier
        résultat récent de la journée.
    tournament:
      type: object
      required: [id, slug, name, shortName, game]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: [string, 'null']
        name:
          type: [string, 'null']
        shortName:
          type: [string, 'null']
        game:
          type: [string, 'null']
    branding:
      anyOf:
        - type: object
          required: [name, logoUrl, accent]
          properties:
            name:
              type: [string, 'null']
            logoUrl:
              type: [string, 'null']
            accent:
              type: [string, 'null']
        - type: 'null'
    serverTime:
      type: string
      format: date-time
DayOverlayMatch:
  type: object
  description: Un match de la journée, côté écran (sans manches ni veto).
  required: [id, phase, format, roundName, scheduledAt, startedAt, team1, team2]
  properties:
    id:
      type: string
      format: uuid
    phase:
      type: string
      enum: [upcoming, live, final]
    format:
      type: [string, 'null']
    roundName:
      type: [string, 'null']
    scheduledAt:
      type: [string, 'null']
      format: date-time
    startedAt:
      type: [string, 'null']
      format: date-time
    team1:
      anyOf:
        - $ref: '#/components/schemas/MatchOverlayTeam'
        - type: 'null'
    team2:
      anyOf:
        - $ref: '#/components/schemas/MatchOverlayTeam'
        - type: 'null'
UpcomingScrimsOverlaySource:
  type: object
  description: |
    Les prochains scrims publics d'un espace, tels que la source OBS
    « scrims à venir » les affiche. PUBLIC et cacheable 30 s.
  required: [scrims, total, branding, serverTime]
  properties:
    scrims:
      type: array
      items:
        type: object
        required: [id, name, slug, phase, scheduledAt, team1, team2]
        properties:
          id:
            type: string
            format: uuid
          name:
            type: [string, 'null']
          slug:
            type: [string, 'null']
          phase:
            type: string
            enum: [live, upcoming]
          scheduledAt:
            type: [string, 'null']
            format: date-time
          team1:
            anyOf:
              - $ref: '#/components/schemas/MatchOverlayTeam'
              - type: 'null'
          team2:
            anyOf:
              - $ref: '#/components/schemas/MatchOverlayTeam'
              - type: 'null'
    total:
      type: integer
      description: Nombre de scrims retenus avant la coupe à `limit`.
    branding:
      anyOf:
        - type: object
          required: [name, logoUrl, accent]
          properties:
            name:
              type: [string, 'null']
            logoUrl:
              type: [string, 'null']
            accent:
              type: [string, 'null']
        - type: 'null'
    serverTime:
      type: string
      format: date-time
ScrimResultOverlaySource:
  type: object
  description: |
    Le résultat d'un scrim tel que la source OBS « résultat de scrim »
    l'affiche. PUBLIC et cacheable 5 s.
  required: [scrim, branding, serverTime]
  properties:
    scrim:
      anyOf:
        - type: object
          required:
            [
              id,
              name,
              slug,
              phase,
              scheduledAt,
              completedAt,
              draw,
              hasScore,
              team1,
              team2,
            ]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: [string, 'null']
            slug:
              type: [string, 'null']
            phase:
              type: string
              enum: [final, live, pending]
              description: >-
                `final` clos avec un score, `live` en cours, `pending` pas
                encore de résultat.
            scheduledAt:
              type: [string, 'null']
              format: date-time
            completedAt:
              type: [string, 'null']
              format: date-time
            draw:
              type: boolean
              description: Clos sur une égalité (aucun vainqueur).
            hasScore:
              type: boolean
              description: >-
                Un score est posé : résultat final, ou score en cours mis à
                jour par le staff pendant le match.
            team1:
              anyOf:
                - $ref: '#/components/schemas/MatchOverlayTeam'
                - type: 'null'
            team2:
              anyOf:
                - $ref: '#/components/schemas/MatchOverlayTeam'
                - type: 'null'
        - type: 'null'
    branding:
      anyOf:
        - type: object
          required: [name, logoUrl, accent]
          properties:
            name:
              type: [string, 'null']
            logoUrl:
              type: [string, 'null']
            accent:
              type: [string, 'null']
        - type: 'null'
    serverTime:
      type: string
      format: date-time
DonationsOverlaySource:
  type: object
  description: |
    Les derniers dons HelloAsso d'un espace et le total d'une journée, tels
    que la source OBS « alerte don » les affiche. PUBLIC et cacheable 5 s.
    Aucune donnée du donateur (ni nom ni email).
  required: [donations, totalCents, count, from, branding, serverTime]
  properties:
    donations:
      type: array
      maxItems: 20
      description: Dons des dernières 24 h, plus récents d'abord.
      items:
        type: object
        required: [id, amountCents, currency, createdAt]
        properties:
          id:
            type: string
            format: uuid
          amountCents:
            type: integer
            minimum: 0
          currency:
            type: string
            example: EUR
          createdAt:
            type: string
            format: date-time
    totalCents:
      type: integer
      minimum: 0
      description: Somme des dons depuis minuit (Paris) du jour `from`.
    count:
      type: integer
      minimum: 0
      description: Nombre de dons comptés dans `totalCents`.
    from:
      type: string
      format: date
    branding:
      anyOf:
        - type: object
          required: [name, logoUrl, accent]
