        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        title:
          type: [string, 'null']
        imageUrl:
          type: [string, 'null']
        twitchUrl:
          type: [string, 'null']
        city:
          type: [string, 'null']
    upcomingAssignments:
      type: array
      items:
        type: object
        required:
          - kind
          - assignmentId
        properties:
          kind:
            type: string
