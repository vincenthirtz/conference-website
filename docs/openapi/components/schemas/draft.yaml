GameHero:
  type: object
  description: |
    A champion (LoL) or hero (Dota 2) row from `public.game_heroes`,
    exposed in camelCase. `attribute` is Dota-only
    (`strength|agility|intelligence|universal`), `title` is LoL-only.
  required:
    - id
    - game
    - externalId
    - key
    - name
    - roles
    - imageUrl
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    game:
      type: string
      enum:
        - lol
        - dota2
    externalId:
      type: string
      description: Riot champion key (numeric) for LoL, OpenDota hero id for Dota 2.
    key:
      type: string
      description: Technical slug ("Aatrox", "antimage").
    name:
      type: string
    title:
      type: [string, 'null']
    roles:
      type: array
      items:
        type: string
    attribute:
      type: [string, 'null']
      enum:
        - strength
        - agility
        - intelligence
        - universal
        - null
    imageUrl:
      type: string
      format: uri
      description: Splash art URL on the upstream CDN.
    iconUrl:
      type: [string, 'null']
      format: uri
GameHeroesResponse:
  type: object
  required:
    - game
    - total
    - heroes
  properties:
    game:
      type: string
      enum:
        - lol
        - dota2
    total:
      type: integer
      minimum: 0
    heroes:
      type: array
      items:
        $ref: '#/components/schemas/GameHero'
DraftEngineError:
  type: object
  description: |
    Structured error returned by the draft engine endpoints (Lots 2-3).
    `code` is the machine-readable reason; `error` is a human-readable
    message. Additional context fields (`expected`, `got`, `format`,
    `allowed`, `draftId`…) may be present depending on the code.
  required:
    - error
    - code
  properties:
    error:
      type: string
    code:
      type: string
      enum:
        - MATCH_NOT_FOUND
        - TOURNAMENT_NOT_FOUND
        - GAME_NOT_DRAFTABLE
        - FORMAT_NOT_SUPPORTED
        - GAME_INDEX_OUT_OF_RANGE
        - DRAFT_ALREADY_EXISTS
        - DRAFT_NOT_FOUND
        - SIDES_INVALID
        - SIDES_REQUIRED
        - DRAFT_NOT_IN_PROGRESS
        - DRAFT_NOT_PENDING
        - STEP_OUT_OF_ORDER
        - HERO_NOT_FOUND
        - HERO_WRONG_GAME
        - HERO_ALREADY_BANNED
        - HERO_ALREADY_PICKED
        - HERO_FEARLESS_BLOCKED
        - PICK_TIMER_INVALID
        - NO_ELIGIBLE_HERO
        - DEADLINE_NOT_REACHED
        - STEP_ALREADY_COMMITTED
        - DB_ERROR
  additionalProperties: true
InitMatchDraftRequest:
  type: object
  required:
    - gameIndex
  properties:
    gameIndex:
      type: integer
      minimum: 1
      description: 1-based index of the game inside the match (bo3 → 1..3).
    fearless:
      type: boolean
      description: |
        Override the default fearless flag from the game's DraftFlow.
        When true, a hero picked in any prior game of the match cannot
        be picked again.
    pickTimerSeconds:
      type: integer
      minimum: 5
      maximum: 300
      description: Per-step pick timer (Lot 3 wires the server-side enforcement).
SetMatchDraftSidesRequest:
  type: object
  required:
    - team1Side
    - team2Side
  properties:
    team1Side:
      type: string
      description: LoL = blue|red ; Dota = radiant|dire.
    team2Side:
      type: string
      description: Must differ from team1Side.
CommitMatchDraftStepRequest:
  type: object
  required:
    - stepNumber
    - heroId
  properties:
    stepNumber:
      type: integer
      minimum: 1
      description: Must equal current_step + 1.
    heroId:
      $ref: '#/components/schemas/Uuid'
DraftFlowStep:
  type: object
  required:
    - step_number
    - phase
    - action
    - side
  properties:
    step_number:
      type: integer
      minimum: 1
    phase:
      type: string
      enum:
        - ban_1
        - pick_1
        - ban_2
        - pick_2
        - ban_3
        - pick_3
    action:
      type: string
      enum:
        - ban
        - pick
    side:
      type: string
      enum:
        - team1
        - team2
DraftFlow:
  type: object
  required:
    - steps
    - fearless
  properties:
    steps:
      type: array
      items:
        $ref: '#/components/schemas/DraftFlowStep'
    fearless:
      type: boolean
MatchDraft:
  type: object
  description: Row of public.match_drafts (snake_case mirrors the DB).
  required:
    - id
    - match_id
    - game_index
    - game
    - current_step
    - status
    - fearless
    - pick_timer_seconds
    - tenant_id
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    match_id:
      $ref: '#/components/schemas/Uuid'
    game_index:
      type: integer
      minimum: 1
    game:
      type: string
      enum:
        - lol
        - dota2
    team1_side:
      type: [string, 'null']
      enum:
        - blue
        - red
        - radiant
        - dire
        - null
    team2_side:
      type: [string, 'null']
      enum:
        - blue
        - red
        - radiant
        - dire
        - null
    current_step:
      type: integer
      minimum: 0
    status:
      type: string
      enum:
        - pending
        - in_progress
        - completed
        - cancelled
    fearless:
      type: boolean
    pick_timer_seconds:
      type: integer
    started_at:
      type: [string, 'null']
      format: date-time
    completed_at:
      type: [string, 'null']
      format: date-time
    tenant_id:
      $ref: '#/components/schemas/Uuid'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
MatchDraftStep:
  type: object
  description: Row of public.match_draft_steps.
  required:
    - id
    - draft_id
    - step_number
    - phase
    - action
    - side
    - auto_picked
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    draft_id:
      $ref: '#/components/schemas/Uuid'
    step_number:
      type: integer
    phase:
      type: string
    action:
      type: string
      enum:
        - ban
        - pick
    side:
      type: string
      enum:
        - team1
        - team2
    hero_id:
      oneOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    committed_at:
      type: [string, 'null']
      format: date-time
    deadline_at:
      type: [string, 'null']
      format: date-time
    auto_picked:
      type: boolean
    created_at:
      type: string
      format: date-time
DraftState:
  type: object
  description: Assembled draft state returned by every Lot 2 endpoint.
  required:
    - draft
    - flow
    - steps
    - nextStepIndex
    - bannedHeroes
    - team1Picks
    - team2Picks
  properties:
    draft:
      $ref: '#/components/schemas/MatchDraft'
    flow:
      $ref: '#/components/schemas/DraftFlow'
    steps:
      type: array
      items:
        $ref: '#/components/schemas/MatchDraftStep'
    nextStepIndex:
      type: integer
      description: Zero-based index in `flow.steps` of the next step to play, or -1
        once completed.
    bannedHeroes:
      type: array
      items:
        $ref: '#/components/schemas/GameHero'
    team1Picks:
      type: array
      items:
        $ref: '#/components/schemas/GameHero'
    team2Picks:
      type: array
      items:
        $ref: '#/components/schemas/GameHero'
MatchDraftStateResponse:
  type: object
  required:
    - draft
  properties:
    draft:
      oneOf:
        - $ref: '#/components/schemas/DraftState'
        - type: 'null'
    teams:
      type: object
      description: |
        Resolved team names for the spectator UI auto-title (Lot 5
        polish). Public endpoint only — admin GET omits this field.
      properties:
        team1Name:
          type: [string, 'null']
        team2Name:
          type: [string, 'null']
DeleteMatchDraftResponse:
  type: object
  required:
    - success
    - deletedDraftId
    - deletedSteps
  properties:
    success:
      type: boolean
      enum:
        - true
    deletedDraftId:
      $ref: '#/components/schemas/Uuid'
    deletedSteps:
      type: integer
      minimum: 0
      description: Count of match_draft_steps rows removed.
BotInitMatchDraftResponse:
  type: object
  description: |
    Response shape of `POST /api/bot/v1/matches/:matchId/drafts`.
    The bot uses `captains[].discordUserId` to DM each captain with
    the captain UI link. `null` values mean the captain has not
    linked Discord yet — the bot falls back to a channel post.
  required:
    - success
    - draft
    - captains
  properties:
    success:
      type: boolean
      enum:
        - true
    draft:
      $ref: '#/components/schemas/DraftState'
    captains:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: object
        required:
          - teamSlot
        properties:
          teamSlot:
            type: integer
            enum:
              - 1
              - 2
          teamId:
            $ref: '#/components/schemas/Uuid'
          teamName:
            type: [string, 'null']
          authUserId:
            $ref: '#/components/schemas/Uuid'
          discordUserId:
            type: [string, 'null']
            description: Snowflake or null when the captain hasn't linked Discord.
DraftAutoPickResponse:
  type: object
  description: |
    Return shape of `POST /api/admin/matches/.../auto-pick`. When the
    current step's deadline is still in the future (or the step is
    already committed, or the draft is not in_progress), the engine
    is a no-op and the response carries `autoPicked: false` only.
  required:
    - autoPicked
  properties:
    autoPicked:
      type: boolean
    stepNumber:
      type: integer
      minimum: 1
      description: Present when autoPicked = true.
    heroId:
      $ref: '#/components/schemas/Uuid'
    draft:
      $ref: '#/components/schemas/DraftState'
