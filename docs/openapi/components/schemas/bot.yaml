AutocompleteResult:
  type: object
  required:
    - results
  properties:
    results:
      type: array
      items:
        type: object
        required:
          - value
          - label
        properties:
          value:
            type: string
          label:
            type: string
BotEventOutboxRow:
  type: object
  required:
    - id
    - eventId
    - eventName
    - tenantId
    - payload
  properties:
    id:
      type: integer
    eventId:
      $ref: '#/components/schemas/Uuid'
    eventName:
      type: string
    tenantId:
      $ref: '#/components/schemas/Uuid'
    payload:
      type: object
      additionalProperties: true
    pushAttempts:
      type: integer
    lastPushError:
      type: [string, 'null']
    lastPushAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    createdAt:
      $ref: '#/components/schemas/Timestamp'
Lock:
  type: object
  properties:
    acquired:
      type: boolean
    released:
      type: boolean
    currentHolder:
      type: [string, 'null']
    expiresAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
