AdminMatchPatchInput:
  type: object
  description: |
    Discriminated by `mode`. Score mode applies via applyMatchScore (with
    optional bracket propagation). Meta mode whitelists planning, lobby and
    bracket linkage fields. `expected_updated_at` enables optimistic locking.
  properties:
    mode:
      type: string
      enum:
        - score
        - meta
    expected_updated_at:
      type: string
      format: date-time
    team1Score:
      type: integer
      minimum: 0
    team2Score:
      type: integer
      minimum: 0
    winnerTeamId:
      type: string
      format: uuid
    forfeit_team_id:
      type: string
      format: uuid
    propagate:
      type: boolean
      default: true
    status:
      type: string
      enum:
        - pending
        - ongoing
        - finished
        - cancelled
        - postponed
        - walkover
    tournament_id:
      type: [string, 'null']
      format: uuid
    stage_id:
      type: [string, 'null']
      format: uuid
    is_bye:
      type: boolean
    match_format:
      type: string
    round_name:
      type: [string, 'null']
    round_number:
      type: [integer, 'null']
    bracket_side:
      type: [string, 'null']
      enum:
        - wb
        - lb
        - final
        - none
        - null
    group_key:
      type: [string, 'null']
    team1_id:
      type: [string, 'null']
      format: uuid
    team2_id:
      type: [string, 'null']
      format: uuid
    scheduled_at:
      type: [string, 'null']
      format: date-time
    completed_at:
      type: [string, 'null']
      format: date-time
    stream_url:
      type: [string, 'null']
    replay_url:
      type: [string, 'null']
    lobby_code:
      type: [string, 'null']
    notes:
      type: [string, 'null']
    next_match_win_id:
      type: [string, 'null']
      format: uuid
    next_match_win_slot:
      type: [integer, 'null']
      enum:
        - 1
        - 2
        - null
    next_match_lose_id:
      type: [string, 'null']
