ContactFormSubmission:
  type: object
  required:
    - name
    - email
    - subject
    - message
  properties:
    name:
      type: string
      maxLength: 100
    email:
      type: string
      format: email
    subject:
      type: string
      maxLength: 200
    message:
      type: string
      minLength: 10
      maxLength: 5000
PublicNewsletterSubscribeInput:
  # Généré depuis le schéma zod du handler (lib/apiContracts).
  x-zod: public.newsletterSubscribe
PublicNewsItem:
  type: object
  required:
    - id
    - title
    - slug
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    title:
      type: string
    slug:
      type: string
    tag:
      type: [string, 'null']
    excerpt:
      type: [string, 'null']
    content:
      type: [string, 'null']
    imageUrl:
      type: [string, 'null']
    createdAt:
      $ref: '#/components/schemas/Timestamp'
    publishedAt:
      oneOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
    updatedAt:
      $ref: '#/components/schemas/Timestamp'
    commentsCount:
      type: integer
NewsComment:
  type: object
  required:
    - id
    - news_id
    - content
    - created_at
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    news_id:
      $ref: '#/components/schemas/Uuid'
    author_name:
      type: [string, 'null']
    content:
      type: string
    created_at:
      $ref: '#/components/schemas/Timestamp'
NewsCommentInput:
  type: object
  required:
    - newsId
    - content
    - captchaToken
    - captchaAnswer
  properties:
    newsId:
      type: string
      format: uuid
    content:
      type: string
      minLength: 3
      maxLength: 2000
    authorName:
      type: [string, 'null']
      maxLength: 50
    honeypot:
      type: string
      description: Doit etre vide (anti-bot).
    captchaToken:
      type: string
    captchaAnswer:
      type: string
OnboardTenantRequest:
  type: object
  required:
    - requested_slug
    - requested_name
    - requested_email
    - turnstile_token
  properties:
    requested_slug:
      type: string
      pattern: ^[a-z0-9-]+$
      minLength: 3
      maxLength: 60
    requested_name:
      type: string
      maxLength: 120
    requested_email:
      type: string
      format: email
      maxLength: 254
    description:
      type: string
      maxLength: 2000
    turnstile_token:
      type: string
SupportTicketInput:
  type: object
  required:
    - category
    - severity
    - message
  properties:
    tournamentId:
      type: string
      format: uuid
    category:
      type: string
      enum:
        - dispute
        - behavior
        - technical
        - other
    severity:
      type: string
      enum:
        - low
        - medium
        - high
    subject:
      type: string
      maxLength: 200
    message:
      type: string
      minLength: 10
      maxLength: 5000
    isAnonymous:
      type: boolean
    name:
      type: string
      maxLength: 100
    email:
      type: string
      format: email
    discordUserId:
      $ref: '#/components/schemas/DiscordId'
    discordUsername:
      type: string
      maxLength: 100
