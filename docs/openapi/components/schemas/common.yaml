Error:
  type: object
  required:
    - error
  properties:
    error:
      type: string
      description: Message lisible côté client.
    code:
      type: string
      description: |
        Code machine, présent seulement quand la route en pose un. Catalogues :
        `PublicApiErrorCode` (surface publique, spec publique) et la section
        « Catalogue des codes d'erreur » de `docs/BOT_API_CONTRACT.md` (bot).
    fields:
      type: object
      description: |
        Erreurs de validation par champ (`INVALID_BODY` / `INVALID_QUERY` des
        middlewares bot et public).
      additionalProperties:
        type: array
        items:
          type: string
    details:
      type: object
      description: Détail libre, posé par quelques routes admin seulement.
      additionalProperties: true
  example:
    error: Match introuvable
Ok:
  type: object
  required:
    - ok
  properties:
    ok:
      type: boolean
      enum:
        - true
Uuid:
  type: string
  format: uuid
Timestamp:
  type: string
  format: date-time
DiscordId:
  type: string
  pattern: ^[0-9]{17,20}$
  description: Snowflake Discord (user, guild, channel, role).
Tenant:
  type: object
  required:
    - id
    - slug
    - name
  properties:
    id:
      $ref: '#/components/schemas/Uuid'
    slug:
      type: string
    name:
      type: string
    createdAt:
      $ref: '#/components/schemas/Timestamp'
