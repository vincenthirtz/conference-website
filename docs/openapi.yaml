          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >-
            Conflit metier. `code` vaut `ALREADY_STAFF` (le joueur fait deja
            partie du staff actif) ou `ALREADY_PENDING` (une candidature caster
            est deja en attente).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                      - ALREADY_STAFF
                      - ALREADY_PENDING
                  existingDemandeId:
                    type: string
                    format: uuid
