                $ref: "#/components/schemas/VetoState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: Update veto state (admin override).
      operationId: adminPatchMatchVeto
      tags:
        - admin/matches
      security:
        - StaffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated veto state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VetoState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Reset the veto for a match.
      operationId: adminDeleteMatchVeto
      tags:
        - admin/matches
      security:
        - StaffSession: []
      responses:
        "204":
          description: Reset.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/matches/{matchId}/drafts:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags:
        - admin/matches
      summary: Initialise a MOBA draft for (matchId, gameIndex) — Lot 2.
      operationId: adminInitMatchDraft
      description: |
        Resolves the game slug from the match's tournament (`tournaments.game`,
        must be `lol` or `dota2`), then creates a `match_drafts` row and seeds
        all `match_draft_steps` from `config/games/<slug>.draftFlows[format]`.
        409 if a draft already exists for (matchId, gameIndex). Honors the
        `Idempotency-Key` header.
      security:
        - StaffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitMatchDraftRequest"
      responses:
        "201":
          description: Newly created draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDraftStateResponse"
        "400":
          description: |
            Invalid input — bad gameIndex, missing tournament game,
            game has no draft phase, or pickTimerSeconds out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Match or tournament not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
        "409":
          description: Draft already exists for (matchId, gameIndex).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
  /api/admin/matches/{matchId}/drafts/{gameIndex}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - name: gameIndex
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - admin/matches
      summary: Read the assembled draft state for (matchId, gameIndex).
      operationId: adminGetMatchDraft
      description: |
        Returns `{ draft: null }` when no draft has been initialised yet,
        otherwise the full `DraftState` including the flow, the seeded
        steps, the heroes resolved per ban/pick, and `nextStepIndex`.
      security:
        - StaffSession: []
      responses:
        "200":
          description: Draft state (or null if not initialised).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDraftStateResponse"
        "400":
          description: Invalid matchId or gameIndex.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - admin/matches
      summary: Drop a draft + its steps (recovery from a bad init).
      operationId: adminDeleteMatchDraft
      description: |
        Removes the draft row and all its steps so the operator can
        re-init with the right gameIndex / fearless flag without
        dropping into SQL. Refuses to delete an `in_progress` draft
        unless `?force=1` is passed.
      security:
        - StaffSession: []
      parameters:
        - name: force
          in: query
          required: false
          description: Pass `1` or `true` to bypass the in_progress guard.
          schema:
            type: string
      responses:
        "200":
          description: Draft + steps deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMatchDraftResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Draft not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
        "409":
          description: Refused — in_progress draft without force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
  /api/admin/matches/{matchId}/drafts/{gameIndex}/side:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - name: gameIndex
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      tags:
        - admin/matches
      summary: Assign team1Side + team2Side on a pending draft.
      operationId: adminSetMatchDraftSides
      description: |
        Side enum is game-specific :
        `lol` accepts `blue|red`, `dota2` accepts `radiant|dire`.
        team1Side and team2Side must differ. Only allowed before any step
        has been committed (`current_step = 0`). Honors the
        `Idempotency-Key` header.
      security:
        - StaffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMatchDraftSidesRequest"
      responses:
        "200":
          description: Updated draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDraftStateResponse"
        "400":
          description: Invalid side values or shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Match or draft not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
        "409":
          description: Draft already started or completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
  /api/admin/matches/{matchId}/drafts/{gameIndex}/start:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - name: gameIndex
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags:
        - admin/matches
      summary: Arm the draft timer (Lot 3) — transition pending to in_progress.
      operationId: adminStartMatchDraft
      description: |
        Stamps `started_at` + sets `deadline_at` on step 1 = now +
        pick_timer_seconds so the captain UI / spectator UI / cron can
        race against the clock. Requires sides to be assigned and
        current_step = 0 (i.e. no commit yet).
      security:
        - StaffSession: []
      responses:
        "200":
          description: Draft transitioned to in_progress with deadline armed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDraftStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Match or draft not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
        "409":
          description: Sides not set yet, or draft already started/completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
  /api/admin/matches/{matchId}/drafts/{gameIndex}/auto-pick:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - name: gameIndex
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags:
        - admin/matches
      summary: Manual trigger of the auto-pick logic on this draft (Lot 3).
      operationId: adminAutoPickMatchDraft
      description: |
        If the current step's `deadline_at` is in the past, picks the
        first alphabetical eligible hero and commits it with
        `auto_picked=true`. Otherwise returns `200 { autoPicked: false }`.
        Useful for manual recovery + the captain UI "auto-pick now"
        button. The Netlify cron `/api/cron/draft-auto-pick` runs the
        same logic across every tenant every minute.
      security:
        - StaffSession: []
      responses:
        "200":
          description: Auto-pick outcome (either no-op or a fresh state).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftAutoPickResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Draft not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
        "500":
          description: |
            No eligible hero left for auto-pick — extremely unlikely (LoL
            pool ~170, Dota ~125) but the engine surfaces it explicitly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
  /api/cron/draft-auto-pick:
    get:
      tags:
        - cron
      summary: Auto-pick scan across every tenant (Lot 3 — draft timer).
      operationId: cronDraftAutoPickGet
      description: |
        Schedule: every minute (`* * * * *`) via Netlify scheduled
        function `draft-auto-pick-cron`. Scans `match_drafts`
        status='in_progress' whose current `match_draft_steps.deadline_at`
        is in the past, then auto-picks each one (first alphabetical
        eligible hero, `auto_picked=true`). Heartbeat:
        `site_settings.last_cron_draft_auto_pick_at`.

        Auth: `Authorization: Bearer <CRON_SECRET>` header OR
        `?secret=<CRON_SECRET>` query string. Both GET and POST accepted.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Tick summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronDraftAutoPickResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - cron
      summary: Auto-pick scan across every tenant (Lot 3 — draft timer).
      operationId: cronDraftAutoPickPost
      description: Same as `GET /api/cron/draft-auto-pick`.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Tick summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronDraftAutoPickResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/admin/matches/{matchId}/drafts/{gameIndex}/commit:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - name: gameIndex
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags:
        - admin/matches
      summary: Commit one ban/pick step on the draft.
      operationId: adminCommitMatchDraftStep
      description: |
        `stepNumber` must equal `current_step + 1`. Transitions
        pending → in_progress on step 1, in_progress → completed once the
        last flow step is committed. Side selection is required before
        step 1. Rejects heroes already banned/picked in this draft, and
        when `fearless=true`, heroes picked in any prior game of the
        same match. Honors the `Idempotency-Key` header.
      security:
        - StaffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitMatchDraftStepRequest"
      responses:
        "200":
          description: Updated draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDraftStateResponse"
        "400":
          description: Invalid input (heroId not a UUID, wrong game for the hero…).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Match, draft, or hero not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
        "409":
          description: |
            Step out of order, sides not set yet, hero already
            banned/picked in this draft, or fearless-blocked across
            previous games.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEngineError"
