  /api/admin/tournament/{id}/finalize:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Freeze the tournament podium and transition to `completed`.
      description: |
        Requires `manager` role. Inserts/replaces `final_rankings` and
        transitions `tournament.status` from `running` to `completed`. Re-call
        on a finalized tournament is a 200 no-op unless `force=true`. Emits
        `tournament.finalized` to the bot outbox. Supports idempotency.
      operationId: adminFinalizeTournament
      tags:
        - admin/tournaments
      security:
        - StaffSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rankings
              properties:
                rankings:
                  type: array
                  items:
                    type: object
                    required:
                      - team_id
                      - rank
                    properties:
                      team_id:
                        type: string
                        format: uuid
                      rank:
                        type: integer
                        minimum: 1
                      prize:
                        type: string
                        nullable: true
                      notes:
                        type: string
                        nullable: true
                force:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Finalized (or no-op when already finalized).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
