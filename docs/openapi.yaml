      operationId: getOnboardRequestStatus
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Etat de la demande + URL d'invitation bot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardRequestStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/onboard/secrets/{token}:
    get:
      tags:
        - public/onboard
      summary: Reveal one-shot des secrets bot (bot_api_key + webhook_secret).
      operationId: revealOnboardSecrets
      description: |
        Token d'usage unique. Apres reveal, `secrets_revealed_at` est stampe et
        un nouveau hit retourne 410. Expiration : 1h apres creation.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
      responses:
        "200":
          description: Secrets reveles (premiere fois uniquement).
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenantId
                  - slug
                  - botApiKey
                  - webhookSecret
                properties:
                  tenantId:
                    $ref: "#/components/schemas/Uuid"
                  slug:
                    type: string
                  botApiKey:
                    type: string
                  webhookSecret:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Token deja consomme ou expire.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
