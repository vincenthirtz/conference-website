  /api/cron/broadcast-process:
    get:
      tags:
        - cron
      summary: Process scheduled broadcast email waves (daily).
      operationId: cronBroadcastProcessGet
      description: |
        Schedule: every day at 10:00 UTC (`0 10 * * *`) via Netlify
        scheduled function `broadcast-cron`. The hour is tuned to fit the
        free Brevo quota (300 emails/day) at 12h Paris winter / 11h summer.

        For each row in `broadcast_schedules` where `status='scheduled'`,
        calls `processCampaignWave(campaignId)` which sends the next
        `wave_size` emails of the campaign. Returns the per-campaign result
        set (`error` field present when a wave failed).

        Auth: `Authorization: Bearer <CRON_SECRET>` header OR
        `?secret=<CRON_SECRET>` query string. Both GET and POST are accepted.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Wave processing summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronBroadcastResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - cron
      summary: Process scheduled broadcast email waves (daily).
      operationId: cronBroadcastProcessPost
      description: |
        Same as `GET /api/cron/broadcast-process`. POST is the method used
        by the Netlify scheduled function; GET is allowed for manual ops.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Wave processing summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronBroadcastResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/cron/checkin-process:
    get:
      tags:
        - cron
      summary: Process per-match check-in flow (every 5 minutes).
      operationId: cronCheckinProcessGet
      description: |
        Schedule: every 5 minutes (`*/5 * * * *`) via Netlify scheduled
        function `checkin-cron`.

        Calls `processCheckinForUpcomingMatches()` which scans upcoming
        matches and triggers, depending on time-to-kickoff:
          - email reminders ~1h before kickoff
          - Discord webhook reminders at T-30 / T-15
          - auto-forfeit at T-0 when one side has not checked in

        Cross-tenant by design (all tenants scanned in one pass).
        Heartbeat: on success, upserts `site_settings.last_cron_checkin_at`
        with the current ISO timestamp so the mega-dashboard can detect a
        stalled cron.

        Auth: `Authorization: Bearer <CRON_SECRET>` header OR
        `?secret=<CRON_SECRET>` query string. Both GET and POST accepted.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Check-in tick summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronCheckinResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - cron
      summary: Process per-match check-in flow (every 5 minutes).
      operationId: cronCheckinProcessPost
      description: |
        Same as `GET /api/cron/checkin-process`.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Check-in tick summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronCheckinResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/cron/dispute-sla-check:
    get:
      tags:
        - cron
      summary: Detect SLA-breached disputes and emit escalation events (Lot 4).
      operationId: cronDisputeSlaCheckGet
      description: |
        Schedule: every 5 minutes (`*/5 * * * *`) via Netlify scheduled
        function `dispute-sla-cron`. Lot 4 — Open Disputes Board.

        For each active tenant, calls `findUnpingedBreaches(tenantId, now)`
        which returns matches with `status='disputed'` whose
        `dispute_opened_at` is older than `tenants.dispute_sla_minutes`
        AND have `escalation_pinged_at IS NULL`.

        Side effects per breach:
          1. Emits a `dispute.sla_breached` event in `bot_event_outbox`
             with enriched payload (matchId, tournamentId, ageMinutes,
             slaMinutes, disputeReason, optional thread enrichment).
             The Discord bot picks it up and DMs the configured staff role.
          2. Stamps `matches.escalation_pinged_at = now()` so the breach is
             escalated at most once. Only matches whose event actually made
             it to the outbox are stamped — a failed emit retries next tick.

        Auth: `Authorization: Bearer <CRON_SECRET>` header OR
        `?secret=<CRON_SECRET>` query string. Both GET and POST accepted.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Counters from the SLA-check tick.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronDisputeSlaResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - cron
      summary: Detect SLA-breached disputes and emit escalation events (Lot 4).
      operationId: cronDisputeSlaCheckPost
      description: |
        Same as `GET /api/cron/dispute-sla-check`.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Counters from the SLA-check tick.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronDisputeSlaResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/cron/outbox-maintenance:
    get:
      tags:
        - cron
      summary: Hourly maintenance of `bot_event_outbox` (poison-pill + cleanup + stats).
      operationId: cronOutboxMaintenanceGet
      description: |
        Schedule: hourly (`0 * * * *`) via Netlify scheduled function
        `outbox-maintenance-cron`.

        Three jobs:
          1. **Poison-pill**: pending events older than
             `OUTBOX_FAILED_AFTER_HOURS` (default 6h) are flipped to
             `status='failed'` with `last_push_error='auto-failed: pending > Nh'`.
             Prevents a corrupted event from being retried forever.
          2. **Cleanup**: delete rows with `status IN ('delivered','failed')`
             older than `OUTBOX_DELETE_AFTER_DAYS` (default 7 days).
          3. **Observability**: counts of pending / delivered-24h /
             failed-24h, age of oldest pending, and delivery latency
             percentiles (p50/p95/p99/max) over the last 24h. Sample capped
             at 10 000 rows.

        Auth: `Authorization: Bearer <CRON_SECRET>` header OR
        `?secret=<CRON_SECRET>` query string. Both GET and POST accepted.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Maintenance tick summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronOutboxMaintenanceResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - cron
      summary: Hourly maintenance of `bot_event_outbox` (poison-pill + cleanup + stats).
      operationId: cronOutboxMaintenancePost
      description: |
        Same as `GET /api/cron/outbox-maintenance`.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Maintenance tick summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronOutboxMaintenanceResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/cron/overrun-check:
    get:
      tags:
        - cron
      summary: Server-side fallback for run-of-show overrun escalation (Lot 6).
      operationId: cronOverrunCheckGet
      description: |
        Schedule: every 2 minutes (`*/2 * * * *`) via Netlify scheduled
        function `overrun-watcher-cron`. Run-of-show Lot 6 (timing/drift).

        Cross-tenant scan via `supabaseAdmin` of every `event_runs` row
        with `status='live'`. For each, fetches live `event_segments` with
        `started_at IS NOT NULL` and `duration_min IS NOT NULL`; if
        `(now - planned_end) >= 5 min`, inserts a `severity='urgent'` cue
        in `event_cues` with body `OVERRUN: "<title>" en depassement de 5min`.

        Idempotence: `dedup_key = auto-overrun:{runId}:{segId}`. A partial
        unique index `uq_event_cues_dedup_key` guarantees at most one cue
        per key. A `23505` conflict (client `useOverrunWatcher` already
        wrote it, or a previous tick did) increments `deduped` and is not
        an error.

        Soft time budget: 20s. If exceeded, the loop breaks and
        `truncated_by_time_budget=true` is reported; the rest is picked up
        2 min later. Netlify scheduled functions cap at 30s.

        Auth: `Authorization: Bearer <CRON_SECRET>` header OR
        `?secret=<CRON_SECRET>` query string. Both GET and POST accepted.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Overrun-check tick summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronOverrunCheckResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - cron
      summary: Server-side fallback for run-of-show overrun escalation (Lot 6).
      operationId: cronOverrunCheckPost
      description: |
        Same as `GET /api/cron/overrun-check`.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Overrun-check tick summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronOverrunCheckResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/cron/web-push-dispatch:
    get:
      tags:
        - cron
      summary: Dispatch Web Push notifications from `bot_event_outbox` to the /admin PWA.
      operationId: cronWebPushDispatchGet
      description: |
        Schedule: every minute (`* * * * *`) via Netlify scheduled
        function `web-push-dispatcher-cron`. Max end-to-end latency
        ≈ 2 minutes (1 tick to pick up + 1 tick to send if cold).

        Reads `bot_event_outbox` in read-only mode (the `.status` column
        belongs to the Discord bot consumer — this dispatcher must never
        touch it). Per-recipient tracking lives in `web_push_deliveries`
        with `UNIQUE(outbox_event_id, subscription_id)` for idempotence.

        Recipient resolution:
          - Default: `tenant_staff(tenant_id)` + cross-tenant
            `staff.is_pole_admin=true`, then map to `auth_user_id`
            (active, non-deleted only).
          - For `event_segment.transitioned` (match → live), audience is
            narrowed to casters assigned to the match via
            `cast_assignments` / `cast_members`.
          - Opt-out: `notification_prefs(user_id, event_type, enabled=false)`
            excludes the user. Absent row = opted-in (opt-out model).

        Retry policy:
          - Transient/5xx: row stays `failed`, `attempts` is incremented.
            Stops retrying once `attempts >= 5`.
          - 410/404: subscription is dead — final `status='expired'` is
            written, then the `push_subscriptions` row is deleted (CASCADE
            removes child `web_push_deliveries`).

        Env requirements: `NEXT_PUBLIC_VAPID_PUBLIC_KEY` and
        `VAPID_PRIVATE_KEY` (optional `VAPID_SUBJECT`). If missing, the
        route returns `500` with `code='VAPID_NOT_CONFIGURED'`.

        Configurable via `WEB_PUSH_BATCH_LIMIT` (default 200) and
        `WEB_PUSH_WINDOW_HOURS` (default 24). Soft time budget: 8s. An
        in-process mutex (`_dispatcherInFlight`) prevents overlap inside
        the same Netlify worker; a concurrent tick returns
        `{ success: true, skipped: 'in_flight' }`.

        Auth: `Authorization: Bearer <CRON_SECRET>` header OR
        `?secret=<CRON_SECRET>` query string. Both GET and POST accepted.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Dispatch tick summary or in-flight skip notice.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CronWebPushDispatchResult"
                  - $ref: "#/components/schemas/CronWebPushInFlightSkip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: |
            Server error. Special case: when VAPID env vars are missing the
            response carries `code='VAPID_NOT_CONFIGURED'`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - cron
      summary: Dispatch Web Push notifications from `bot_event_outbox` to the /admin PWA.
      operationId: cronWebPushDispatchPost
      description: |
        Same as `GET /api/cron/web-push-dispatch`.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Dispatch tick summary or in-flight skip notice.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CronWebPushDispatchResult"
                  - $ref: "#/components/schemas/CronWebPushInFlightSkip"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: |
            Server error. Special case: when VAPID env vars are missing the
            response carries `code='VAPID_NOT_CONFIGURED'`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/cron/sync-game-heroes:
    get:
      tags:
        - cron
      summary: Sync the global LoL/Dota 2 hero pool from Data Dragon + OpenDota.
      operationId: cronSyncGameHeroesGet
      description: |
        Schedule: once per day at 04:00 UTC (`0 4 * * *`) via Netlify
        scheduled function `sync-game-heroes-cron`. Fetches the current
        Riot Data Dragon champion list (LoL) and the OpenDota hero list
        (Dota 2), then upserts each row into `public.game_heroes` keyed by
        `(game, external_id)`. Global pool — no tenant scoping.

        Returns `200` on full success, `207` when one upstream sync
        failed and the other succeeded (partial success).

        Heartbeat: upserts `site_settings.last_cron_sync_game_heroes_at`
        with the run's finishedAt ISO timestamp.

        Auth: `Authorization: Bearer <CRON_SECRET>` header OR
        `?secret=<CRON_SECRET>` query string. Both GET and POST accepted.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Sync summary — both LoL and Dota 2 succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronSyncGameHeroesResult"
        "207":
          description: Partial success — at least one upstream sync failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronSyncGameHeroesResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags:
        - cron
      summary: Sync the global LoL/Dota 2 hero pool from Data Dragon + OpenDota.
      operationId: cronSyncGameHeroesPost
      description: |
        Same as `GET /api/cron/sync-game-heroes`.
      security:
        - CronSecret: []
      responses:
        "200":
          description: Sync summary — both LoL and Dota 2 succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronSyncGameHeroesResult"
        "207":
          description: Partial success — at least one upstream sync failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronSyncGameHeroesResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
