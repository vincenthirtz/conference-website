openapi: 3.1.0
info:
  title: Conference Website API
  version: 1.0.0
  summary: Surface HTTP du site conference-website (bot, admin, public, cron).
  description: |
    Spec OpenAPI 3.1 de toute l'API HTTP servie par `pages/api/*`.

    **Sources de vérité (par ordre de précédence) :**
    1. Les handlers eux-mêmes sous `pages/api/`.
    2. Le contrat humain `docs/BOT_API_CONTRACT.md` (pour `/api/bot/v1/*`).
    3. Cette spec — régénérer à chaque changement de surface.

    **Quatre familles d'endpoints :**
    - `tag:bot` — `/api/bot/v1/*` consommés par le Discord bot. Auth par
      `x-api-key` (per-tenant) + `x-tenant-id` (legacy env fallback).
    - `tag:admin` — `/api/admin/*` gated par session staff Supabase (cookies).
    - `tag:cron` — `/api/cron/*` invoqués par Netlify scheduled functions.
    - `tag:public` — tout le reste, accessible sans auth ou auth utilisateur.
  contact:
    name: conference-website
    url: https://github.com/
  license:
    name: Proprietary
servers:
  - url: https://www.lacotedazurelympique.fr
    description: Production
  - url: http://localhost:3000
    description: Local dev
tags:
  - name: bot/matches
    description: Endpoints bot pour la gestion des matchs (planif, score, dispute).
  - name: bot/teams
    description: Endpoints bot pour la gestion des équipes (membres, captain).
  - name: bot/tournaments
    description: Endpoints bot pour la gestion des tournois et phases.
  - name: bot/scrims
    description: Endpoints bot pour les scrims.
  - name: bot/players
    description: Endpoints bot scoped par Discord user id.
  - name: bot/cast
    description: Endpoints bot pour les assignments de casters.
  - name: bot/events
    description: Outbox d'events bot (pending / ack / handled).
  - name: bot/tenants
    description: Résolution tenant ↔ guild Discord (cross-tenant).
  - name: bot/autocomplete
    description: Endpoints d'autocomplete des slash-commands Discord.
  - name: bot/misc
    description: Autres endpoints bot (twitch, reminders, role-sync, locks, etc.).
  - name: admin/matches
  - name: admin/teams
  - name: admin/tournaments
  - name: admin/stages
  - name: admin/scrims
  - name: admin/events
    description: Run-of-show admin (cues, segments, presence).
  - name: admin/broadcast
  - name: admin/tenants
  - name: admin/users
  - name: admin/content
    description: News, announcements, partners, cast members, etc.
  - name: admin/misc
  - name: cron
  - name: public/teams
  - name: public/tournaments
  - name: public/scrims
  - name: public/news
  - name: public/auth
  - name: public/caster
    description: Endpoints joueurs/casters (auth Bearer).
  - name: public/onboard
  - name: public/misc
components:
  securitySchemes:
    BotApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Bot API key, per-tenant uniquement : le sha256 du header est comparé à
        `tenant_secrets.bot_api_key_hash` et détermine le tenant. Le fallback
        env legacy `BOT_API_KEY` a été retiré pour `/api/bot/v1/*` ; une clé
        inconnue renvoie 401.
    BotTenantId:
      type: apiKey
      in: header
      name: x-tenant-id
      description: |
        UUID du tenant. Informationnel uniquement : la clé per-tenant est
        autoritaire, le header n'est plus requis ni validé (ignoré, et la clé
        gagne en cas de conflit).
    StaffSession:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: |
        Session Supabase staff. Le helper `withStaffRoute(handler, minRole)`
        applique le check de rôle (`owner` > `admin` > `manager` > `caster`).
    PlayerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token Supabase user (joueur, capitaine). Géré par
        `withAuthRoute`. CSRF-immune par construction (header non
        auto-attaché par le navigateur cross-origin).
    CronSecret:
      type: apiKey
      in: header
      name: x-cron-secret
      description: |
        Token partagé entre Netlify scheduled functions et l'API. Vérifié
        par `requireCronAuth()`. Routes idempotentes côté serveur.
  parameters:
    XApiKey:
      $ref: "#/components/parameters/__hoist_BotApiKey"
    __hoist_BotApiKey:
      name: x-api-key
      in: header
      required: true
      schema:
        type: string
      description: Bot API key (per-tenant ou env legacy).
    XTenantId:
      name: x-tenant-id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: UUID du tenant — requis avec l'env legacy uniquement.
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: |
        Clé d'idempotence client. Pour un même couple (route, clé), la
        réponse est rejouée 24h. Voir `BOT_API_CONTRACT.md` §Idempotency.
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScrimId:
      name: scrimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SegId:
      name: segId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DiscordUserId:
      name: discordUserId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9]{17,20}$
  responses:
    BadRequest:
      description: Requête invalide (validation zod, JSON mal formé, etc.).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Auth manquante ou invalide (clé, session ou bearer).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authentifié mais rôle/permissions insuffisants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Ressource introuvable (UUID inconnu, route inexistante).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: État incompatible (idempotency mismatch, lock détenu).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate-limit dépassé (par-actor ou par-route).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secondes avant retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Erreur serveur non récupérable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Message lisible côté client.
        code:
          type: string
          description: Code machine (ex. `MISSING_TENANT_ID`, `UNKNOWN_TENANT`).
        details:
          type: object
          additionalProperties: true
      example:
        error: Invalid or missing API key.
        code: MISSING_TENANT_ID
    Ok:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    PlayerPushSubscription:
      type: object
      required:
        - id
        - endpoint
        - created
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        endpoint:
          type: string
          format: uri
        created:
          type: boolean
          description: "true si la subscription vient d'être créée (201), false si mise à jour (200)."
    TwitchTokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
        - token_type
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        scope:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        token_type:
          type: string
    DiscordId:
      type: string
      pattern: ^[0-9]{17,20}$
      description: Snowflake Discord (user, guild, channel, role).
    Tenant:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        slug:
          type: string
        name:
          type: string
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    Team:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: string
          nullable: true
        captainUserId:
          $ref: "#/components/schemas/Uuid"
        discordRoleId:
          allOf:
            - $ref: "#/components/schemas/DiscordId"
          nullable: true
        discordChannelId:
          allOf:
            - $ref: "#/components/schemas/DiscordId"
          nullable: true
        joinable:
          type: boolean
        tenantId:
          $ref: "#/components/schemas/Uuid"
    TeamMember:
      type: object
      required:
        - userId
        - role
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
        battleTag:
          type: string
          nullable: true
        discordUserId:
          allOf:
            - $ref: "#/components/schemas/DiscordId"
          nullable: true
        role:
          type: string
          enum:
            - captain
            - member
            - substitute
            - coach
        joinedAt:
          $ref: "#/components/schemas/Timestamp"
    Match:
      type: object
      required:
        - id
        - status
        - team1Id
        - team2Id
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        tournamentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        scrimId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        stageId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        team1Id:
          $ref: "#/components/schemas/Uuid"
        team2Id:
          $ref: "#/components/schemas/Uuid"
        team1Score:
          type: integer
          nullable: true
        team2Score:
          type: integer
          nullable: true
        winnerTeamId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        status:
          type: string
          enum:
            - pending
            - scheduled
            - ongoing
            - finished
            - disputed
            - forfeit
            - cancelled
        scheduledAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        lobbyInfo:
          type: object
          nullable: true
          properties:
            host:
              type: string
            password:
              type: string
        streamUrl:
          type: string
          nullable: true
        discordThreadId:
          allOf:
            - $ref: "#/components/schemas/DiscordId"
          nullable: true
    Tournament:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - draft
            - published
            - ongoing
            - finished
            - archived
        startsAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        endsAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        prizePoolEur:
          type: integer
          nullable: true
    Stage:
      type: object
      required:
        - id
        - tournamentId
        - name
        - kind
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        tournamentId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        kind:
          type: string
          enum:
            - group
            - swiss
            - single_elim
            - double_elim
            - round_robin
        order:
          type: integer
    Scrim:
      type: object
      required:
        - id
        - status
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - draft
            - open
            - scheduled
            - in_progress
            - finished
            - cancelled
        scheduledAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        teamAId:
          $ref: "#/components/schemas/Uuid"
        teamBId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
    CastAssignment:
      type: object
      required:
        - id
        - matchId
        - casterUserId
        - role
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        matchId:
          $ref: "#/components/schemas/Uuid"
        casterUserId:
          $ref: "#/components/schemas/Uuid"
        casterDisplayName:
          type: string
        role:
          type: string
          enum:
            - play_by_play
            - color
            - observer
            - director
        confirmedAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
    PendingEvent:
      type: object
      required:
        - id
        - eventId
        - eventName
        - payload
        - tenantId
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        eventId:
          $ref: "#/components/schemas/Uuid"
        eventName:
          type: string
          example: match.starting
        tenantId:
          $ref: "#/components/schemas/Uuid"
        payload:
          type: object
          additionalProperties: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    EventRun:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - draft
            - scheduled
            - live
            - done
        startedAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        endedAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
    EventSegment:
      type: object
      required:
        - id
        - runId
        - ord
        - type
        - status
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        runId:
          $ref: "#/components/schemas/Uuid"
        ord:
          type: integer
        type:
          type: string
          enum:
            - match
            - intermission
            - intro
            - outro
            - interview
            - segment
        title:
          type: string
        durationMin:
          type: integer
        matchId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        status:
          type: string
          enum:
            - upcoming
            - live
            - done
            - skipped
    AutocompleteResult:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            type: object
            required:
              - value
              - label
            properties:
              value:
                type: string
              label:
                type: string
    BotEventOutboxRow:
      type: object
      required:
        - id
        - eventId
        - eventName
        - tenantId
        - payload
      properties:
        id:
          type: integer
        eventId:
          $ref: "#/components/schemas/Uuid"
        eventName:
          type: string
        tenantId:
          $ref: "#/components/schemas/Uuid"
        payload:
          type: object
          additionalProperties: true
        pushAttempts:
          type: integer
        lastPushError:
          type: string
          nullable: true
        lastPushAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    BracketView:
      type: object
      required:
        - tournamentId
        - stages
      properties:
        tournamentId:
          $ref: "#/components/schemas/Uuid"
        tournamentName:
          type: string
        stages:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              name:
                type: string
              slug:
                type: string
                nullable: true
              stageType:
                type: string
              orderIndex:
                type: integer
              matches:
                type: array
                items:
                  type: object
                  additionalProperties: true
              standings:
                type: array
                items:
                  type: object
                  additionalProperties: true
    Invitation:
      type: object
      required:
        - id
        - status
        - type
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        userId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        teamId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        type:
          type: string
          enum:
            - invite
            - join_request
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - cancelled
        comment:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        processedAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
    LeaderboardEntry:
      type: object
      required:
        - teamId
        - teamName
        - wins
        - losses
      properties:
        rank:
          type: integer
        teamId:
          $ref: "#/components/schemas/Uuid"
        teamName:
          type: string
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        points:
          type: number
    Lock:
      type: object
      properties:
        acquired:
          type: boolean
        released:
          type: boolean
        currentHolder:
          type: string
          nullable: true
        expiresAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
    PlayerAction:
      type: object
      required:
        - action
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        actorAuthUserId:
          $ref: "#/components/schemas/Uuid"
        actorDiscordUserId:
          $ref: "#/components/schemas/DiscordId"
        action:
          type: string
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
        targetAuthUserId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        payload:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    Reminder:
      type: object
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          enum:
            - match_checkin
            - tournament_j1
            - cast_briefing
        id:
          type: string
        discordUserId:
          $ref: "#/components/schemas/DiscordId"
        discordUsername:
          type: string
          nullable: true
        matchId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        tournamentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        assignmentId:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        scheduledAt:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        payload:
          type: object
          additionalProperties: true
    TenantConfigEntry:
      type: object
      required:
        - tenant
        - guildId
      properties:
        guildId:
          $ref: "#/components/schemas/DiscordId"
        isPrimary:
          type: boolean
        tenant:
          $ref: "#/components/schemas/Tenant"
        config:
          type: object
          additionalProperties: true
          description: |
            Tenant Discord config (channel ids, role ids, forum tag ids, etc.).
            Voir `tenant_discord_config` pour la liste exhaustive.
    VetoState:
      type: object
      required:
        - matchId
        - format
        - flow
        - steps
      properties:
        matchId:
          $ref: "#/components/schemas/Uuid"
        format:
          type: string
        team1Id:
          $ref: "#/components/schemas/Uuid"
        team2Id:
          $ref: "#/components/schemas/Uuid"
        team1Name:
          type: string
          nullable: true
        team2Name:
          type: string
          nullable: true
        flow:
          type: array
          items:
            type: object
            additionalProperties: true
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
        currentStepIndex:
          type: integer
        isComplete:
          type: boolean
        pickedMaps:
          type: array
          items:
            type: object
            additionalProperties: true
    AdminMatchDetail:
      type: object
      description: Admin view of a match (includes dispute fields, bracket links, audit).
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        tournament_id:
          type: string
          format: uuid
          nullable: true
        stage_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - pending
            - ongoing
            - finished
            - cancelled
            - postponed
            - walkover
            - disputed
        is_bye:
          type: boolean
          nullable: true
        match_format:
          type: string
          nullable: true
        round_name:
          type: string
          nullable: true
        round_number:
          type: integer
          nullable: true
        bracket_side:
          type: string
          enum:
            - wb
            - lb
            - final
            - none
          nullable: true
        group_key:
          type: string
          nullable: true
        team1_id:
          type: string
          format: uuid
          nullable: true
        team2_id:
          type: string
          format: uuid
          nullable: true
        team1_score:
          type: integer
          nullable: true
        team2_score:
          type: integer
          nullable: true
        winner_team_id:
          type: string
          format: uuid
          nullable: true
        forfeit_team_id:
          type: string
          format: uuid
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        stream_url:
          type: string
          nullable: true
        replay_url:
          type: string
          nullable: true
        lobby_code:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        next_match_win_id:
          type: string
          format: uuid
          nullable: true
        next_match_win_slot:
          type: integer
          enum:
            - 1
            - 2
          nullable: true
        next_match_lose_id:
          type: string
          format: uuid
