        - bot/misc
      summary: Distributed lock claim / release pour le bot Discord.
      operationId: botLockOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - holder
              properties:
                holder:
                  type: string
                  maxLength: 100
                ttlSeconds:
                  type: integer
