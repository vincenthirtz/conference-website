                  matchId:
                    $ref: "#/components/schemas/Uuid"
                  status:
                    type: string
                  openedAt:
                    allOf:
                      - $ref: "#/components/schemas/Timestamp"
                    nullable: true
                  reports:
                    type: array
                    items:
                      type: object
                      properties:
                        teamId:
                          $ref: "#/components/schemas/Uuid"
                        teamName:
                          type: string
                          nullable: true
                        submittedBy:
                          type: string
                          nullable: true
                        scoreA:
                          type: integer
                        scoreB:
                          type: integer
                        submittedAt:
                          allOf:
                            - $ref: "#/components/schemas/Timestamp"
                          nullable: true
                  staffNote:
                    type: string
                    nullable: true
                  resolution:
                    type: object
                    nullable: true
                    properties:
                      resolvedAt:
                        $ref: "#/components/schemas/Timestamp"
                      decidedScoreA:
                        type: integer
                        nullable: true
                      decidedScoreB:
                        type: integer
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
