      operationId: verifyOnboardEmail
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
      responses:
        "302":
          description: Redirige vers /onboard/invite-bot/[id].
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/onboard/status/{id}:
