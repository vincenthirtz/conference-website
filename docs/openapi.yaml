            - DRAFT_NOT_IN_PROGRESS
            - DRAFT_NOT_PENDING
            - STEP_OUT_OF_ORDER
            - HERO_NOT_FOUND
            - HERO_WRONG_GAME
            - HERO_ALREADY_BANNED
            - HERO_ALREADY_PICKED
            - HERO_FEARLESS_BLOCKED
            - PICK_TIMER_INVALID
