              schema:
                $ref: "#/components/schemas/PlayerPushSubscription"
        "201":
          description: Subscription créée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerPushSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
