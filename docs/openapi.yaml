    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Rotate bot API key + webhook secret for a tenant.
      description: |
        Requires `owner` role. Generates new 64-char hex bot API key and webhook
        secret, sha256-hashes the API key for storage, returns the **plain**
        values only once. The plain secrets are never persisted in audit logs.
        Rate-limited 5/min per IP.
      operationId: adminRotateTenantSecrets
      tags:
        - admin/tenants
      security:
        - StaffSession: []
      responses:
        "200":
          description: Rotated. Plain secrets returned once.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenantId
                  - botApiKey
                  - botWebhookSecret
                  - rotatedAt
                properties:
                  tenantId:
                    type: string
                    format: uuid
                  botApiKey:
                    type: string
                    description: 64-char hex (visible only once).
                  botWebhookSecret:
                    type: string
                    description: 64-char hex (visible only once).
                  rotatedAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
