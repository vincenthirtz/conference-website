  /api/bot/v1/matches/{matchId}/report:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags:
        - bot/matches
      summary: Capitaine soumet le score final d'un match (resoud dispute si accord).
      operationId: botReportMatchScore
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - discordUserId
                - team1Score
                - team2Score
              properties:
                discordUserId:
                  $ref: "#/components/schemas/DiscordId"
                team1Score:
                  type: integer
                  minimum: 0
                  maximum: 99
                team2Score:
                  type: integer
                  minimum: 0
                  maximum: 99
      responses:
        "200":
          description: |
            Report enregistre. Trois etats possibles :
            - `awaiting_opponent` : un seul report, on attend l'autre cote.
            - `finalized` : les deux reports concordent, match finalise.
            - `disputed` : reports divergents, statut passe en disputed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - matchId
                properties:
                  status:
                    type: string
                    enum:
                      - awaiting_opponent
                      - finalized
                      - disputed
                  matchId:
                    $ref: "#/components/schemas/Uuid"
                  scrimId:
                    allOf:
                      - $ref: "#/components/schemas/Uuid"
                    nullable: true
                  mySide:
                    type: integer
                    enum:
                      - 1
                      - 2
                  opponentSide:
                    type: integer
                    enum:
                      - 1
                      - 2
                  team1Score:
                    type: integer
                  team2Score:
                    type: integer
                  winnerTeamId:
                    allOf:
                      - $ref: "#/components/schemas/Uuid"
                    nullable: true
                  myReport:
                    type: object
                    additionalProperties: true
                  opponentReport:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
