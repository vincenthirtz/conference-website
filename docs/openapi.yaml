security:
  - BotApiKey: []
    BotTenantId: []
paths:
  /api/bot/v1/matches/{matchId}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags:
        - bot/matches
      summary: Lecture des metadonnees d'un match (teams, status, scheduled_at).
      operationId: botGetMatchById
      responses:
        "200":
          description: Match trouve.
          content:
            application/json:
              schema:
                type: object
                required:
                  - match
                properties:
                  match:
                    type: object
                    properties:
                      id:
                        $ref: "#/components/schemas/Uuid"
                      status:
                        type: string
                      is_bye:
                        type: boolean
                      scheduled_at:
                        allOf:
                          - $ref: "#/components/schemas/Timestamp"
                        nullable: true
                      match_format:
                        type: string
                        nullable: true
                      tournament_id:
                        allOf:
                          - $ref: "#/components/schemas/Uuid"
                        nullable: true
                      scrim_id:
                        allOf:
                          - $ref: "#/components/schemas/Uuid"
                        nullable: true
                      stage_id:
                        allOf:
                          - $ref: "#/components/schemas/Uuid"
                        nullable: true
                      team1:
                        type: object
                        properties:
                          id:
                            $ref: "#/components/schemas/Uuid"
                          name:
                            type: string
                          short_name:
                            type: string
                            nullable: true
                      team2:
                        type: object
                        properties:
                          id:
                            $ref: "#/components/schemas/Uuid"
                          name:
                            type: string
                          short_name:
                            type: string
                            nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags:
        - bot/matches
