      summary: Create an event_run (draft).
      description: Requires `manager` role.
      operationId: adminCreateEventRun
      tags:
        - admin/events
      security:
        - StaffSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - scheduled_at
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                slug:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                  nullable: true
                scheduled_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Event run created (draft).
          content:
            application/json:
              schema:
