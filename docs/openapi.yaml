      description: Requires `manager` role.
      operationId: adminListEventRuns
      tags:
        - admin/events
      security:
        - StaffSession: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - draft
              - live
              - done
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
