                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/BotEventOutboxRow"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/bot/v1/events/{id}/ack:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: PK numerique de bot_event_outbox.
    post:
      tags:
        - bot/events
      summary: Le bot acknowledge la livraison d'un event. Idempotent. Cross-tenant.
      operationId: botAckEvent
      security:
        - BotApiKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Event marque delivered (ou deja delivered).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: integer
                  status:
                    type: string
                    enum:
                      - delivered
                  alreadyAcked:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bot/v1/events/handled:
    post:
      tags:
        - bot/events
      summary: Le bot claim un event a traiter (INSERT ON CONFLICT DO NOTHING).
      operationId: botClaimEventHandled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventId
              properties:
                eventId:
                  $ref: "#/components/schemas/Uuid"
                source:
                  type: string
                  maxLength: 32
      responses:
        "200":
          description: Event deja claim (wasNew=false).
          content:
            application/json:
              schema:
                type: object
                required:
                  - wasNew
                properties:
                  wasNew:
                    type: boolean
                    enum:
                      - false
                  handledAt:
                    allOf:
                      - $ref: "#/components/schemas/Timestamp"
                    nullable: true
        "201":
          description: Event claim pour la premiere fois (wasNew=true).
          content:
            application/json:
              schema:
                type: object
                required:
                  - wasNew
                properties:
                  wasNew:
                    type: boolean
                    enum:
                      - true
                  handledAt:
                    allOf:
                      - $ref: "#/components/schemas/Timestamp"
                    nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
