          $ref: "#/components/schemas/DraftFlow"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/MatchDraftStep"
        nextStepIndex:
          type: integer
          description: Zero-based index in `flow.steps` of the next step to play, or -1 once completed.
        bannedHeroes:
          type: array
          items:
            $ref: "#/components/schemas/GameHero"
        team1Picks:
          type: array
          items:
            $ref: "#/components/schemas/GameHero"
        team2Picks:
          type: array
          items:
            $ref: "#/components/schemas/GameHero"
    MatchDraftStateResponse:
      type: object
      required:
        - draft
      properties:
        draft:
          oneOf:
            - $ref: "#/components/schemas/DraftState"
            - type: "null"
        teams:
          type: object
          description: |
            Resolved team names for the spectator UI auto-title (Lot 5
            polish). Public endpoint only — admin GET omits this field.
          properties:
            team1Name:
              type: string
              nullable: true
            team2Name:
              type: string
              nullable: true
    DeleteMatchDraftResponse:
      type: object
      required:
        - success
        - deletedDraftId
        - deletedSteps
      properties:
        success:
          type: boolean
          enum:
            - true
        deletedDraftId:
          $ref: "#/components/schemas/Uuid"
        deletedSteps:
          type: integer
          minimum: 0
          description: Count of match_draft_steps rows removed.
    BotInitMatchDraftResponse:
      type: object
      description: |
        Response shape of `POST /api/bot/v1/matches/:matchId/drafts`.
        The bot uses `captains[].discordUserId` to DM each captain with
        the captain UI link. `null` values mean the captain has not
        linked Discord yet — the bot falls back to a channel post.
      required:
        - success
        - draft
        - captains
      properties:
        success:
          type: boolean
          enum:
            - true
        draft:
          $ref: "#/components/schemas/DraftState"
        captains:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            required:
              - teamSlot
            properties:
              teamSlot:
                type: integer
                enum:
                  - 1
                  - 2
              teamId:
                $ref: "#/components/schemas/Uuid"
              teamName:
                type: string
                nullable: true
              authUserId:
                $ref: "#/components/schemas/Uuid"
              discordUserId:
                type: string
                nullable: true
                description: Snowflake or null when the captain hasn't linked Discord.
    DraftAutoPickResponse:
      type: object
      description: |
        Return shape of `POST /api/admin/matches/.../auto-pick`. When the
        current step's deadline is still in the future (or the step is
        already committed, or the draft is not in_progress), the engine
        is a no-op and the response carries `autoPicked: false` only.
      required:
        - autoPicked
      properties:
        autoPicked:
          type: boolean
        stepNumber:
          type: integer
          minimum: 1
          description: Present when autoPicked = true.
        heroId:
          $ref: "#/components/schemas/Uuid"
        draft:
          $ref: "#/components/schemas/DraftState"
    CronDraftAutoPickResult:
      type: object
      description: |
        Tick summary returned by `/api/cron/draft-auto-pick`. `success` is
        false only if at least one individual draft errored; per-draft
        errors are caught so one bad row never blocks the rest.
      required:
        - success
        - scanned
        - autoPicked
        - errors
      properties:
        success:
          type: boolean
        scanned:
          type: integer
          minimum: 0
          description: |
            Number of distinct drafts whose current step deadline_at was
            in the past at the start of the tick.
        autoPicked:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
