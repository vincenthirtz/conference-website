# Configuration de la Supabase LOCALE et jetable (e2e — voir
# docs/E2E-LOCAL-SUPABASE.md). Aucune valeur de production ici.
project_id = "conference-website"

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[auth]
site_url = "http://localhost:3000"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[studio]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
