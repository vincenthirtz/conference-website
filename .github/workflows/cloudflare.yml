# Site sur Cloudflare (Worker « owwomenscup », OpenNext) — docs/CLOUDFLARE.md.
#
# Chaque mise à jour de `work` construit le site avec OpenNext, le déploie sur
# le Worker, pose ses secrets et contrôle le résultat
# (scripts/cloudflare-check.mjs). Netlify continue de servir owwomenscup.fr
# en parallèle jusqu'à la bascule du domaine : avant, le Worker n'est servi
# que sur https://owwomenscup.owwomenscup.workers.dev (noindex).
#
# Environnement GitHub : « cloudflare-trial » (clés Supabase et NEXT_PUBLIC_*
# de l'essai) jusqu'à la bascule, où il est remplacé par un environnement de
# production complet (checklist dans docs/CLOUDFLARE.md).

name: cloudflare

on:
  push:
    branches: [work]
    paths-ignore: ['tests/**', 'docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cloudflare-trial
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Lue au build (pré-rendu) puis posée comme secret du Worker.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_API_REMOTE_PREFIXES: ${{ vars.NEXT_PUBLIC_API_REMOTE_PREFIXES }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      # Absentes avant la bascule (pas de statistiques ni de PWA sur l'adresse
      # technique) ; à poser dans l'environnement de production.
      NEXT_PUBLIC_ENABLE_PWA: ${{ vars.NEXT_PUBLIC_ENABLE_PWA }}
      NEXT_PUBLIC_ANALYTICS_HOST: ${{ vars.NEXT_PUBLIC_ANALYTICS_HOST }}
      NEXT_PUBLIC_ANALYTICS_PROVIDER: ${{ vars.NEXT_PUBLIC_ANALYTICS_PROVIDER }}
      NEXT_PUBLIC_ANALYTICS_SITE_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_SITE_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      # Hors package.json tant que Netlify construit aussi le site : ses builds
      # n'ont pas à installer wrangler/workerd. Versions figées ici.
      - name: Outils Cloudflare
        run: npm install --no-save --no-audit --no-fund @opennextjs/cloudflare@1.20.13 wrangler@4.153.0

      - name: Bucket R2 du cache des pages (créé s'il manque)
        run: |
          if npx wrangler r2 bucket list 2>/dev/null | grep -q 'owwomenscup-opennext-cache'; then
            echo 'Bucket déjà présent.'
          else
            npx wrangler r2 bucket create owwomenscup-opennext-cache
          fi

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build

      - name: En-têtes des fichiers statiques
        run: cat cloudflare/_headers >> .open-next/assets/_headers

      - name: Déploiement
        run: npx opennextjs-cloudflare deploy

      # Seuls les secrets présents dans l'environnement GitHub sont posés ;
      # les noms (jamais les valeurs) vont dans le résumé.
      - name: Secrets du Worker
        env:
          EDGE_PROXY_SECRET: ${{ secrets.EDGE_PROXY_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          node -e "
            const names = ['SUPABASE_SERVICE_ROLE_KEY', 'EDGE_PROXY_SECRET', 'CRON_SECRET', 'REVALIDATE_SECRET'];
            const s = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require('fs').writeFileSync('secrets.json', JSON.stringify(s));
            const missing = names.filter((n) => !s[n]);
            const lines = ['## Secrets du Worker', '', 'Posés : ' + Object.keys(s).join(', '), '', 'Absents : ' + (missing.join(', ') || 'aucun'), ''];
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.log(lines.join(' | '));
          "
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Adresse workers.dev
        id: url
        run: |
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // empty')
          test -n "$sub"
          echo "url=https://owwomenscup.$sub.workers.dev" >> "$GITHUB_OUTPUT"
          echo "## Adresse du Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "https://owwomenscup.$sub.workers.dev" >> "$GITHUB_STEP_SUMMARY"

      - name: Navigateur
        run: npx playwright install --with-deps chromium

      - name: Contrôles
        run: |
          sleep 15
          node scripts/cloudflare-check.mjs "${{ steps.url.outputs.url }}"
