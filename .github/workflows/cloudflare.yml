# Site sur Cloudflare (Worker « owwomenscup », OpenNext) — docs/CLOUDFLARE.md.
#
# Chaque mise à jour de `work` construit le site avec OpenNext, le déploie sur
# le Worker qui sert owwomenscup.fr (depuis la bascule du 2026-10-28), pose
# ses secrets et contrôle le résultat sur https://owwomenscup.fr
# (scripts/cloudflare-check.mjs).
#
# Environnement GitHub « cloudflare-production » : clés Supabase, secrets du
# Worker, NEXT_PUBLIC_* du site. Sa variable CLOUDFLARE_LIVE (« 1 » depuis la
# bascule) allume les statistiques et la PWA au build.
#
# OpenNext et wrangler sont des devDependencies (versions exactes, arbre
# figé par package-lock.json) : `npm ci` les installe, rien n'est résolu au
# moment du déploiement.

name: cloudflare

on:
  push:
    branches: [work]
    # Le Worker temps réel (realtime/) a son propre workflow (realtime.yml).
    paths-ignore:
      - 'tests/**'
      - 'docs/**'
      - '**/*.md'
      - 'realtime/**'
      - 'scripts/realtime-check.mjs'
      - '.github/workflows/realtime.yml'
      # Sauvegarde nocturne de la base (db-backup.yml) : rien à redéployer.
      - 'scripts/db-backup-*'
      - '.github/workflows/db-backup.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Lue au build (pré-rendu) puis posée comme secret du Worker.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_API_REMOTE_PREFIXES: ${{ vars.NEXT_PUBLIC_API_REMOTE_PREFIXES }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      # Adresse publique des fichiers (R2, docs/R2-MEDIA.md). Vide = Supabase.
      NEXT_PUBLIC_MEDIA_BASE_URL: ${{ vars.NEXT_PUBLIC_MEDIA_BASE_URL }}
      # Temps réel des écrans (docs/REALTIME-DO.md) : « cloudflare » = salons
      # du Worker owwomenscup-realtime. Vide = Supabase Realtime.
      NEXT_PUBLIC_REALTIME_BACKEND: ${{ vars.NEXT_PUBLIC_REALTIME_BACKEND }}
      # Vides tant que CLOUDFLARE_LIVE n'est pas « 1 » (cf. en-tête).
      NEXT_PUBLIC_ENABLE_PWA: ${{ vars.CLOUDFLARE_LIVE == '1' && vars.NEXT_PUBLIC_ENABLE_PWA || '' }}
      NEXT_PUBLIC_ANALYTICS_HOST: ${{ vars.CLOUDFLARE_LIVE == '1' && vars.NEXT_PUBLIC_ANALYTICS_HOST || '' }}
      NEXT_PUBLIC_ANALYTICS_PROVIDER: ${{ vars.CLOUDFLARE_LIVE == '1' && vars.NEXT_PUBLIC_ANALYTICS_PROVIDER || '' }}
      NEXT_PUBLIC_ANALYTICS_SITE_ID: ${{ vars.CLOUDFLARE_LIVE == '1' && vars.NEXT_PUBLIC_ANALYTICS_SITE_ID || '' }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Bucket R2 du cache des pages (créé s'il manque)
        run: |
          if npx wrangler r2 bucket list 2>/dev/null | grep -q 'owwomenscup-opennext-cache'; then
            echo 'Bucket déjà présent.'
          else
            npx wrangler r2 bucket create owwomenscup-opennext-cache
          fi

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build

      - name: En-têtes des fichiers statiques
        run: cat cloudflare/_headers >> .open-next/assets/_headers

      - name: Déploiement
        run: npx opennextjs-cloudflare deploy

      # Seuls les secrets présents dans l'environnement GitHub sont posés ;
      # les noms (jamais les valeurs) vont dans le résumé.
      - name: Secrets du Worker
        env:
          EDGE_PROXY_SECRET: ${{ secrets.EDGE_PROXY_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          node -e "
            const names = ['SUPABASE_SERVICE_ROLE_KEY', 'EDGE_PROXY_SECRET', 'CRON_SECRET', 'REVALIDATE_SECRET'];
            const s = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require('fs').writeFileSync('secrets.json', JSON.stringify(s));
            const missing = names.filter((n) => !s[n]);
            const lines = ['## Secrets du Worker', '', 'Posés : ' + Object.keys(s).join(', '), '', 'Absents : ' + (missing.join(', ') || 'aucun'), ''];
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.log(lines.join(' | '));
          "
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Navigateur
        run: npx playwright install --with-deps chromium

      # Le site en production lui-même (workers.dev est coupé, wrangler.jsonc) ;
      # vérifie aussi les redirections www et http://.
      - name: Contrôles
        run: |
          sleep 15
          node scripts/cloudflare-check.mjs https://owwomenscup.fr
