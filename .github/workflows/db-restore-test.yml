# Essai de restauration d'une sauvegarde de la base — docs/SAUVEGARDES.md.
#
# Une sauvegarde qu'on n'a jamais restaurée ne prouve rien. Ici, sur la
# machine jetable de GitHub : téléchargement d'une sauvegarde depuis R2
# (db-backup.yml), démarrage d'un Supabase local (CLI, Docker), restauration
# selon la procédure officielle de Supabase, puis comparaison table par table
# du nombre de lignes avec la sauvegarde (scripts/db-restore-verify.mjs).
# Tout disparaît avec la machine ; le résumé ne contient que des nombres.
# Ensuite, la répétition de la copie vers un D1 jetable (lot 5 de docs/D1-MIGRATION.md).
# À la main seulement (switch_rehearsal) : la répétition chronométrée de la bascule et du
# retour arrière (lot 5c), tout sur cette machine.
#
# Le 5 de chaque mois, et à la main (choix de la date possible).

name: db-restore-test

on:
  schedule:
    - cron: '47 3 5 * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Sauvegarde à restaurer (AAAA-MM-JJ) ; vide = la plus récente'
        required: false
      auth_trial:
        description: 'Essayer ensuite les migrations du lot 4 de Better Auth (scripts/db-auth-trial.mjs)'
        type: boolean
        default: false
      d1_copy:
        description: 'Répéter ensuite la copie vers un D1 jetable (lot 5 de docs/D1-MIGRATION.md) ; toujours faite le 5 du mois'
        type: boolean
        default: false
      d1_photo:
        description: 'Copier ensuite cette sauvegarde dans la VRAIE base D1 owwomenscup-db (lot 5b, photo de la nuit)'
        type: boolean
        default: false
      switch_rehearsal:
        description: 'Répéter la bascule et le retour arrière, chronométrés, sur cette machine (lot 5c) : copie vers un D1 local, écritures, retour dans un 2e Postgres'
        type: boolean
        default: false
  # La photo de la nuit (db-d1-photo.yml) appelle ce workflow (sans la répétition de la bascule).
  workflow_call:
    inputs:
      day:
        type: string
        required: false
      auth_trial:
        type: boolean
        default: false
      d1_copy:
        type: boolean
        default: false
      d1_photo:
        type: boolean
        default: false
      switch_rehearsal:
        type: boolean
        default: false

concurrency:
  group: db-restore-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: owwomenscup-backups
      LOCAL_DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Lot 5c : la base du retour arrière, créée dans le même Supabase jetable.
      ROLLBACK_DB: postgresql://postgres:postgres@127.0.0.1:54322/rollback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Téléchargement de la sauvegarde
        env:
          DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail
          if [ -n "${DAY:-}" ]; then
            days="$DAY"
          else
            days="$(for i in 0 1 2 3; do date -u -d "-$i day" +%Y-%m-%d; done)"
          fi
          for d in $days; do
            if npx wrangler r2 object get "$BUCKET/quotidien/owwc-$d.tar.gz" --file backup.tar.gz --jurisdiction eu --remote >/dev/null 2>&1; then
              echo "Sauvegarde : quotidien/owwc-$d.tar.gz"
              printf -- '- Sauvegarde restaurée : quotidien/owwc-%s.tar.gz\n' "$d" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
          if [ ! -s backup.tar.gz ]; then
            echo '::error::Aucune sauvegarde trouvée dans R2 pour ces dates.'
            exit 1
          fi
          mkdir -p dump
          tar -xzf backup.tar.gz -C dump
          rm backup.tar.gz
          # L'heure de la photo (lot 5b de docs/D1-MIGRATION.md) : celle de la structure,
          # écrite juste avant les données (tar garde l'heure des fichiers).
          echo "PHOTO_DAY=$d" >> "$GITHUB_ENV"
          echo "PHOTO_AT=$(date -u -d "@$(stat -c %Y dump/schema.sql)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # Tables VIDES retirées de l'import : elles n'apportent rien, et
          # certaines tables internes de Supabase (« vector buckets »,
          # partitions de realtime.messages) n'existent pas ou sont interdites
          # d'écriture dans un Supabase local. Une table non vide qui échoue
          # reste, elle, une vraie alerte.
          awk 'BEGIN{end=sprintf("%c.", 92)} pending!=""{if($0==end){pending="";next} print pending; pending=""; incopy=1} incopy{print; if($0==end)incopy=0; next} /^COPY .* FROM stdin;$/{pending=$0; next} {print}' dump/data.sql > dump/data.tmp
          mv dump/data.tmp dump/data.sql
          node scripts/db-backup-check.mjs dump

      # Base jetable : Postgres de Supabase + services qui créent les schémas
      # auth, storage et realtime (comme sur la plateforme). Le reste est coupé.
      - name: Supabase local
        run: |
          set -euo pipefail
          mkdir -p restore
          cd restore
          supabase init
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta,kong,postgrest

      # Procédure officielle (« Restore a Platform Project ») : une seule
      # transaction, déclencheurs coupés pendant l'import des données.
      # DÉPÔT PUBLIC, journaux publics : un message d'erreur de Postgres peut
      # recopier une ligne de données. On n'affiche que l'endroit (début de
      # la commande : table visée) et le message, valeurs masquées.
      - name: Restauration
        run: |
          set -uo pipefail
          if psql \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --quiet \
            --file dump/roles.sql \
            --file dump/schema.sql \
            --command 'SET session_replication_role = replica' \
            --file dump/data.sql \
            --dbname "$LOCAL_DB" > /dev/null 2> restore.err; then
            echo 'Restauration terminée sans erreur.'
            rm -f restore.err
            exit 0
          fi
          first="$(grep -m1 -E 'ERROR:' restore.err || true)"
          file="$(printf '%s' "$first" | sed -nE 's/^psql:([^:]+):([0-9]+):.*/\1/p')"
          line="$(printf '%s' "$first" | sed -nE 's/^psql:([^:]+):([0-9]+):.*/\2/p')"
          if [ -n "$file" ] && [ -f "$file" ]; then
            where="$(head -n "$line" "$file" | grep -E '^(COPY|CREATE|ALTER|GRANT|REVOKE|COMMENT|SELECT|SET|DO) ' | tail -1 | sed -E 's/ \(.*//' | cut -c1-120)"
            echo "::error::Restauration échouée dans $file ligne $line, commande : $where"
          fi
          printf '%s\n' "$first" | sed -E "s/\"[^\"]*\"/\"…\"/g; s/'[^']*'/'…'/g; s/\([^)]*\)=\([^)]*\)/(…)=(…)/g" | cut -c1-300
          rm -f restore.err
          exit 1

      - name: Vérification
        run: node scripts/db-restore-verify.mjs dump "$LOCAL_DB"

      # Les migrations vivent dans le dépôt privé de l'API. Sur la base jetable
      # seulement ; le script n'affiche que des nombres et des oui/non.
      - uses: actions/checkout@v4
        if: ${{ inputs.auth_trial }}
        with:
          repository: vincenthirtz/conference-api
          token: ${{ secrets.API_REPO_DISPATCH_TOKEN }}
          path: api-repo
          sparse-checkout: database/migrations

      - name: Essai des migrations du lot 4
        if: ${{ inputs.auth_trial }}
        run: node scripts/db-auth-trial.mjs "$LOCAL_DB" api-repo/database/migrations

      # Lot 5 de docs/D1-MIGRATION.md : la copie vers D1, répétée sur cette sauvegarde, dans un
      # D1 JETABLE (moteur local de wrangler, sur cette machine : rien n'est écrit sur
      # Cloudflare, la clé est retirée de l'étape). Chaque table est relue et comparée valeur
      # par valeur ; le script n'affiche que des nombres et des noms de tables ou de colonnes.
      - uses: actions/checkout@v4
        if: ${{ inputs.d1_copy || inputs.d1_photo || inputs.switch_rehearsal || github.event_name == 'schedule' }}
        with:
          repository: vincenthirtz/conference-api
          token: ${{ secrets.API_REPO_DISPATCH_TOKEN }}
          path: api-d1

      - name: Dépendances de l'API
        if: ${{ inputs.d1_copy || inputs.d1_photo || inputs.switch_rehearsal || github.event_name == 'schedule' }}
        working-directory: api-d1
        run: npm ci --no-audit --no-fund > /dev/null

      - name: Copie vers D1 (répétition)
        if: ${{ inputs.d1_copy || (github.event_name == 'schedule' && !inputs.d1_photo) }}
        working-directory: api-d1
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: npm run -s db:d1:copy -- --psql "$LOCAL_DB"

      # Lot 5b (accord de la propriétaire du 2026-11-03) : la photo de la nuit, dans la VRAIE
      # base D1 de la lecture dans l'ombre. Vidée, rechargée sans les tables de secrets,
      # vérifiée ; l'heure de la photo n'est posée que si la copie est identique.
      - name: Photo de la nuit dans D1
        if: ${{ inputs.d1_photo }}
        working-directory: api-d1
        run: npm run -s db:d1:copy -- --psql "$LOCAL_DB" --remote --photo-at "$PHOTO_AT" --photo-day "$PHOTO_DAY"

      # Lot 5c de docs/D1-MIGRATION.md : la répétition chronométrée de la bascule et du retour
      # arrière. TOUT reste sur cette machine : D1 LOCAL de wrangler (la clé Cloudflare est
      # retirée des étapes), deux bases dans le Supabase jetable.
      #   1. une 2e base Postgres, `rollback` : la structure de la sauvegarde, sans données ;
      #   2. la copie aller de TOUTES les tables (secrets compris, comme la copie finale du soir
      #      de bascule), dans un D1 local gardé sur disque ;
      #   3. des écritures de tous les jours dans ce D1, par la façade de l'API (équipe, membres,
      #      pièces, booster, meuble, réglage, renommage, suppressions, compteur) ;
      #   4. le retour arrière de ce D1 vers la base `rollback`, relue et comparée valeur par valeur.
      # Les scripts n'affichent que des nombres et des noms ; les durées vont au résumé.
      - name: 'Bascule (répétition) : base Postgres du retour'
        if: ${{ inputs.switch_rehearsal }}
        run: |
          set -uo pipefail
          start=$(date +%s%N)
          psql "$LOCAL_DB" -X -q -v ON_ERROR_STOP=1 -c 'CREATE DATABASE rollback' > /dev/null
          # Ce que Supabase pose dans sa base « postgres » et qu'une base neuve n'a pas : les
          # coquilles des tests de l'API (tests/unit/__helpers__/d1Catalog.ts). Les extensions
          # propres à Supabase (pg_net, vault, statistiques) sont laissées de côté.
          cat > dump/supabase-shell.sql <<'SQL'
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS vault;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql AS 'select null::uuid';
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql AS 'select null::text';
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql AS 'select null::jsonb';
          DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'supabase_realtime') THEN CREATE PUBLICATION supabase_realtime; END IF; END $$;
          SQL
          grep -v -E '^CREATE EXTENSION IF NOT EXISTS "(pg_net|supabase_vault|pg_stat_statements)"' dump/schema.sql > dump/schema-rollback.sql
          if psql "$ROLLBACK_DB" -X --single-transaction --quiet -v ON_ERROR_STOP=1 \
            --file dump/supabase-shell.sql --file dump/schema-rollback.sql > /dev/null 2> rollback-db.err; then
            rm -f rollback-db.err
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            printf '| Base Postgres du retour (structure seule, hors bascule) | %d.%d s |\n' $((ms / 1000)) $(((ms % 1000) / 100)) >> "$RUNNER_TEMP/bascule-durees.md"
            echo 'Base rollback prête.'
            exit 0
          fi
          # Même discrétion que la restauration : l'endroit et le message, valeurs masquées.
          first="$(grep -m1 -E 'ERROR:' rollback-db.err || true)"
          line="$(printf '%s' "$first" | sed -nE 's/^psql:([^:]+):([0-9]+):.*/\2/p')"
          file="$(printf '%s' "$first" | sed -nE 's/^psql:([^:]+):([0-9]+):.*/\1/p')"
          if [ -n "$file" ] && [ -f "$file" ]; then
            where="$(head -n "$line" "$file" | grep -E '^(CREATE|ALTER|GRANT|REVOKE|COMMENT|SELECT|SET|DO) ' | tail -1 | sed -E 's/ \(.*//' | cut -c1-120)"
            echo "::error::Base rollback : échec dans $file ligne $line, commande : $where"
          fi
          printf '%s\n' "$first" | sed -E "s/\"[^\"]*\"/\"…\"/g; s/'[^']*'/'…'/g; s/\([^)]*\)=\([^)]*\)/(…)=(…)/g" | cut -c1-300
          rm -f rollback-db.err
          exit 1

      - name: 'Bascule (répétition) : copie aller vers un D1 local'
        if: ${{ inputs.switch_rehearsal }}
        working-directory: api-d1
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -uo pipefail
          start=$(date +%s%N)
          npm run -s db:d1:copy -- --psql "$LOCAL_DB" --local-dir "$RUNNER_TEMP/d1-bascule"
          status=$?
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          printf '| Copie aller, toutes les tables (D1 local) | %d.%d s |\n' $((ms / 1000)) $(((ms % 1000) / 100)) >> "$RUNNER_TEMP/bascule-durees.md"
          exit $status

      - name: "Bascule (répétition) : écritures d'après la bascule"
        if: ${{ inputs.switch_rehearsal }}
        working-directory: api-d1
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -uo pipefail
          start=$(date +%s%N)
          npm run -s db:d1:rehearsal-writes -- --local-dir "$RUNNER_TEMP/d1-bascule"
          status=$?
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          printf "| Écritures d'après la bascule (façade D1) | %d.%d s |\n" $((ms / 1000)) $(((ms % 1000) / 100)) >> "$RUNNER_TEMP/bascule-durees.md"
          exit $status

      - name: 'Bascule (répétition) : retour arrière vers Postgres'
        if: ${{ inputs.switch_rehearsal }}
        working-directory: api-d1
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -uo pipefail
          start=$(date +%s%N)
          npm run -s db:d1:rollback -- --psql "$ROLLBACK_DB" --local-dir "$RUNNER_TEMP/d1-bascule"
          status=$?
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          printf '| Retour arrière D1 → Postgres, vérification comprise | %d.%d s |\n' $((ms / 1000)) $(((ms % 1000) / 100)) >> "$RUNNER_TEMP/bascule-durees.md"
          exit $status

      - name: 'Bascule (répétition) : durées'
        if: ${{ always() && inputs.switch_rehearsal }}
        run: |
          if [ -s "$RUNNER_TEMP/bascule-durees.md" ]; then
            {
              echo
              echo '### Répétition de la bascule : durée de chaque étape'
              echo
              echo "Processus entiers (démarrage du moteur D1 local compris) ; le détail par phase est dans le rapport de chaque script."
              echo
              echo '| Étape | Durée |'
              echo '|---|---|'
              cat "$RUNNER_TEMP/bascule-durees.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nettoyage
        if: always()
        run: |
          rm -rf dump api-repo api-d1 "$RUNNER_TEMP/d1-bascule"
          (cd restore && supabase stop --no-backup) || true
