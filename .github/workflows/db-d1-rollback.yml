# Le retour arrière D1 → Supabase APRÈS le dégel — docs/D1-SWITCH.md, « Retour arrière ».
# Lancé À LA MAIN seulement, jamais par un horaire ni par un push. Ne sert qu'en cas de problème.
#
# Ce qu'il fait : la vraie base D1 owwomenscup-db (marquée « base principale » par la copie
# finale) est LUE, jamais écrite ; les tables du schéma public de Supabase sont REMPLACÉES par
# son contenu, en une transaction (scripts/d1-rollback.mjs de l'API) ; puis Supabase et D1 sont
# relus et comparés valeur par valeur. Une structure différente, une valeur refusée, une erreur :
# rien ne change dans Supabase. Les tables hors de la carte (auth.*, schémas internes) ne sont
# pas touchées.
#
# Avant de le lancer : écritures de l'API gelées (DB_WRITES_FROZEN = « 1 » en ligne, vérifié
# ici) et D1 encore en service (DB_BACKEND = « d1 », vérifié ici). Après : DB_BACKEND à
# « supabase » sur l'API et le site, puis dégel.
#
# Secret SUPABASE_DB_URL : le même que db-backup.yml (environnement « cloudflare-production »).
# DÉPÔT PUBLIC, journaux publics : le script n'écrit que des nombres, des noms de tables et des
# codes SQLSTATE.

name: db-d1-rollback

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Écrire RETOUR pour remplacer les données de Supabase par celles de D1'
        required: true

# Jamais en même temps qu'une photo, une copie ou un essai de restauration (même groupe).
concurrency:
  group: db-restore-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    env:
      API_URL: https://api.owwomenscup.fr
    steps:
      - name: Confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != 'RETOUR' ]; then
            echo '::error::Écrire RETOUR dans le champ de confirmation.'
            exit 1
          fi

      # Le gel doit être EN LIGNE (sinon D1 bouge pendant la recopie, et des écritures seraient
      # perdues), et D1 encore la base en service (sinon Supabase a repris la main : il ne faut
      # plus l'écraser).
      - name: Écritures gelées, D1 encore en service
        run: |
          set -euo pipefail
          code="$(curl -s -o probe.json -w '%{http_code}' -X POST "$API_URL/api/d1-switch/freeze-probe" -H 'content-type: application/json' -d '{}')"
          if [ "$code" != '503' ] || ! grep -q '"writes_frozen"' probe.json; then
            echo "::error::Les écritures de l'API ne sont pas gelées (réponse $code) : poser DB_WRITES_FROZEN = « 1 » et déployer l'API d'abord."
            exit 1
          fi
          health="$(curl -s "$API_URL/api/health")"
          if ! printf '%s' "$health" | grep -q '"dbBackend":"d1"'; then
            echo '::error::L’API ne dit pas « dbBackend: d1 » : Supabase est déjà en service, rien n’est recopié.'
            exit 1
          fi
          rm -f probe.json
          echo '- Écritures gelées (503 writes_frozen), D1 en service' >> "$GITHUB_STEP_SUMMARY"

      # La version de Node du site (l'API n'a pas de .nvmrc), comme db-d1-switch.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Le script vit dans le dépôt privé de l'API (comme pour db-d1-switch).
      - uses: actions/checkout@v4
        with:
          repository: vincenthirtz/conference-api
          token: ${{ secrets.API_REPO_DISPATCH_TOKEN }}
          path: api-d1

      - name: Dépendances de l'API
        working-directory: api-d1
        run: npm ci --no-audit --no-fund > /dev/null

      - name: psql
        run: psql --version

      - name: Recopie D1 → Supabase, puis vérification
        working-directory: api-d1
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run -s db:d1:rollback -- --psql "$SUPABASE_DB_URL" --remote

      - name: Suite
        if: ${{ success() }}
        run: |
          {
            echo ''
            echo '### Suite (docs/D1-SWITCH.md)'
            echo ''
            echo '- Poser DB_BACKEND = « supabase » sur l’API et sur le site, déployer, contrôler, puis dégeler.'
            echo '- La marque « base principale » reste sur D1 : la photo de la nuit reste en pause.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyage
        if: always()
        run: rm -rf api-d1 probe.json
