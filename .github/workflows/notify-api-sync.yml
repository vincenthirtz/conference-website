name: Notify API sync

# Prévient conference-api qu'il doit se resynchroniser (son workflow sync.yml
# recopie pages/api + la fermeture de leurs imports, typecheck, construit
# l'image, et le serveur la déploie seul). Ses déclencheurs horaire et manuel
# restent le filet si ce message se perd.
#
# Chemins : ceux que scripts/sync-from-website.mjs (côté conference-api)
# recopie ou lit (tsconfig.json pour les alias). Un faux positif ne coûte
# qu'une synchro sans commit.
on:
  push:
    branches: [work]
    paths:
      - 'pages/api/**'
      - 'utils/**'
      - 'lib/**'
      - 'features/**'
      - 'config/**'
      - 'types/**'
      - 'components/**'
      - 'docs/openapi/**'
      - 'scripts/openapi/**'
      - 'scripts/register-ts.mjs'
      - 'scripts/ts-extension-hooks.mjs'
      - 'package.json'
      - 'tsconfig.json'

concurrency:
  group: notify-api-sync
  cancel-in-progress: true

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      # PAT fine-grained « Contents: read and write » sur conference-api.
      # Absent : le job passe sans rien faire (la synchro horaire suffit).
      API_REPO_DISPATCH_TOKEN: ${{ secrets.API_REPO_DISPATCH_TOKEN }}
    steps:
      - if: env.API_REPO_DISPATCH_TOKEN == ''
        run: echo "::notice::secret API_REPO_DISPATCH_TOKEN absent, pas de dispatch (conference-api se synchronise toutes les heures)"
      - if: env.API_REPO_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.API_REPO_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/vincenthirtz/conference-api/dispatches \
            -f event_type=site-updated \
            -f "client_payload[sha]=$SHA"
          echo "conference-api prévenu (site @ ${SHA::9})" >> "$GITHUB_STEP_SUMMARY"
