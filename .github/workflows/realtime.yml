# Temps réel sur Cloudflare (Worker « owwomenscup-realtime », Durable
# Objects) — docs/REALTIME-DO.md.
#
# Déployé seulement quand le Worker change : chaque déploiement redémarre ses
# salons et coupe les connexions des écrans (ils se reconnectent seuls).
# Secrets lus dans l'environnement GitHub « cloudflare-production » :
# REALTIME_NOTIFY_SECRET (notifications de la base), REALTIME_TICKET_SECRET
# (tickets des salons privés, émis par l'API). C'est leur seule source : ce
# workflow les pose sur le Worker PUIS dans Supabase Vault (déclencheurs de la
# base, secret des tickets lu par l'API). Les changer = les régénérer ici et
# relancer ce workflow.

name: realtime

on:
  push:
    branches: [work]
    paths:
      - 'realtime/**'
      - 'scripts/realtime-check.mjs'
      - '.github/workflows/realtime.yml'
  workflow_dispatch:

concurrency:
  group: realtime-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      REALTIME_NOTIFY_SECRET: ${{ secrets.REALTIME_NOTIFY_SECRET }}
      REALTIME_TICKET_SECRET: ${{ secrets.REALTIME_TICKET_SECRET }}
      # Domaine personnalisé du Worker (tableau de bord Cloudflare).
      REALTIME_URL: https://realtime.owwomenscup.fr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Déploiement
        run: npx wrangler deploy --config realtime/wrangler.jsonc

      # Les noms (jamais les valeurs) vont dans le résumé.
      - name: Secrets du Worker
        run: |
          node -e "
            const names = ['REALTIME_NOTIFY_SECRET', 'REALTIME_TICKET_SECRET'];
            const s = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require('fs').writeFileSync('secrets.json', JSON.stringify(s));
            const missing = names.filter((n) => !s[n]);
            const lines = ['## Secrets du Worker temps réel', '', 'Posés : ' + Object.keys(s).join(', '), '', 'Absents : ' + (missing.join(', ') || 'aucun'), ''];
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.log(lines.join(' | '));
            if (missing.length) process.exit(1);
          "
          npx wrangler secret bulk secrets.json --config realtime/wrangler.jsonc
          rm -f secrets.json

      # Mêmes secrets + adresse des salons dans Supabase Vault, par
      # public.realtime_set_config (conference-api, migration
      # add_realtime_notify_triggers.sql) : dès qu'ils y sont, la base prévient
      # les salons. Migration pas encore appliquée → signalé, sans échec.
      - name: Réglages de la base
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
            (async () => {
              const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
              const notifyUrl = process.env.REALTIME_URL + '/notify';
              const r = await fetch(process.env.NEXT_PUBLIC_SUPABASE_URL + '/rest/v1/rpc/realtime_set_config', {
                method: 'POST',
                headers: { apikey: key, authorization: 'Bearer ' + key, 'content-type': 'application/json' },
                body: JSON.stringify({
                  p_notify_url: notifyUrl,
                  p_notify_secret: process.env.REALTIME_NOTIFY_SECRET,
                  p_ticket_secret: process.env.REALTIME_TICKET_SECRET,
                }),
              });
              let err = {};
              if (!r.ok) err = await r.json().catch(() => ({}));
              const missing = r.status === 404 && err.code === 'PGRST202';
              const line = r.ok
                ? 'Base : réglages posés (' + notifyUrl + ', 2 secrets).'
                : missing
                  ? 'Base : migration add_realtime_notify_triggers pas encore appliquée, rien posé.'
                  : 'Base : échec ' + r.status + ' ' + (err.code || '') + ' ' + (err.message || '');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Réglages de la base\n\n' + line + '\n\n');
              console.log(line);
              if (!r.ok && !missing) process.exit(1);
            })();
          "

      - name: Contrôles
        run: |
          sleep 10
          node scripts/realtime-check.mjs "$REALTIME_URL"
