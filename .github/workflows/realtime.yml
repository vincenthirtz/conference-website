# Temps réel sur Cloudflare (Worker « owwomenscup-realtime », Durable
# Objects) — docs/REALTIME-DO.md.
#
# Déployé seulement quand le Worker change : chaque déploiement redémarre ses
# salons et coupe les connexions des écrans (ils se reconnectent seuls).
# Secrets lus dans l'environnement GitHub « cloudflare-production » :
# REALTIME_NOTIFY_SECRET (notifications de la base), REALTIME_TICKET_SECRET
# (tickets des salons privés, émis par l'API).

name: realtime

on:
  push:
    branches: [work]
    paths:
      - 'realtime/**'
      - 'scripts/realtime-check.mjs'
      - '.github/workflows/realtime.yml'
  workflow_dispatch:

concurrency:
  group: realtime-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      REALTIME_NOTIFY_SECRET: ${{ secrets.REALTIME_NOTIFY_SECRET }}
      REALTIME_TICKET_SECRET: ${{ secrets.REALTIME_TICKET_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Déploiement
        run: npx wrangler deploy --config realtime/wrangler.jsonc

      # Les noms (jamais les valeurs) vont dans le résumé.
      - name: Secrets du Worker
        run: |
          node -e "
            const names = ['REALTIME_NOTIFY_SECRET', 'REALTIME_TICKET_SECRET'];
            const s = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require('fs').writeFileSync('secrets.json', JSON.stringify(s));
            const missing = names.filter((n) => !s[n]);
            const lines = ['## Secrets du Worker temps réel', '', 'Posés : ' + Object.keys(s).join(', '), '', 'Absents : ' + (missing.join(', ') || 'aucun'), ''];
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.log(lines.join(' | '));
            if (missing.length) process.exit(1);
          "
          npx wrangler secret bulk secrets.json --config realtime/wrangler.jsonc
          rm -f secrets.json

      - name: Contrôles
        run: |
          sleep 10
          node scripts/realtime-check.mjs https://owwomenscup-realtime.owwomenscup.workers.dev
