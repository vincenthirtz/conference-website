# « e2e » — la suite Playwright, contre une Supabase JETABLE.
#
# POURQUOI CE FICHIER EXISTE.
# La suite e2e ne tournait nulle part. Sur le Mac, elle fait chauffer la
# machine ; en local, `.env` pointe sur la base de PRODUCTION, si bien que le
# garde-fou de `tests/utils/supabaseTestClient.ts` interrompt toute spec qui
# sème — elles sont donc ignorées, pas exécutées. Résultat : 87 specs écrites,
# aucune jouée. Un runner GitHub règle les deux à la fois : il est froid, et sa
# Supabase est locale au job, créée puis détruite avec lui.
#
# LE SOCLE.
# `database/migrations/` contient 340 fichiers SANS horodatage, non rejouables
# dans l'ordre. `supabase start` applique donc un SOCLE unique,
# supabase/migrations/00000000000000_baseline.sql (schéma public de prod,
# reconstruit par introspection du catalogue, sans aucune donnée), puis
# supabase/seed.sql (tenant par défaut). Voir docs/E2E-LOCAL-SUPABASE.md.
# Si le socle manque, le job échoue AVEC UN MESSAGE explicite.
#
# QUATRE TRANCHES en parallèle, chacune avec sa Supabase ; un job final
# fusionne leurs rapports en un seul rapport HTML (artefact playwright-report).
#
# DÉCLENCHEMENT MANUEL ET NOCTURNE, pas à chaque push : la suite est longue, et
# la CI rapide (typecheck + unitaires) reste le filet du quotidien.

name: e2e

on:
  workflow_dispatch:
  # `workflow_dispatch` n'est déclenchable que si le fichier existe sur la
  # branche PAR DÉFAUT (master), ce qui n'est pas le cas : un push sur la
  # branche de validation dédiée le déclenche donc aussi. Jamais `work`.
  # `e2e-baseline` = code de prod + infra e2e seule : la référence qui
  # départage régressions d'un chantier et échecs préexistants.
  push:
    branches: [admin-industrialisation, e2e-baseline]
  schedule:
    # 04:12 UTC — tôt, et pas à l'heure pile, pour éviter la cohue des runners.
    - cron: '12 4 * * *'

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Par tranche : ~1/4 de la suite + démarrage Supabase/Next.
    timeout-minutes: 30
    strategy:
      # Une tranche rouge ne doit pas annuler les autres : on veut le bilan
      # complet de la suite, pas le premier échec.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Vérifier la présence du socle de schéma
        run: |
          if [ ! -d supabase/migrations ] || [ -z "$(ls -A supabase/migrations 2>/dev/null)" ]; then
            echo "::error::Aucun socle de schéma dans supabase/migrations/."
            echo "Les 340 fichiers de database/migrations/ ne sont pas rejouables"
            echo "en l'état (pas d'horodatage, donc pas d'ordre). Générez le socle"
            echo "une fois — voir docs/E2E-LOCAL-SUPABASE.md — puis relancez."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # CHAQUE tranche a SA Supabase : les specs sèment et nettoient, deux
      # tranches sur une même base se marcheraient dessus.
      - name: Démarrer une Supabase locale
        run: supabase start

      - name: Relever l'URL et les clés de l'instance
        id: sb
        run: |
          # `supabase status -o env` rend des KEY="value" ; $GITHUB_ENV ne retire
          # PAS les guillemets — ils finiraient DANS la valeur, et supabase-js
          # rejetterait `"http://127.0.0.1:54321"` (« Invalid supabaseUrl »).
          supabase status -o env | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Installer les dépendances
        run: npm ci

      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Les navigateurs sont gros et ne dépendent que de la version de
      # Playwright : sûrs à mettre en cache. Les dépendances système (apt),
      # elles, ne le sont pas — elles sont réinstallées à chaque fois.
      # restore/save séparés : `actions/cache` ne sauvegarde qu'en fin de job
      # RÉUSSI — or une tranche rouge est ici le cas courant, et le cache ne
      # se remplirait jamais.
      - name: Cache des navigateurs Playwright
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Installer Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dépendances système de Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Sauver le cache des navigateurs
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Jouer la tranche ${{ matrix.shard }}/4
        env:
          # La suite ET le serveur Next visent la MÊME instance jetable. C'est
          # tout l'intérêt : plus aucune spec n'a de raison d'être ignorée, et
          # aucune ne peut atteindre la production.
          TEST_SUPABASE_URL: ${{ env.API_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          JWT_SECRET: e2e-jwt-secret-not-a-real-one
          NODE_ENV: test
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob

      - name: Conserver le rapport de la tranche
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    # Même si des tranches échouent : c'est justement là qu'on veut le rapport.
    if: always()
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Récupérer les rapports des tranches
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Fusionner en un rapport HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Conserver le rapport
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
