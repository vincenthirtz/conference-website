[build]
  command = "npm ci && npm run build"
  publish = ".next"
  # Pas de déploiement pour un commit qui ne touche que les tests, la doc, les
  # fichiers Markdown ou les workflows GitHub : rien de ce qui est servi ne
  # change, et chaque déploiement vide le cache ISR — la première visite
  # régénère alors des dizaines de pages, chacune relisant Supabase (journée du
  # 2026-10-13 : huit déploiements pour des commits de tests, ~1 000 lectures
  # chacun). Sortie 0 = build ignoré, 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)tests' ':(exclude)docs' ':(exclude)*.md' ':(exclude).github'"

[build.environment]
  # Node 24 (LTS) partout : .nvmrc, CI, Netlify. Ce n'est plus un confort :
  # @supabase/supabase-js >= 2.116 déclare `node >= 22`, @netlify/functions 6 et
  # Vitest 5 exigent >= 22.12. Les fonctions Netlify
  # (crons, handlers Next) tournent sur la version de Node du build.
  # Plus de NPM_VERSION épinglé (10.8.2 était le npm de Node 20) : on prend le
  # npm 11 livré avec Node 24, comme en local.
  NODE_VERSION = "24"
  # `next build` (Turbopack + TypeScript) peut dépasser le heap Node par défaut
  # (~2 Go) sur la machine de build : la surface de types i18n (locales JSON
  # volumineuses + assertions de parité `typeof fr` + génériques useT/useAdminT)
  # a fait OOM le build. On donne 4 Go de heap (l'image Netlify a ~8 Go de RAM).
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  directory = "netlify/functions"

# Tâches planifiées : plus aucune ici depuis la bascule vers Cloudflare
# (2026-10-28). Les 28 tâches tournent dans le Worker, déclenché chaque minute
# (cloudflare/crons.ts, docs/CLOUDFLARE.md). Le dossier ne garde que builds.ts.

# Edge Function: relais même-origine /api/<famille>/… → conference-api
# (https://api.owwomenscup.fr) pour les familles liées aux cookies du site.
# INERTE TANT QUE API_PROXY_PREFIXES ET EDGE_PROXY_SECRET NE SONT PAS POSÉS :
# chaque requête /api/* rend alors la main (`context.next()`) à la fonction
# serveur Next, comme avant. Doc : docs/EDGE-API-PROXY.md.
#
# Pourquoi netlify.toml plutôt que `export const config` dans le fichier :
#   - Les Edge Functions s'exécutent en tête de chaîne, avant le cache, les
#     redirections et les fonctions serverless — dont la fonction serveur que
#     génère @netlify/plugin-nextjs pour pages/api. `context.next()` passe la
#     requête à la suite de cette chaîne.
#   - Entre Edge Functions, celles de netlify.toml passent avant celles
#     déclarées en ligne (ordre de déclaration, puis alphabétique). Ici la
#     seule autre est le middleware Next (proxy.ts), dont le matcher exclut
#     /api : pas de concurrence sur ce chemin.
#   - Le dépôt centralise déjà routage et planning dans ce fichier.
# Source : https://docs.netlify.com/edge-functions/declarations/ (ordre de
# traitement) et https://docs.netlify.com/edge-functions/overview/.
# Limite à garder en tête : premier octet de réponse sous 40 s, sinon 502.
[[edge_functions]]
  path = "/api/*"
  function = "api-proxy"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOW-FROM https://www.youtube.com/"

# T7: /embed/* are public read-only widgets (bracket iframe) meant to be
# embedded on third-party sites/streams. The global X-Frame-Options above is a
# legacy header that modern browsers treat as DENY/SAMEORIGIN for non-standard
# values — it would block the iframe regardless of CSP. Clear it here so the
# per-request `frame-ancestors *` set in proxy.ts is the sole framing policy
# for this prefix. Every other route keeps the strict header above.
[[headers]]
  for = "/embed/*"
  [headers.values]
    X-Frame-Options = ""

# Service Worker for /admin PWA: served from /sw.js (registered with scope '/'
# so it can receive push events outside the /admin route). no-cache so SW
# updates propagate quickly. Service-Worker-Allowed lifts the scope cap.
# Chargeur Turbopack (pages/_document.tsx, utils/csp/turbopackBootstrap.ts) :
# appelé avec ?v=<empreinte>, il peut être gardé un an — une nouvelle version
# change d'URL.
[[headers]]
  for = "/turbopack-bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=utf-8"

[[plugins]]
  package = "@netlify/plugin-nextjs"
