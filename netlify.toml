[build]
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.18.1"
  NPM_VERSION = "10.8.2"

[functions]
  directory = "netlify/functions"

# Scheduled function: process per-match check-in flow every 5 minutes.
# (emails 1h before, Discord reminders at T-30/T-15, auto-forfeit at T-0)
[functions."checkin-cron"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOW-FROM https://www.youtube.com/"

[[plugins]]
  package = "@netlify/plugin-nextjs"
