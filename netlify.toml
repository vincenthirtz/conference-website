[build]
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.18.1"
  NPM_VERSION = "10.8.2"
  # `next build` (Turbopack + TypeScript) peut dépasser le heap Node par défaut
  # (~2 Go) sur la machine de build : la surface de types i18n (locales JSON
  # volumineuses + assertions de parité `typeof fr` + génériques useT/useAdminT)
  # a fait OOM le build. On donne 4 Go de heap (l'image Netlify a ~8 Go de RAM).
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  directory = "netlify/functions"

# Scheduled function: process per-match check-in flow every 5 minutes.
# (emails 1h before, Discord reminders at T-30/T-15, auto-forfeit at T-0)
[functions."checkin-cron"]
  schedule = "*/5 * * * *"

# Scheduled function: process broadcast email waves once per day at 10:00 UTC
# (12h Paris en hiver, 11h en été). Quota Brevo gratuit = 300 emails/jour.
[functions."broadcast-cron"]
  schedule = "0 10 * * *"

# Scheduled function: hourly maintenance of bot_event_outbox.
# Mark poison-pill 'pending' events as 'failed' (default >6h old), delete
# 'delivered'/'failed' rows older than N days (default 7), log delivery latency
# stats (p50/p95). Configurable via OUTBOX_FAILED_AFTER_HOURS / OUTBOX_DELETE_AFTER_DAYS.
[functions."outbox-maintenance-cron"]
  schedule = "0 * * * *"

# Scheduled function: fan-out des events bot_event_outbox vers les
# subscriptions Web Push de la PWA /admin (1 minute = latence max ~2 min).
# Lit l'outbox en read-only (ne touche pas .status, qui appartient au bot
# Discord). Tracking dans web_push_deliveries. Configurable via
# WEB_PUSH_BATCH_LIMIT (defaut 200) / WEB_PUSH_WINDOW_HOURS (defaut 24).
# Requiert NEXT_PUBLIC_VAPID_PUBLIC_KEY + VAPID_PRIVATE_KEY en env.
[functions."web-push-dispatcher-cron"]
  schedule = "* * * * *"

# Scheduled function: outbound webhooks dispatcher. Lit bot_event_outbox en
# read-only (ne touche pas .status, qui appartient au bot Discord), fan-out vers
# les webhook_subscriptions actives de chaque tenant (POST signe HMAC), tracking
# + retry dans webhook_deliveries. Tunable: WEBHOOK_BATCH_LIMIT (defaut 200) /
# WEBHOOK_WINDOW_HOURS (defaut 24).
[functions."webhook-dispatcher-cron"]
  schedule = "* * * * *"

# Scheduled function: server-side fallback overrun escalation (lot 6).
# Le client-side (useOverrunWatcher dans Director tab) fait l'escalation
# T+0/T+2min/T+5min. Si l'onglet est ferme, ce cron prend le relais a
# T+5min..T+7min (selon le tick). Dedup via event_cues.dedup_key (partial
# unique index uq_event_cues_dedup_key). Scan cross-tenant via supabaseAdmin.
[functions."overrun-watcher-cron"]
  schedule = "*/2 * * * *"

# Scheduled function: dispute SLA breach detector (Lot 4 — Open Disputes Board).
# Scans active tenants for matches `status='disputed'` whose
# `dispute_opened_at` is older than `tenants.dispute_sla_minutes` AND
# `escalation_pinged_at IS NULL`. Emits one `dispute.sla_breached` outbox
# event per breach and stamps the match so it's not re-escalated. Bot picks
# up the event and DMs the configured staff role.
[functions."dispute-sla-cron"]
  schedule = "*/5 * * * *"

# Scheduled function: refresh the global LoL/Dota 2 hero pool (Lot 1 — MOBA
# draft system). Hits Riot Data Dragon + OpenDota once per day and upserts
# into public.game_heroes. Off-peak UTC slot so upstream APIs are quiet and
# we don't fight the European prime time. Heartbeat in site_settings under
# `last_cron_sync_game_heroes_at`.
[functions."sync-game-heroes-cron"]
  schedule = "0 4 * * *"

# Scheduled function: digest email des events bot_event_outbox vers les users
# opt-IN (canal email). TWICE DAILY pour rester un vrai digest et sous le quota
# Brevo (300 emails/jour free tier). Cron `0 7,17 * * *` en UTC (≈ 08h/18h
# Paris en hiver, 09h/19h en été). Délègue à utils/emailDispatcher.ts.
# Requiert CRON_SECRET + BREVO_API_KEY + EMAIL_FROM en env.
[functions."email-digest-cron"]
  schedule = "0 7,17 * * *"

# Scheduled function: server-side draft timer (Lot 3 — MOBA draft system).
# Every minute, scans match_drafts status='in_progress' whose current
# match_draft_steps.deadline_at has passed and auto-picks a deterministic
# eligible hero. The captain UI (Lot 4) drives the live countdown via
# Supabase Realtime — this cron is the catch-all when nobody is watching.
# Heartbeat: site_settings.last_cron_draft_auto_pick_at.
[functions."draft-auto-pick-cron"]
  schedule = "* * * * *"

# Scheduled function: relance des grilles de dispo scrim. Deux fois par jour,
# émet un `scrim.planning.reminder` pour chaque grille ouverte dont l'horizon
# approche et où une équipe n'a pas encore peint (idempotent via
# scrim_plannings.reminder_pinged_at).
[functions."scrim-planning-reminders-cron"]
  schedule = "0 9,18 * * *"

# Scheduled function: paid-plan lifecycle (« Régie solidaire », axe 06 — revenu
# récurrent). Une fois par jour à 08:00 UTC. Sur les tenants regie/circuit :
# bascule en 'past_due' les plans actifs expirés, et envoie aux owners une
# relance de renouvellement ~14j avant échéance (une seule / cycle, garde
# tenants.plan_last_reminder_at). Requiert CRON_SECRET + BREVO_API_KEY + EMAIL_FROM.
[functions."plan-renewal-cron"]
  schedule = "0 8 * * *"

# Scheduled function: rappel J-1 des cartes du Kanban interne dont l'échéance
# (`tasks.due_date`) tombe demain et qui ne sont pas dans une colonne terminale.
# Une fois par jour à 08:00 UTC (≈ 09h/10h Paris) — le matin pour un rappel J-1.
# Émet `task.due_soon` (outbox → push/DM Discord). Idempotent : cible exactement
# `due_date = CURRENT_DATE + 1`. Requiert CRON_SECRET + URL (ou SITE_URL).
# Scheduled function: rafraichit les jetons longue duree des comptes reseaux
# (Instagram) AVANT leur echeance. Le jeton meurt a ~60 jours et ne se
# rafraichit qu'avec un jeton encore valide : passe la date, il faut re-cliquer
# le consentement a la main. On s'y prend dix jours a l'avance.
[functions."social-token-refresh-cron"]
  schedule = "0 6 * * *"

# Scheduled function: recopie les nouveaux posts Bluesky de l'association dans
# le salon Discord configure (site_settings.bluesky_mirror_channel_id). Le fil
# se lit sans authentification ; le curseur vit cote site pour qu'un
# redemarrage du bot ne republie pas tout le fil.
[functions."bluesky-mirror-cron"]
  schedule = "*/15 * * * *"

[functions."task-due-reminders-cron"]
  schedule = "0 8 * * *"

# Scheduled function: digest matinal des boards Kanban internes. Pour chaque
# board non archivé, agrège les compteurs (total, colonnes, overdue, dueToday)
# et émet un event `task.digest` par tenant (outbox → push/DM Discord).
# Une fois par jour à 07:30 UTC — juste avant les rappels d'échéance de 08:00,
# pour un point de situation matinal. Requiert CRON_SECRET + URL (ou SITE_URL).
[functions."task-board-digest-cron"]
  schedule = "30 7 * * *"

# Scheduled function: relance des équipes dans LEUR salon textuel Discord pour
# compléter leur roster avant le verrouillage. Tourne tous les jours à 09:00 UTC
# mais n'envoie qu'aux jalons J-21/14/7/3/1 avant
# `site_settings.roster_lock_deadline` (fallback `tournaments.start_date`) — le
# ciblage sur un jour exact tient lieu de déduplication. Seules les équipes avec
# un motif réel (roster incomplet, comptes jamais connectés, BattleTag manquant)
# sont notifiées. Émet `team.message` (outbox → bot). Requiert CRON_SECRET + URL.
[functions."team-roster-reminders-cron"]
  schedule = "0 9 * * *"

# N7 — récap hebdomadaire d'équipe. Lundi 09:00 UTC : la semaine écoulée est
# close et la suivante se prépare. N'émet `team.weekly.recap` que pour les
# équipes dont la semaine a quelque chose à raconter (jamais pour une équipe
# dormante), au plus une fois par équipe et par semaine. La livraison passe par
# les dispatchers push/email existants. Requiert CRON_SECRET + URL.
[functions."team-weekly-recap-cron"]
  schedule = "0 9 * * 1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOW-FROM https://www.youtube.com/"

# T7: /embed/* are public read-only widgets (bracket iframe) meant to be
# embedded on third-party sites/streams. The global X-Frame-Options above is a
# legacy header that modern browsers treat as DENY/SAMEORIGIN for non-standard
# values — it would block the iframe regardless of CSP. Clear it here so the
# per-request `frame-ancestors *` set in proxy.ts is the sole framing policy
# for this prefix. Every other route keeps the strict header above.
[[headers]]
  for = "/embed/*"
  [headers.values]
    X-Frame-Options = ""

# Service Worker for /admin PWA: served from /sw.js (registered with scope '/'
# so it can receive push events outside the /admin route). no-cache so SW
# updates propagate quickly. Service-Worker-Allowed lifts the scope cap.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=utf-8"

[[plugins]]
  package = "@netlify/plugin-nextjs"
